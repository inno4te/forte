<!-- ===================== TOOL 43: METRONOME ===================== -->
<script>
RENDER.metronome = function(){
  const body=document.getElementById('toolBody');
  body.innerHTML=`<div class="panel" style="text-align:center;">
    <div class="big-result" id="mtBpm">120 BPM</div>
    <input type="range" id="mtSlider" min="40" max="240" value="120" oninput="mtSetBpm(this.value)" style="width:100%;">
    <div class="row" style="justify-content:center;margin-top:10px;">
      <button class="btn" id="mtToggle" onclick="mtToggle()">▶ Start</button>
      <button class="btn ghost" onclick="mtTap()">Tap Tempo</button>
    </div>
    <div id="mtPulse" style="width:40px;height:40px;border-radius:50%;background:var(--panel2);margin:16px auto;"></div>
  </div>`;
};
let mtBpm=120, mtCtx=null, mtRunning=false, mtNextTime=0, mtTimer=null, mtTaps=[];
function mtSetBpm(v){ mtBpm=parseInt(v); document.getElementById('mtBpm').textContent=mtBpm+' BPM'; }
function mtTap(){
  const now=Date.now(); mtTaps.push(now); mtTaps=mtTaps.filter(t=>now-t<3000);
  if(mtTaps.length>1){
    const intervals=[]; for(let i=1;i<mtTaps.length;i++) intervals.push(mtTaps[i]-mtTaps[i-1]);
    const avg=intervals.reduce((a,b)=>a+b,0)/intervals.length;
    mtSetBpm(Math.round(60000/avg)); document.getElementById('mtSlider').value=mtBpm;
  }
}
function mtToggle(){
  const btn=document.getElementById('mtToggle');
  if(!mtRunning){
    mtCtx = mtCtx || new (window.AudioContext||window.webkitAudioContext)();
    mtRunning=true; btn.textContent='■ Stop'; mtNextTime=mtCtx.currentTime;
    mtScheduler();
  } else { mtRunning=false; btn.textContent='▶ Start'; clearTimeout(mtTimer); }
}
function mtScheduler(){
  if(!mtRunning) return;
  while(mtNextTime < mtCtx.currentTime+0.1){
    const osc=mtCtx.createOscillator(), gain=mtCtx.createGain();
    osc.frequency.value=1000; gain.gain.value=0.3;
    osc.connect(gain); gain.connect(mtCtx.destination);
    osc.start(mtNextTime); osc.stop(mtNextTime+0.05);
    const delay=(mtNextTime-mtCtx.currentTime)*1000;
    setTimeout(()=>{ const p=document.getElementById('mtPulse'); if(p){ p.style.background='var(--accent)'; setTimeout(()=>p.style.background='var(--panel2)',80); } }, Math.max(0,delay));
    mtNextTime += 60/mtBpm;
  }
  mtTimer=setTimeout(mtScheduler,25);
}
</script>

<script>
RENDER.faceidvault = function(){

    <div class="note">Gates a small private note vault behind your device's Face ID / Touch ID (via WebAuthn). This confirms it's really you unlocking it, but notes are still stored in this browser's local storage — don't use it for anything highly sensitive like passwords or financial details.</div>
    <div style="margin-top:12px;">
      ${hasCred? `<button class="btn" onclick="fvUnlock()">🔓 Unlock with Face ID / Touch ID</button>` : `<button class="btn" onclick="fvSetup()">Set Up Face ID Lock</button>`}
    </div>
    <div id="fvArea" style="margin-top:14px;"></div>
  </div>`;
};
async function fvSetup(){
  if(!window.PublicKeyCredential) return toast('WebAuthn not supported in this browser');
  try{
    const cred=await navigator.credentials.create({publicKey:{
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp:{name:'ForTe WebSwissKnife'},
      user:{id:crypto.getRandomValues(new Uint8Array(16)), name:'inno', displayName:'Inno'},
      pubKeyCredParams:[{type:'public-key',alg:-7}],
      authenticatorSelection:{authenticatorAttachment:'platform', userVerification:'required'},
      timeout:60000
    }});
    localStorage.setItem('fw_vault_cred', btoa(String.fromCharCode(...new Uint8Array(cred.rawId))));
    toast('Face ID lock set up'); openTool('faceidvault');
  }catch(err){ toast('Setup failed: '+err.message); }
}
async function fvUnlock(){
  try{
    const idB64=localStorage.getItem('fw_vault_cred');
    const rawId=Uint8Array.from(atob(idB64), c=>c.charCodeAt(0));
    await navigator.credentials.get({publicKey:{
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials:[{id:rawId, type:'public-key'}],
      userVerification:'required', timeout:60000
    }});
    fvShowVault();
  }catch(err){ toast('Unlock failed or cancelled'); }
}
function fvShowVault(){
  const notes=localStorage.getItem('fw_vault_notes')||'';
  document.getElementById('fvArea').innerHTML=`
    <textarea id="fvNotes" rows="10" style="width:100%;">${notes}</textarea>
    <div class="row" style="margin-top:8px;">
      <button class="btn" onclick="localStorage.setItem('fw_vault_notes',document.getElementById('fvNotes').value);toast('Saved')">Save</button>
      <button class="btn ghost" onclick="openTool('faceidvault')">🔒 Lock</button>
    </div>`;
}
</script>

<!-- ===================== TOOL 48: SKY GUIDE ===================== -->
<script>
RENDER.skyguide = function(){
  const body=document.getElementById('toolBody');
  body.innerHTML=`<div class="panel">
    <button class="btn" onclick="skyCompute()">Get Sky Info for My Location</button>
    <div id="skyOut" style="margin-top:14px;"></div>
    <div class="note" style="margin-top:10px;">Approximate astronomical calculations — accurate to within a few minutes.</div>
  </div>`;
};
function skyCompute(){
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude:lat, longitude:lon}=pos.coords;
    const now=new Date();
    const sun=skySunPosition(now, lat, lon);
    const moon=skyMoonPhase(now);
    document.getElementById('skyOut').innerHTML=`
      <div class="grid g2">
        <div class="result">Sun Azimuth<br><span class="mono">${sun.azimuth.toFixed(1)}°</span></div>
        <div class="result">Sun Elevation<br><span class="mono">${sun.elevation.toFixed(1)}°</span></div>
        <div class="result">Moon Phase<br><span class="mono">${moon.name} (${moon.illum}%)</span></div>
        <div class="result">Golden Hour<br><span class="mono">${sun.elevation<10&&sun.elevation>-4?'Now!':(sun.elevation>10?'Later today':'Not now')}</span></div>
      </div>`;
  }, ()=>toast('Location permission needed'));
}
function skySunPosition(date, lat, lon){
  const rad=Math.PI/180;
  const dayMs=1000*60*60*24;
  const J1970=2440588, J2000=2451545;
  const toJulian=d=>d.valueOf()/dayMs - 0.5 + J1970;
  const d=toJulian(date)-J2000;
  const M=rad*(357.5291+0.98560028*d);
  const C=rad*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M));
  const P=rad*102.9372;
  const L=M+C+P+Math.PI;
  const e=rad*23.4397;
  const dec=Math.asin(Math.sin(e)*Math.sin(L));
  const ra=Math.atan2(Math.sin(L)*Math.cos(e), Math.cos(L));
  const lw=rad*-lon, phi=rad*lat;
  const gmst=rad*(280.16+360.9856235*d);
  const H=gmst-lw-ra;
  const az=Math.atan2(Math.sin(H), Math.cos(H)*Math.sin(phi)-Math.tan(dec)*Math.cos(phi));
  const el=Math.asin(Math.sin(phi)*Math.sin(dec)+Math.cos(phi)*Math.cos(dec)*Math.cos(H));
  return {azimuth:(az/rad+180)%360, elevation:el/rad};
}
function skyMoonPhase(date){
  const synodic=29.53058867;
  const known=new Date(Date.UTC(2000,0,6,18,14));
  const days=(date-known)/86400000;
  const phase=((days % synodic)+synodic)%synodic;
  const illum=Math.round((1-Math.cos(2*Math.PI*phase/synodic))/2*100);
  let name='New Moon';
  if(phase<1.8) name='New Moon'; else if(phase<7.4) name='Waxing Crescent'; else if(phase<9.2) name='First Quarter';
  else if(phase<14.8) name='Waxing Gibbous'; else if(phase<16.6) name='Full Moon'; else if(phase<22.1) name='Waning Gibbous';
  else if(phase<23.9) name='Last Quarter'; else if(phase<29.5) name='Waning Crescent'; else name='New Moon';
  return {name, illum};
}
</script>

<!-- ===================== TOOL 51: INSTRUMENT TUNER ===================== -->
<script>
RENDER.tuner = function(){
  const body=document.getElementById('toolBody');
  body.innerHTML=`<div class="panel">
    <button class="btn" id="tuBtn" onclick="tuToggle()">🎙 Start Listening</button>
    <div class="big-result" id="tuNote" style="margin-top:14px;">--</div>
    <div class="result" id="tuFreq" style="margin-top:8px;">-- Hz</div>
    <canvas id="tuMeter" width="400" height="60" style="margin-top:10px;width:100%;max-width:400px;"></canvas>
    <canvas id="tuSpectrum" width="700" height="120" style="margin-top:10px;width:100%;"></canvas>
  </div>`;
};
let tuCtx=null, tuAnalyser=null, tuRunning=false, tuStream=null;
const NOTE_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
async function tuToggle(){
  const btn=document.getElementById('tuBtn');
  if(tuRunning){ tuRunning=false; btn.textContent='🎙 Start Listening'; if(tuStream) tuStream.getTracks().forEach(t=>t.stop()); return; }
  tuStream=await navigator.mediaDevices.getUserMedia({audio:true});
  tuCtx = tuCtx || new (window.AudioContext||window.webkitAudioContext)();
  const src=tuCtx.createMediaStreamSource(tuStream);
  tuAnalyser=tuCtx.createAnalyser(); tuAnalyser.fftSize=2048;
  src.connect(tuAnalyser);
  tuRunning=true; btn.textContent='■ Stop';
  tuLoop();
}
function tuAutoCorrelate(buf, sampleRate){
  let SIZE=buf.length, rms=0;
  for(let i=0;i<SIZE;i++) rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/SIZE);
  if(rms<0.01) return -1;
  let r1=0,r2=SIZE-1, thresh=0.2;
  for(let i=0;i<SIZE/2;i++) if(Math.abs(buf[i])<thresh){ r1=i; break; }
  for(let i=1;i<SIZE/2;i++) if(Math.abs(buf[SIZE-i])<thresh){ r2=SIZE-i; break; }
  buf=buf.slice(r1,r2); SIZE=buf.length;
  const c=new Array(SIZE).fill(0);
  for(let i=0;i<SIZE;i++) for(let j=0;j<SIZE-i;j++) c[i]+=buf[j]*buf[j+i];
  let d=0; while(c[d]>c[d+1]) d++;
  let maxval=-1, maxpos=-1;
  for(let i=d;i<SIZE;i++){ if(c[i]>maxval){ maxval=c[i]; maxpos=i; } }
  let T0=maxpos;
  if(T0<=0) return -1;
  return sampleRate/T0;
}
function tuLoop(){
  if(!tuRunning) return;
  const buf=new Float32Array(tuAnalyser.fftSize);
  tuAnalyser.getFloatTimeDomainData(buf);
  const freq=tuAutoCorrelate(buf, tuCtx.sampleRate);
  if(freq>0){
    const noteNum=12*(Math.log2(freq/440))+69;
    const rounded=Math.round(noteNum);
    const name=NOTE_NAMES[(rounded+120)%12]+ (Math.floor(rounded/12)-1);
    const cents=Math.round((noteNum-rounded)*100);
    document.getElementById('tuNote').textContent=name;
    document.getElementById('tuFreq').textContent=freq.toFixed(1)+' Hz · '+(cents>0?'+':'')+cents+' cents';
    const cv=document.getElementById('tuMeter'), ctx=cv.getContext('2d');
    ctx.fillStyle='#0c0e11'; ctx.fillRect(0,0,400,60);
    ctx.strokeStyle='#2c343d'; ctx.beginPath(); ctx.moveTo(200,0); ctx.lineTo(200,60); ctx.stroke();
    const x=200+cents*3;
    ctx.fillStyle=Math.abs(cents)<5?'#5fd07d':'#ff9640'; ctx.fillRect(x-3,10,6,40);
  }
  const spec=new Uint8Array(tuAnalyser.frequencyBinCount);
  tuAnalyser.getByteFrequencyData(spec);
  const sc=document.getElementById('tuSpectrum'), sctx=sc.getContext('2d');
  sctx.fillStyle='#0c0e11'; sctx.fillRect(0,0,700,120);
  sctx.fillStyle='#45d6c4';
  for(let i=0;i<200;i++){ const v=spec[i]; sctx.fillRect(i*3.5,120-v/2,3,v/2); }
  requestAnimationFrame(tuLoop);
}
</script>

<script>
RENDER.ebookreader = function(){
  const body=document.getElementById('toolBody');
  body.innerHTML=`
  <div class="panel">
    <div class="row">
      <input type="file" id="ebFile" accept=".pdf,.epub,.txt,.mobi,.fb2">
      <button class="btn ghost" onclick="ebPrev()">◀ Prev</button>
      <button class="btn ghost" onclick="ebNext()">Next ▶</button>
      <span class="result" id="ebPage">–</span>
    </div>
    <div class="row" style="margin-top:8px;"><label>Text size</label>
      <input type="range" id="ebFont" min="12" max="28" value="17" oninput="ebSetFont(this.value)"></div>
    <div class="note" id="ebNote">Reads PDF and EPUB natively, plus plain .txt. MOBI/FB2 aren't readable directly in-browser — convert to EPUB first (e.g. with the free Calibre app), then open the .epub here.</div>
    <div id="ebViewer" style="margin-top:12px;min-height:400px;background:#fff;color:#111;border-radius:8px;overflow:auto;max-height:70vh;"></div>
  </div>`;
  document.getElementById('ebFile').onchange = ebLoad;
};
let ebMode=null, ebPdfDoc=null, ebPdfPage=1, ebRendition=null, ebTxtPages=[], ebTxtIdx=0, ebFontSize=17;
async function ebLoad(e){
  const f=e.target.files[0]; if(!f) return;
  const name=f.name.toLowerCase();
  const viewer=document.getElementById('ebViewer'); viewer.innerHTML='';
  if(name.endsWith('.pdf')){
    ebMode='pdf';
    const buf=await f.arrayBuffer();
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    ebPdfDoc=await pdfjsLib.getDocument({data:buf}).promise;
    ebPdfPage=1; ebRenderPdfPage();
  } else if(name.endsWith('.epub')){
    ebMode='epub';
    const buf=await f.arrayBuffer();
    const book=ePub(buf);
    viewer.style.height='70vh';
    ebRendition=book.renderTo(viewer, {width:'100%', height:'100%'});
    ebRendition.display();
    ebRendition.themes.fontSize(ebFontSize+'px');
    document.getElementById('ebPage').textContent='EPUB loaded';
  } else if(name.endsWith('.txt')){
    ebMode='txt';
    const text=await f.text();
    const chunkSize=1800; ebTxtPages=[];
    for(let i=0;i<text.length;i+=chunkSize) ebTxtPages.push(text.slice(i,i+chunkSize));
    ebTxtIdx=0; ebRenderTxtPage();
  } else {
    toast('Unsupported format — try PDF, EPUB or TXT');
  }
}
function ebRenderPdfPage(){
  ebPdfDoc.getPage(ebPdfPage).then(page=>{
    const scale=1.3; const viewport=page.getViewport({scale});
    const canvas=document.createElement('canvas'); canvas.width=viewport.width; canvas.height=viewport.height;
    canvas.style.maxWidth='100%';
    const ctx=canvas.getContext('2d');
    page.render({canvasContext:ctx, viewport}).promise.then(()=>{
      const viewer=document.getElementById('ebViewer'); viewer.innerHTML=''; viewer.appendChild(canvas);
      document.getElementById('ebPage').textContent=`Page ${ebPdfPage} / ${ebPdfDoc.numPages}`;
    });
  });
}
function ebRenderTxtPage(){
  const viewer=document.getElementById('ebViewer');
  viewer.innerHTML=`<div style="padding:24px;font-size:${ebFontSize}px;line-height:1.7;white-space:pre-wrap;">${(ebTxtPages[ebTxtIdx]||'').replace(/</g,'&lt;')}</div>`;
  document.getElementById('ebPage').textContent=`Page ${ebTxtIdx+1} / ${ebTxtPages.length}`;
}
function ebPrev(){
  if(ebMode==='pdf'&&ebPdfPage>1){ebPdfPage--; ebRenderPdfPage();}
  else if(ebMode==='epub'&&ebRendition) ebRendition.prev();
  else if(ebMode==='txt'&&ebTxtIdx>0){ebTxtIdx--; ebRenderTxtPage();}
}
function ebNext(){
  if(ebMode==='pdf'&&ebPdfDoc&&ebPdfPage<ebPdfDoc.numPages){ebPdfPage++; ebRenderPdfPage();}
  else if(ebMode==='epub'&&ebRendition) ebRendition.next();
  else if(ebMode==='txt'&&ebTxtIdx<ebTxtPages.length-1){ebTxtIdx++; ebRenderTxtPage();}
}
function ebSetFont(v){ ebFontSize=+v; if(ebMode==='txt') ebRenderTxtPage(); if(ebRendition) ebRendition.themes.fontSize(v+'px'); }
</script>

<!-- ===================== TOOL 53: EMERGENCY SOS ===================== -->
<script>
RENDER.sos = function(){
  const body=document.getElementById('toolBody');
  const contacts=JSON.parse(localStorage.getItem('fw_sos_contacts')||'[]');
  body.innerHTML=`
  <div class="panel warn note">This sends a WhatsApp message with your live location to contacts <b>you</b> configure below. It does not contact police or ambulance services directly — for life-threatening emergencies, also call your local emergency number.</div>
  <div class="panel">
    <h3 style="margin-top:0;">1. Configure up to 3 contacts</h3>
    <div class="grid g3" id="sosContacts">
      ${[0,1,2].map(i=>`<div class="col"><label>Contact ${i+1} name</label><input type="text" id="sosName${i}" value="${(contacts[i]&&contacts[i].name)||''}" placeholder="e.g. Mum">
        <label>WhatsApp number (with country code)</label><input type="text" id="sosPhone${i}" value="${(contacts[i]&&contacts[i].phone)||''}" placeholder="+237..."></div>`).join('')}
    </div>
    <button class="btn" style="margin-top:10px;" onclick="sosSave()">Save contacts</button>
    <span class="note" id="sosSaveMsg" style="margin-left:8px;"></span>
  </div>
  <div class="panel" style="text-align:center;">
    <h3>2. In an emergency</h3>
    <p class="note">Tap once to send your location now. Press and hold for 5 seconds to sound a loud alarm.</p>
    <button class="sos-btn" id="sosBigBtn">HELP<br>NOW</button>
    <div class="result" id="sosStatus" style="margin-top:14px;">Ready.</div>
  </div>
  <div id="sosAlarmOverlay" style="display:none;position:fixed;inset:0;z-index:200;background:rgba(120,10,10,.96);
    display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;">
    <div style="font-family:var(--display);font-size:34px;font-weight:700;">🚨 ALARM ACTIVE 🚨</div>
    <div style="font-size:16px;margin-top:10px;">Tap twice, quickly, anywhere on this screen to stop.</div>
  </div>`;
  const btn=document.getElementById('sosBigBtn');
  let holdTimer=null, alarmFired=false;
  const startHold=()=>{ alarmFired=false; holdTimer=setTimeout(()=>{ alarmFired=true; sosTriggerAlarm(); }, 5000); };
  const endHold=()=>{ clearTimeout(holdTimer); if(!alarmFired) sosSendHelp(); };
  btn.addEventListener('pointerdown', startHold);
  btn.addEventListener('pointerup', endHold);
  btn.addEventListener('pointerleave', ()=>clearTimeout(holdTimer));
};
function sosSave(){
  const contacts=[0,1,2].map(i=>({name:document.getElementById('sosName'+i).value.trim(), phone:document.getElementById('sosPhone'+i).value.replace(/[^\d+]/g,'')})).filter(c=>c.phone);
  localStorage.setItem('fw_sos_contacts', JSON.stringify(contacts));
  document.getElementById('sosSaveMsg').textContent='Saved ✓';
  toast('Emergency contacts saved');
}
function sosSendHelp(){
  const contacts=JSON.parse(localStorage.getItem('fw_sos_contacts')||'[]');
  if(!contacts.length){ toast('Add at least one contact first'); return; }
  const status=document.getElementById('sosStatus');
  status.textContent='Getting your location…';
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude,longitude,accuracy}=pos.coords;
    const mapLink=`https://maps.google.com/?q=${latitude},${longitude}`;
    const msg=encodeURIComponent(`🚨 EMERGENCY — I need help.\nMy location: ${mapLink}\n(accuracy ~${Math.round(accuracy)}m)\nSent via ForTe WebSwissKnife SOS.`);
    contacts.forEach(c=>{ window.open(`https://wa.me/${c.phone.replace(/\D/g,'')}?text=${msg}`, '_blank'); });
    status.textContent=`Location sent to ${contacts.length} contact(s) via WhatsApp.`;
  }, err=>{ status.textContent='Location permission needed — enable it and try again.'; }, {enableHighAccuracy:true, timeout:10000});
}
let sosAudioCtx=null, sosOsc=null, sosAlarmOn=false, sosTapTimes=[];
function sosTriggerAlarm(){
  sosAlarmOn=true;
  const ov=document.getElementById('sosAlarmOverlay'); ov.style.display='flex';
  sosAudioCtx = sosAudioCtx || new (window.AudioContext||window.webkitAudioContext)();
  sosOsc=sosAudioCtx.createOscillator(); const gain=sosAudioCtx.createGain();
  sosOsc.type='square'; gain.gain.value=0.35; sosOsc.connect(gain); gain.connect(sosAudioCtx.destination);
  sosOsc.start();
  let up=true;
  sosAlarmSweep = setInterval(()=>{ sosOsc.frequency.setValueAtTime(up?1800:900, sosAudioCtx.currentTime); up=!up; }, 220);
  navigator.vibrate && navigator.vibrate([400,200,400,200,400]);
  sosTapTimes=[];
  ov.onclick=()=>{
    const now=Date.now(); sosTapTimes=sosTapTimes.filter(t=>now-t<700); sosTapTimes.push(now);
    if(sosTapTimes.length>=2) sosStopAlarm();
  };
}
let sosAlarmSweep=null;
function sosStopAlarm(){
  sosAlarmOn=false;
  if(sosOsc){ sosOsc.stop(); sosOsc=null; }
  clearInterval(sosAlarmSweep);
  document.getElementById('sosAlarmOverlay').style.display='none';
}
</script>

<script>
RENDER.stemplayer = function(){
  const body=document.getElementById('toolBody');
  body.innerHTML=`
  <div class="panel">
    <div class="row">
      <input type="file" id="stFiles" accept="audio/*" multiple>
      <button class="btn" onclick="stPlayAll()">▶ Play All</button>
      <button class="btn ghost" onclick="stPauseAll()">⏸ Pause</button>
      <button class="btn ghost" onclick="stStopAll()">■ Stop</button>
      <button class="btn ghost" onclick="stExportMix()">Export Mix (WAV)</button>
    </div>
    <div class="note">Upload separate stems (e.g. vocals.mp3, drums.mp3, bass.mp3, other.mp3) — they play in sync. Adjust each fader, mute or solo, then export the combined mix.</div>
    <div id="stTracks" style="margin-top:14px;display:flex;flex-direction:column;gap:10px;"></div>
  </div>`;
  document.getElementById('stFiles').onchange = stLoadFiles;
};
let stTracks=[]; // {name, audio, gainNode, muted, solo, buffer}
let stCtx=null;
async function stLoadFiles(e){
  stCtx = stCtx || new (window.AudioContext||window.webkitAudioContext)();
  const files=Array.from(e.target.files);
  for(const f of files){
    const url=URL.createObjectURL(f);
    const audio=new Audio(url); audio.loop=false; audio.crossOrigin='anonymous';
    const src=stCtx.createMediaElementSource(audio);
    const gainNode=stCtx.createGain(); gainNode.gain.value=1;
    src.connect(gainNode).connect(stCtx.destination);
    stTracks.push({name:f.name, audio, gainNode, muted:false, solo:false, file:f});
  }
  stRenderTracks();
}
function stRenderTracks(){
  const wrap=document.getElementById('stTracks'); wrap.innerHTML='';
  stTracks.forEach((t,i)=>{
    const row=document.createElement('div'); row.className='panel'; row.style.padding='10px 14px';
    row.innerHTML=`<div class="row" style="justify-content:space-between;">
      <b style="font-size:13px;">${t.name}</b>
      <div class="row" style="gap:6px;">
        <button class="btn ghost" onclick="stMute(${i})" id="stMuteBtn${i}">${t.muted?'🔇 Muted':'🔊 Mute'}</button>
        <button class="btn ghost" onclick="stSolo(${i})" id="stSoloBtn${i}">${t.solo?'★ Solo':'☆ Solo'}</button>
      </div></div>
      <input type="range" min="0" max="1.5" step="0.01" value="${t.gainNode.gain.value}" oninput="stSetGain(${i}, this.value)" style="width:100%;">`;
    wrap.appendChild(row);
  });
}
function stSetGain(i,v){ stTracks[i].gainNode.gain.value=+v; }
function stMute(i){ stTracks[i].muted=!stTracks[i].muted; stTracks[i].audio.muted=stTracks[i].muted; stRenderTracks(); }
function stSolo(i){
  stTracks[i].solo=!stTracks[i].solo;
  const anySolo=stTracks.some(t=>t.solo);
  stTracks.forEach((t,j)=>{ t.audio.muted = anySolo ? !t.solo : t.muted; });
  stRenderTracks();
}
function stPlayAll(){ stCtx.resume(); stTracks.forEach(t=>t.audio.play()); }
function stPauseAll(){ stTracks.forEach(t=>t.audio.pause()); }
function stStopAll(){ stTracks.forEach(t=>{ t.audio.pause(); t.audio.currentTime=0; }); }
async function stExportMix(){
  if(!stTracks.length){ toast('Load stems first'); return; }
  toast('Rendering mix…');
  const buffers=await Promise.all(stTracks.map(t=>t.file.arrayBuffer().then(b=>stCtx.decodeAudioData(b))));
  const maxLen=Math.max(...buffers.map(b=>b.length));
  const offline=new OfflineAudioContext(2, maxLen, stCtx.sampleRate);
  buffers.forEach((buf,i)=>{
    if(stTracks[i].muted) return;
    const src=offline.createBufferSource(); src.buffer=buf;
    const g=offline.createGain(); g.gain.value=stTracks[i].gainNode.gain.value;
    src.connect(g).connect(offline.destination); src.start(0);
  });
  const rendered=await offline.startRendering();
  const wav=stBufferToWav(rendered);
  download('forte-stem-mix.wav', new Blob([wav], {type:'audio/wav'}));
  toast('Mix exported');
}
function stBufferToWav(buffer){
  const numCh=buffer.numberOfChannels, len=buffer.length*numCh*2+44;
  const arrBuf=new ArrayBuffer(len), view=new DataView(arrBuf);
  const writeStr=(o,s)=>{ for(let i=0;i<s.length;i++) view.setUint8(o+i, s.charCodeAt(i)); };
  writeStr(0,'RIFF'); view.setUint32(4, len-8, true); writeStr(8,'WAVE'); writeStr(12,'fmt ');
  view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,numCh,true);
  view.setUint32(24, buffer.sampleRate, true); view.setUint32(28, buffer.sampleRate*numCh*2, true);
  view.setUint16(32, numCh*2, true); view.setUint16(34,16,true); writeStr(36,'data'); view.setUint32(40, len-44, true);
  let off=44;
  for(let i=0;i<buffer.length;i++) for(let ch=0;ch<numCh;ch++){
    let s=Math.max(-1,Math.min(1, buffer.getChannelData(ch)[i]));
    view.setInt16(off, s<0?s*0x8000:s*0x7FFF, true); off+=2;
  }
  return arrBuf;
}
</script>

<script>
RENDER.chess = function(){
  const body=document.getElementById('toolBody');
  body.innerHTML=`
  <div class="panel">
    <div class="row">
      <label>Difficulty</label>
      <select id="chDiff"><option value="1">Easy</option><option value="2" selected>Medium</option><option value="3">Hard</option></select>
      <button class="btn ghost" onclick="chNewGame()">New Game</button>
      <label style="margin-left:10px;"><input type="checkbox" id="chPlayBlack" onchange="chNewGame()"> Play as Black</label>
    </div>
    <div class="result" id="chStatus" style="margin-top:8px;">White to move.</div>
    <div id="chBoard" style="display:grid;grid-template-columns:repeat(8,minmax(0,1fr));max-width:420px;margin-top:12px;border:2px solid var(--line);"></div>
  </div>`;
  chNewGame();
};
let chGame=null, chSel=null, chPlayerColor='w';
function chNewGame(){
  chGame=new Chess(); chSel=null;
  chPlayerColor=document.getElementById('chPlayBlack').checked?'b':'w';
  chDraw();
  if(chPlayerColor==='b') setTimeout(chComputerMove, 400);
}
function chPieceChar(p){
  const map={p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'};
  const c=map[p.type]; return p.color==='w'? {P:'♙',N:'♘',B:'♗',R:'♖',Q:'♕',K:'♔'}[p.type.toUpperCase()] : c;
}
function chDraw(){
  const boardEl=document.getElementById('chBoard'); boardEl.innerHTML='';
  const board=chGame.board();
  const legal = chSel ? chGame.moves({square:chSel, verbose:true}).map(m=>m.to) : [];
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    const file='abcdefgh'[c], rank=8-r, sq=file+rank;
    const piece=board[r][c];
    const dark=(r+c)%2===1;
    const cell=document.createElement('div');
    cell.style.cssText=`aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;
      background:${dark?'#4a4038':'#e8dfd0'};position:relative;`;
    if(sq===chSel) cell.style.outline='3px solid var(--accent)';
    if(legal.includes(sq)) cell.style.boxShadow='inset 0 0 0 3px var(--good)';
    if(piece) cell.textContent=chPieceChar(piece);
    cell.onclick=()=>chClickSquare(sq);
    boardEl.appendChild(cell);
  }
  const status=document.getElementById('chStatus');
  if(chGame.in_checkmate()) status.textContent=(chGame.turn()==='w'?'Black':'White')+' wins by checkmate!';
  else if(chGame.in_draw()) status.textContent='Draw.';
  else status.textContent=(chGame.turn()==='w'?'White':'Black')+' to move'+(chGame.in_check()?' — check!':'.');
}
function chClickSquare(sq){
  if(chGame.turn()!==chPlayerColor || chGame.game_over()) return;
  if(chSel){
    const move=chGame.move({from:chSel, to:sq, promotion:'q'});
    chSel=null;
    if(move){ chDraw(); if(!chGame.game_over()) setTimeout(chComputerMove, 350); return; }
  }
  const p=chGame.get(sq);
  chSel = (p && p.color===chPlayerColor) ? sq : null;
  chDraw();
}
function chEval(game){
  const vals={p:1,n:3,b:3,r:5,q:9,k:0};
  let score=0;
  game.board().forEach(row=>row.forEach(p=>{ if(p) score += (p.color==='w'?1:-1)*vals[p.type]; }));
  return score;
}
function chMinimax(game, depth, isMax){
  if(depth===0 || game.game_over()) return chEval(game);
  const moves=game.moves();
  let best = isMax ? -Infinity : Infinity;
  for(const m of moves){
    game.move(m);
    const val=chMinimax(game, depth-1, !isMax);
    game.undo();
    best = isMax ? Math.max(best,val) : Math.min(best,val);
  }
  return best;
}
function chComputerMove(){
  if(chGame.game_over()) return;
  const diff=+document.getElementById('chDiff').value;
  const moves=chGame.moves();
  if(!moves.length) return;
  let chosen;
  if(diff===1){
    chosen=moves[Math.floor(Math.random()*moves.length)];
  } else {
    const depth = diff===2?1:2;
    const compIsWhite = chGame.turn()==='w';
    let bestVal = compIsWhite? -Infinity : Infinity, bestMoves=[];
    for(const m of moves){
      chGame.move(m);
      const val=chMinimax(chGame, depth, !compIsWhite);
      chGame.undo();
      if(compIsWhite ? val>bestVal : val<bestVal){ bestVal=val; bestMoves=[m]; }
      else if(val===bestVal) bestMoves.push(m);
    }
    chosen=bestMoves[Math.floor(Math.random()*bestMoves.length)]||moves[0];
  }
  chGame.move(chosen);
  chDraw();
}
</script>

<script>
RENDER.walkietalkie = function(){
  const body=document.getElementById('toolBody');
  body.innerHTML=`
  <div class="tab-strip" id="wtTabs"></div>
  <div id="wtPane"></div>`;
  let active='radio';
  const tabs=[['radio','Internet Radio Dial'],['ptt','Push-to-Talk (paired device)']];
  function renderTabs(){
    document.getElementById('wtTabs').innerHTML=tabs.map(([k,l])=>`<button class="${k===active?'active':''}" onclick="wtSwitch('${k}')">${l}</button>`).join('');
  }
  window.wtSwitch=(k)=>{ active=k; renderTabs(); renderPane(); };
  function renderPane(){
    const pane=document.getElementById('wtPane');
    if(active==='radio'){
      pane.innerHTML=`
      <div class="panel">
        <div class="row"><input type="text" id="wtSearch" placeholder="Search station, city or genre…" style="flex:1;">
          <button class="btn" onclick="wtSearchStations()">Tune In 📻</button></div>
        <div class="note">Browsers can't access physical FM/AM radio hardware — this dial tunes real internet radio streams worldwide instead, via the free Radio Browser directory.</div>
        <audio id="wtAudio" controls style="width:100%;margin-top:10px;display:none;"></audio>
        <div id="wtStations" style="margin-top:12px;"></div>
      </div>`;
    } else {
      pane.innerHTML=`
      <div class="panel">
        <div class="note warn">Experimental: connects two browsers directly (WebRTC), with no server in between. One person creates a channel, the other joins by pasting the code back and forth once.</div>
        <div class="row"><button class="btn" onclick="wtCreateChannel()">Create Channel</button>
          <button class="btn ghost" onclick="wtJoinChannel()">Join Channel</button></div>
        <div class="col" style="margin-top:10px;">
          <label>Step 1 — your code (send this to your partner)</label>
          <textarea id="wtLocalCode" rows="3" readonly placeholder="Your code will appear here…"></textarea>
          <button class="btn ghost" onclick="navigator.clipboard.writeText(document.getElementById('wtLocalCode').value);toast('Copied')">Copy</button>
          <label style="margin-top:8px;">Step 2 — paste their code here</label>
          <textarea id="wtRemoteCode" rows="3" placeholder="Paste the code you received…"></textarea>
          <button class="btn ghost" onclick="wtAcceptRemote()">Connect</button>
        </div>
        <div class="result" id="wtPttStatus" style="margin-top:10px;">Not connected.</div>
        <button class="btn" id="wtTalkBtn" style="margin-top:10px;width:100%;" disabled>🎙 Hold to Talk</button>
      </div>`;
      const tb=document.getElementById('wtTalkBtn');
      tb.addEventListener('pointerdown', ()=>wtSetMic(true));
      tb.addEventListener('pointerup', ()=>wtSetMic(false));
      tb.addEventListener('pointerleave', ()=>wtSetMic(false));
    }
  }
  renderTabs(); renderPane();
};
async function wtSearchStations(){
  const q=document.getElementById('wtSearch').value.trim();
  const list=document.getElementById('wtStations');
  list.innerHTML='<p class="note">Searching…</p>';
  try{
    const url = q ? `https://de1.api.radio-browser.info/json/stations/search?name=${encodeURIComponent(q)}&limit=20&hidebroken=true`
                  : `https://de1.api.radio-browser.info/json/stations/topvote/20`;
    const res=await fetch(url); const stations=await res.json();
    if(!stations.length){ list.innerHTML='<p class="note">No stations found — try another search term.</p>'; return; }
    list.innerHTML=stations.map(s=>`<div class="encard" style="cursor:pointer;" onclick="wtPlayStation('${s.url_resolved.replace(/'/g,"\\'")}','${(s.name||'').replace(/'/g,"\\'")}')">
      <span class="tag">${s.countrycode||'—'} · ${(s.tags||'').split(',')[0]||'radio'}</span><h3>${s.name}</h3></div>`).join('');
  }catch(err){ list.innerHTML='<p class="note">Could not reach the radio directory — check your connection.</p>'; }
}
function wtPlayStation(url,name){
  const a=document.getElementById('wtAudio'); a.style.display='block'; a.src=url; a.play().catch(()=>{});
  toast('Tuning: '+name);
}
let wtPeer=null, wtDataReady=false, wtLocalStream=null, wtIsCreator=false;
async function wtCreateChannel(){
  wtIsCreator=true;
  wtPeer=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  wtLocalStream=await navigator.mediaDevices.getUserMedia({audio:true});
  wtLocalStream.getAudioTracks().forEach(t=>t.enabled=false);
  wtLocalStream.getTracks().forEach(t=>wtPeer.addTrack(t, wtLocalStream));
  wtPeer.ontrack=(e)=>{ const audio=new Audio(); audio.srcObject=e.streams[0]; audio.autoplay=true; };
  wtPeer.onconnectionstatechange=()=>{ if(wtPeer.connectionState==='connected'){ document.getElementById('wtPttStatus').textContent='Connected! Hold the button to talk.'; document.getElementById('wtTalkBtn').disabled=false; } };
  const offer=await wtPeer.createOffer(); await wtPeer.setLocalDescription(offer);
  await wtWaitIce(wtPeer);
  document.getElementById('wtLocalCode').value=btoa(JSON.stringify(wtPeer.localDescription));
}
async function wtJoinChannel(){
  wtIsCreator=false;
  wtPeer=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  wtLocalStream=await navigator.mediaDevices.getUserMedia({audio:true});
  wtLocalStream.getAudioTracks().forEach(t=>t.enabled=false);
  wtLocalStream.getTracks().forEach(t=>wtPeer.addTrack(t, wtLocalStream));
  wtPeer.ontrack=(e)=>{ const audio=new Audio(); audio.srcObject=e.streams[0]; audio.autoplay=true; };
  wtPeer.onconnectionstatechange=()=>{ if(wtPeer.connectionState==='connected'){ document.getElementById('wtPttStatus').textContent='Connected! Hold the button to talk.'; document.getElementById('wtTalkBtn').disabled=false; } };
  toast('Now paste the creator\'s code and press Connect');
}
async function wtAcceptRemote(){
  const raw=document.getElementById('wtRemoteCode').value.trim();
  if(!raw || !wtPeer) return;
  const desc=JSON.parse(atob(raw));
  if(!wtIsCreator){
    await wtPeer.setRemoteDescription(desc);
    const answer=await wtPeer.createAnswer(); await wtPeer.setLocalDescription(answer);
    await wtWaitIce(wtPeer);
    document.getElementById('wtLocalCode').value=btoa(JSON.stringify(wtPeer.localDescription));
    toast('Send your code back to the creator to finish connecting');
  } else {
    await wtPeer.setRemoteDescription(desc);
  }
}
function wtWaitIce(pc){
  return new Promise(resolve=>{
    if(pc.iceGatheringState==='complete') return resolve();
    pc.onicegatheringstatechange=()=>{ if(pc.iceGatheringState==='complete') resolve(); };
    setTimeout(resolve, 3000);
  });
}
function wtSetMic(on){ if(wtLocalStream) wtLocalStream.getAudioTracks().forEach(t=>t.enabled=on); }
</script>

let vnDB=null, vnCurrentContact=null, vnStream=null, vnRecorder=null, vnChunks=[];
function vnOpenDB(){
  return new Promise(resolve=>{
    const req=indexedDB.open('forte_vidnotes', 1);
    req.onupgradeneeded=()=>{ const db=req.result; if(!db.objectStoreNames.contains('notes')) db.createObjectStore('notes',{keyPath:'id',autoIncrement:true}); };
    req.onsuccess=()=>{ vnDB=req.result; resolve(); };
  });
}
function vnGetContacts(){ return JSON.parse(localStorage.getItem('fw_vn_contacts')||'[]'); }
function vnAddContact(){
  const name=document.getElementById('vnNewContact').value.trim(); if(!name) return;
  const list=vnGetContacts(); if(!list.includes(name)) list.push(name);
  localStorage.setItem('fw_vn_contacts', JSON.stringify(list));
  document.getElementById('vnNewContact').value=''; vnRenderContacts();
}
function vnRenderContacts(){
  const wrap=document.getElementById('vnContacts');
  const list=vnGetContacts();
  wrap.innerHTML = list.length ? list.map(n=>`<button class="btn ghost" onclick="vnOpenThread('${n.replace(/'/g,"\\'")}')">${n}</button>`).join('')
    : '<span class="note">Add a contact to start recording video notes.</span>';
}
function vnOpenThread(name){
  vnCurrentContact=name;
  document.getElementById('vnThreadPanel').style.display='block';
  document.getElementById('vnThreadTitle').textContent='Thread with '+name;
  vnRenderThread();
}
async function vnStartCam(){
  vnStream=await navigator.mediaDevices.getUserMedia({video:true, audio:true});
  document.getElementById('vnPreview').srcObject=vnStream;
  document.getElementById('vnRecBtn').disabled=false;
}
function vnToggleRec(){
  const btn=document.getElementById('vnRecBtn');
  if(vnRecorder && vnRecorder.state==='recording'){ vnRecorder.stop(); btn.textContent='● Record Note'; return; }
  vnChunks=[];
  vnRecorder=new MediaRecorder(vnStream, {mimeType:'video/webm'});
  vnRecorder.ondataavailable=e=>{ if(e.data.size) vnChunks.push(e.data); };
  vnRecorder.onstop=()=>{
    const blob=new Blob(vnChunks, {type:'video/webm'});
    vnSaveNote(vnCurrentContact, blob);
  };
  vnRecorder.start(); btn.textContent='■ Stop';
}
function vnSaveNote(contact, blob){
  const tx=vnDB.transaction('notes','readwrite');
  tx.objectStore('notes').add({contact, blob, ts:Date.now()});
  tx.oncomplete=()=>{ toast('Video note saved'); vnRenderThread(); };
}
function vnRenderThread(){
  const tx=vnDB.transaction('notes','readonly');
  const req=tx.objectStore('notes').getAll();
  req.onsuccess=()=>{
    const notes=req.result.filter(n=>n.contact===vnCurrentContact).sort((a,b)=>b.ts-a.ts);
    const wrap=document.getElementById('vnThread');
    wrap.innerHTML = notes.length ? notes.map(n=>{
      const url=URL.createObjectURL(n.blob);
      return `<div class="encard"><span class="tag">${new Date(n.ts).toLocaleString()}</span>
        <video controls src="${url}" style="width:100%;max-width:320px;border-radius:6px;margin-top:6px;"></video><br>
        <button class="btn ghost" style="margin-top:6px;" onclick="download('vidnote-${n.id}.webm', (function(){return this;}).call(null))">Download</button></div>`;
    }).join('') : '<p class="note">No video notes yet with this contact.</p>';
    // wire download buttons with correct blobs (closures via querySelectorAll)
    const btns=wrap.querySelectorAll('.encard');
    notes.forEach((n,i)=>{ const b=btns[i] && btns[i].querySelector('button'); if(b) b.onclick=()=>download('vidnote-'+n.id+'.webm', n.blob); });
  };
}
</script>

let rlPxPerMm=200/85.6;
function rlCalibrate(v){
  document.getElementById('rlCalBar').style.width=v+'px';

  document.getElementById('rlCalResult').textContent = `${(rlPxPerMm*10).toFixed(1)} px per cm — calibrated.`;
  rlDrawRuler();
}
function rlDrawRuler(){
  const unit=document.getElementById('rlUnit').value;
  const el=document.getElementById('rlRuler');
  const pxPerUnit = unit==='cm' ? rlPxPerMm*10 : rlPxPerMm*25.4;
  const total = Math.floor((el.parentElement.clientWidth||320)/pxPerUnit);
  let html='';
  for(let i=0;i<=total;i++){
    const x=i*pxPerUnit;
    html+=`<div style="position:absolute;left:${x}px;top:0;width:2px;height:${i%5===0?45:25}px;background:#111;"></div>`;
    if(i%5===0) html+=`<div style="position:absolute;left:${x+3}px;top:46px;font-size:11px;color:#111;">${i}</div>`;

}

  const pos=e=>{ const r=cv.getBoundingClientRect(); const p=e.touches?e.touches[0]:e;
    return {x:(p.clientX-r.left)*(cv.width/r.width), y:(p.clientY-r.top)*(cv.height/r.height)}; };
  const start=e=>{ dpDrawing=true; dpHue=(dpHue+37)%360; dpStrokes.push({hue:dpHue, size:+document.getElementById('dpSize').value, pts:[pos(e)]}); e.preventDefault(); };
  const move=e=>{ if(!dpDrawing) return; dpStrokes[dpStrokes.length-1].pts.push(pos(e)); e.preventDefault(); };
  const end=()=>{ dpDrawing=false; };
  cv.addEventListener('pointerdown', start); cv.addEventListener('pointermove', move);
  cv.addEventListener('pointerup', end); cv.addEventListener('pointerleave', end);
  if(dpAnimId) cancelAnimationFrame(dpAnimId);
  dpLoop();
}
function dpLoop(t){
  const cv=document.getElementById('dpCanvas'); if(!cv){ return; }
  dpCtx.fillStyle='#0a0a0f'; dpCtx.fillRect(0,0,cv.width,cv.height);
  const time=(t||0)/1000;
  dpStrokes.forEach((s,i)=>{
    if(s.pts.length<2) return;
    const glow=14+8*Math.sin(time*3+i);
    dpCtx.strokeStyle=`hsl(${s.hue},95%,60%)`;
    dpCtx.shadowColor=`hsl(${(s.hue+40)%360},95%,55%)`;
    dpCtx.shadowBlur=glow;
    dpCtx.lineWidth=s.size; dpCtx.lineCap='round'; dpCtx.lineJoin='round';
    dpCtx.beginPath(); dpCtx.moveTo(s.pts[0].x, s.pts[0].y);
    for(let p of s.pts) dpCtx.lineTo(p.x,p.y);
    dpCtx.stroke();
  });
  dpAnimId=requestAnimationFrame(dpLoop);
}
function dpClear(){ dpStrokes=[]; }
function dpSave(fmt){
  const cv=document.getElementById('dpCanvas');
  const url=cv.toDataURL(fmt==='png'?'image/png':'image/jpeg', 0.92);
  const a=document.createElement('a'); a.href=url; a.download='forte-drawing.'+(fmt==='png'?'png':'jpg'); a.click();
}
</script>

<!-- ===================== TOOL 67: DOCUMENT VAULT ===================== -->
<script>
RENDER.docvault = function(){
  const body=document.getElementById('toolBody');
  body.innerHTML=`
  <div class="panel">
    <h3 style="margin-top:0;">Lock a new document</h3>
    <div class="col">
      <label>Document name</label><input type="text" id="dvName" placeholder="e.g. National ID">
      <label>Scan or choose photo(s)</label><input type="file" id="dvFiles" accept="image/*" capture="environment" multiple>
      <label>Password</label><input type="password" id="dvPass" placeholder="Choose a strong password">
      <button class="btn" onclick="dvLock()">🔒 Encrypt & Save</button>
    </div>
    <div class="note">Documents are encrypted (AES-256) on this device with your password and stored only in this browser. There is no password recovery — if you forget it, the document can't be unlocked.</div>
  </div>
  <div class="panel"><h3 style="margin-top:0;">Your vault</h3><div id="dvList"></div></div>`;
  dvRenderList();
};
function dvGetVault(){ return JSON.parse(localStorage.getItem('fw_vault')||'[]'); }
function dvSaveVault(v){ localStorage.setItem('fw_vault', JSON.stringify(v)); }
async function dvFileToDataURL(f){ return new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(f); }); }
async function dvDeriveKey(password, salt, usage){
  const enc=new TextEncoder();
  const keyMat=await crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'}, keyMat, {name:'AES-GCM', length:256}, false, usage);
}
async function dvLock(){
  const name=document.getElementById('dvName').value.trim()||'Untitled';
  const pass=document.getElementById('dvPass').value;
  const files=document.getElementById('dvFiles').files;
  if(!pass || !files.length){ toast('Add a photo and a password'); return; }
  const images=await Promise.all(Array.from(files).map(dvFileToDataURL));
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await dvDeriveKey(pass, salt, ['encrypt']);
  const enc=new TextEncoder();
  const cipher=await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(JSON.stringify(images)));
  const vault=dvGetVault();
  vault.push({id:Date.now(), name, salt:Array.from(salt), iv:Array.from(iv), cipher:Array.from(new Uint8Array(cipher))});
  dvSaveVault(vault);
  toast('Document locked in vault');
  document.getElementById('dvName').value=''; document.getElementById('dvPass').value=''; document.getElementById('dvFiles').value='';
  dvRenderList();
}
function dvRenderList(){
  const vault=dvGetVault();
  document.getElementById('dvList').innerHTML = vault.length ? vault.map(v=>`
    <div class="encard"><h3>🔒 ${v.name}</h3>
      <div class="row"><input type="password" id="dvUnlock${v.id}" placeholder="Password" style="max-width:200px;">
      <button class="btn ghost" onclick="dvUnlock(${v.id})">Unlock</button>
      <button class="btn ghost" onclick="dvDelete(${v.id})">Delete</button></div>
      <div id="dvOut${v.id}"></div></div>`).join('') : '<p class="note">No documents saved yet.</p>';
}
async function dvUnlock(id){
  const vault=dvGetVault(); const v=vault.find(x=>x.id===id); if(!v) return;
  const pass=document.getElementById('dvUnlock'+id).value;
  try{
    const key=await dvDeriveKey(pass, new Uint8Array(v.salt), ['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM', iv:new Uint8Array(v.iv)}, key, new Uint8Array(v.cipher));
    const images=JSON.parse(new TextDecoder().decode(plain));
    document.getElementById('dvOut'+id).innerHTML=images.map((img,i)=>`<img src="${img}" style="max-width:100%;border-radius:6px;margin-top:8px;"><br><a class="btn ghost" style="margin:4px 0 10px;display:inline-block;text-decoration:none;" href="${img}" download="${v.name}-${i+1}.jpg">Download page ${i+1}</a>`).join('');
  }catch(e){ toast('Wrong password'); }
}
function dvDelete(id){
  dvSaveVault(dvGetVault().filter(v=>v.id!==id));
  dvRenderList();
}
</script>

<script>
const FP_FREQ={C4:261.63,'C#4':277.18,D4:293.66,'D#4':311.13,E4:329.63,F4:349.23,'F#4':369.99,G4:392.00,'G#4':415.30,A4:440.00,'A#4':466.16,B4:493.88,
  C5:523.25,'C#5':554.37,D5:587.33,'D#5':622.25,E5:659.25,F5:698.46,'F#5':739.99,G5:783.99};
const FP_KEYS=['C4','C#4','D4','D#4','E4','F4','F#4','G4','G#4','A4','A#4','B4','C5','D5','E5','F5','G5'];
const FP_SONGS={
  'Twinkle Twinkle Little Star':['C4','C4','G4','G4','A4','A4','G4','F4','F4','E4','E4','D4','D4','C4'],
  'Mary Had a Little Lamb':['E4','D4','C4','D4','E4','E4','E4','D4','D4','D4','E4','G4','G4'],
  'Happy Birthday':['C4','C4','D4','C4','F4','E4','C4','C4','D4','C4','G4','F4'],
};
RENDER.fingerpiano = function(){
  const body=document.getElementById('toolBody');
  body.innerHTML=`
  <div class="panel">
    <div class="row"><label>Learn a song</label>
      <select id="fpSong" onchange="fpLoadSong(this.value)"><option value="">Free play</option>${Object.keys(FP_SONGS).map(s=>`<option>${s}</option>`).join('')}</select>
      <button class="btn ghost" onclick="fpPlayDemo()">▶ Play Demo</button></div>
    <div class="result" id="fpLesson" style="margin-top:8px;">Free play mode — tap any key.</div>
    <div id="fpPiano" style="position:relative;height:170px;margin-top:14px;display:flex;"></div>
  </div>`;
  fpBuildKeys();
};
let fpCtx=null, fpSongNotes=null, fpSongIdx=0;
function fpBuildKeys(){
  const wrap=document.getElementById('fpPiano'); wrap.innerHTML='';
  const whites=FP_KEYS.filter(k=>!k.includes('#'));
  whites.forEach(k=>{
    const el=document.createElement('div'); el.className='piano-key'; el.id='fpk-'+k;
    el.style.cssText='flex:1;height:170px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:10px;border-radius:0 0 6px 6px;';
    el.textContent=k; el.onclick=()=>fpPlayNote(k);
    wrap.appendChild(el);
  });
  const blacks=FP_KEYS.filter(k=>k.includes('#'));
  const whiteWidthPct=100/whites.length;
  blacks.forEach(k=>{
    const beforeWhite=k.replace('#',''); // e.g. C#4 -> C4
    const idx=whites.indexOf(beforeWhite);
    if(idx<0) return;
    const el=document.createElement('div'); el.className='piano-key black'; el.id='fpk-'+k;
    el.style.cssText=`position:absolute;top:0;height:105px;width:${whiteWidthPct*0.6}%;border-radius:0 0 4px 4px;
      left:calc(${(idx+1)*whiteWidthPct}% - ${whiteWidthPct*0.3}%);z-index:2;`;
    el.onclick=(e)=>{ e.stopPropagation(); fpPlayNote(k); };
    wrap.appendChild(el);
  });
}
function fpPlayNote(note){
  fpCtx = fpCtx || new (window.AudioContext||window.webkitAudioContext)();
  const osc=fpCtx.createOscillator(), gain=fpCtx.createGain();
  osc.type='triangle'; osc.frequency.value=FP_FREQ[note];
  gain.gain.setValueAtTime(0.25, fpCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, fpCtx.currentTime+0.6);
  osc.connect(gain).connect(fpCtx.destination);
  osc.start(); osc.stop(fpCtx.currentTime+0.6);
  const el=document.getElementById('fpk-'+note); if(el){ el.classList.add('active'); setTimeout(()=>el.classList.remove('active'),200); }
  if(fpSongNotes && note===fpSongNotes[fpSongIdx]){
    fpSongIdx++;
    if(fpSongIdx>=fpSongNotes.length){ document.getElementById('fpLesson').textContent='🎉 Well done — song complete!'; fpSongIdx=0; }
    else document.getElementById('fpLesson').textContent=`Next note: ${fpSongNotes[fpSongIdx]}`;
  }
}
function fpLoadSong(name){
  if(!name){ fpSongNotes=null; document.getElementById('fpLesson').textContent='Free play mode — tap any key.'; return; }
  fpSongNotes=FP_SONGS[name]; fpSongIdx=0;
  document.getElementById('fpLesson').textContent=`Next note: ${fpSongNotes[0]}`;
}
function fpPlayDemo(){
  const sel=document.getElementById('fpSong').value;
  const notes=FP_SONGS[sel]||fpSongNotes;
  if(!notes){ toast('Pick a song first'); return; }
  notes.forEach((n,i)=>setTimeout(()=>fpPlayNoteRaw(n), i*450));
}
function fpPlayNoteRaw(note){
  fpCtx = fpCtx || new (window.AudioContext||window.webkitAudioContext)();
  const osc=fpCtx.createOscillator(), gain=fpCtx.createGain();
  osc.type='triangle'; osc.frequency.value=FP_FREQ[note];
  gain.gain.setValueAtTime(0.25, fpCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, fpCtx.currentTime+0.4);
  osc.connect(gain).connect(fpCtx.destination); osc.start(); osc.stop(fpCtx.currentTime+0.4);
  const el=document.getElementById('fpk-'+note); if(el){ el.classList.add('active'); setTimeout(()=>el.classList.remove('active'),200); }
}
</script>

<!-- ===================== TOOL 69: DRUM PAD ===================== -->
<script>
const DRUM_PADS=['Kick','Snare','Hi-Hat','Open Hat','Clap','Tom','Crash','Rim'];
const DRUM_PATTERNS={
  'Basic Rock Beat':['Kick','Hi-Hat','Snare','Hi-Hat','Kick','Hi-Hat','Snare','Hi-Hat'],
  'Four on the Floor':['Kick','Hi-Hat','Kick','Hi-Hat','Kick','Hi-Hat','Kick','Hi-Hat'],
  'Hip-Hop Groove':['Kick','Hi-Hat','Hi-Hat','Snare','Hi-Hat','Kick','Hi-Hat','Snare'],
};
RENDER.drumpad = function(){
  const body=document.getElementById('toolBody');
  body.innerHTML=`
  <div class="panel">
    <div class="grid g3" id="dmPads"></div>
  </div>
  <div class="panel">
    <div class="row"><label>Rhythm lesson</label>
      <select id="dmPattern">${Object.keys(DRUM_PATTERNS).map(p=>`<option>${p}</option>`).join('')}</select>
      <button class="btn" onclick="dmPlayPattern()">▶ Play & Follow Along</button></div>
    <div class="result" id="dmStep" style="margin-top:8px;">Pick a pattern and tap along with the highlighted pad.</div>
  </div>`;
  document.getElementById('dmPads').innerHTML=DRUM_PADS.map(p=>`<button class="pad" id="dmpad-${p}" onclick="dmHit('${p}')">${p}</button>`).join('');
};
let dmCtx=null;
function dmCtxGet(){ dmCtx = dmCtx || new (window.AudioContext||window.webkitAudioContext)(); return dmCtx; }
function dmNoiseBuffer(ctx, dur){
  const buf=ctx.createBuffer(1, ctx.sampleRate*dur, ctx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i]=Math.random()*2-1;
  return buf;
}
function dmHit(pad){
  const ctx=dmCtxGet(); const t=ctx.currentTime;
  const el=document.getElementById('dmpad-'+pad); if(el){ el.classList.add('hit'); setTimeout(()=>el.classList.remove('hit'),150); }
  if(pad==='Kick'||pad==='Tom'){
    const osc=ctx.createOscillator(), g=ctx.createGain();
    osc.type='sine'; const startF=pad==='Kick'?150:220, endF=pad==='Kick'?0.01:60;
    osc.frequency.setValueAtTime(startF,t); osc.frequency.exponentialRampToValueAtTime(Math.max(endF,20),t+0.35);
    g.gain.setValueAtTime(1,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.4);
    osc.connect(g).connect(ctx.destination); osc.start(t); osc.stop(t+0.4);
  } else if(pad==='Snare'||pad==='Rim'){
    const noise=ctx.createBufferSource(); noise.buffer=dmNoiseBuffer(ctx, 0.2);
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=pad==='Rim'?2500:1800;
    const g=ctx.createGain(); g.gain.setValueAtTime(pad==='Rim'?0.5:0.8,t); g.gain.exponentialRampToValueAtTime(0.001,t+(pad==='Rim'?0.08:0.18));
    noise.connect(bp).connect(g).connect(ctx.destination); noise.start(t);
    const osc=ctx.createOscillator(); osc.type='triangle'; osc.frequency.value=180;
    const g2=ctx.createGain(); g2.gain.setValueAtTime(0.3,t); g2.gain.exponentialRampToValueAtTime(0.001,t+0.1);
    osc.connect(g2).connect(ctx.destination); osc.start(t); osc.stop(t+0.1);
  } else if(pad==='Hi-Hat'||pad==='Open Hat'){
    const noise=ctx.createBufferSource(); noise.buffer=dmNoiseBuffer(ctx, pad==='Open Hat'?0.4:0.08);
    const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7000;
    const g=ctx.createGain(); g.gain.setValueAtTime(0.4,t); g.gain.exponentialRampToValueAtTime(0.001,t+(pad==='Open Hat'?0.35:0.07));
    noise.connect(hp).connect(g).connect(ctx.destination); noise.start(t);
  } else if(pad==='Clap'){
    for(let i=0;i<3;i++){
      const noise=ctx.createBufferSource(); noise.buffer=dmNoiseBuffer(ctx, 0.08);
      const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1200;
      const g=ctx.createGain(); g.gain.setValueAtTime(0.5,t+i*0.02); g.gain.exponentialRampToValueAtTime(0.001,t+i*0.02+0.08);
      noise.connect(bp).connect(g).connect(ctx.destination); noise.start(t+i*0.02);
    }
  } else if(pad==='Crash'){
    const noise=ctx.createBufferSource(); noise.buffer=dmNoiseBuffer(ctx, 1.2);
    const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=5000;
    const g=ctx.createGain(); g.gain.setValueAtTime(0.4,t); g.gain.exponentialRampToValueAtTime(0.001,t+1.1);
    noise.connect(hp).connect(g).connect(ctx.destination); noise.start(t);
  }
}
function dmPlayPattern(){
  const pattern=DRUM_PATTERNS[document.getElementById('dmPattern').value];
  pattern.forEach((p,i)=>setTimeout(()=>{ dmHit(p); document.getElementById('dmStep').textContent=`Step ${i+1}/${pattern.length}: ${p}`; }, i*420));
}
</script>

<!-- ===================== TOOL 70: MEMORY TRAINING GAMES ===================== -->
<script>
RENDER.memorygames = function(){
  const body=document.getElementById('toolBody');
  body.innerHTML=`<div class="tab-strip" id="mgTabs"></div><div id="mgPane"></div>`;
  let active='match';
  const tabs=[['match','Card Match'],['simon','Sequence Recall']];
  function renderTabs(){ document.getElementById('mgTabs').innerHTML=tabs.map(([k,l])=>`<button class="${k===active?'active':''}" onclick="mgSwitch('${k}')">${l}</button>`).join(''); }
  window.mgSwitch=(k)=>{ active=k; renderTabs(); if(k==='match') mgMatchInit(); else mgSimonInit(); };
  renderTabs(); mgMatchInit();
};
/* ---- Card Match ---- */
const MG_EMOJI=['🐘','🦁','🐒','🐢','🦋','🐬','🦉','🦒'];
let mgCards=[], mgFlipped=[], mgMoves=0, mgMatched=0;
function mgMatchInit(){
  const pane=document.getElementById('mgPane');
  pane.innerHTML=`<div class="panel">
    <div class="row"><span class="result">Moves: <span id="mgMoves">0</span></span><button class="btn ghost" onclick="mgMatchInit()">Restart</button></div>
    <div class="grid g3" id="mgGrid" style="margin-top:12px;grid-template-columns:repeat(4,1fr);"></div>
  </div>`;
  const deck=[...MG_EMOJI, ...MG_EMOJI].sort(()=>Math.random()-0.5);
  mgCards=deck.map((e,i)=>({id:i, emoji:e, flipped:false, matched:false}));
  mgFlipped=[]; mgMoves=0; mgMatched=0;
  mgRenderGrid();
}
function mgRenderGrid(){
  document.getElementById('mgGrid').innerHTML=mgCards.map(c=>`<button class="pad" style="font-size:26px;" onclick="mgFlip(${c.id})">${(c.flipped||c.matched)?c.emoji:'❔'}</button>`).join('');
  document.getElementById('mgMoves').textContent=mgMoves;
}
function mgFlip(id){
  const c=mgCards.find(x=>x.id===id);
  if(c.flipped||c.matched||mgFlipped.length>=2) return;
  c.flipped=true; mgFlipped.push(c); mgRenderGrid();
  if(mgFlipped.length===2){
    mgMoves++;
    if(mgFlipped[0].emoji===mgFlipped[1].emoji){
      mgFlipped.forEach(x=>x.matched=true); mgMatched+=2; mgFlipped=[]; mgRenderGrid();
      if(mgMatched===mgCards.length) toast('🎉 Solved in '+mgMoves+' moves!');
    } else {
      setTimeout(()=>{ mgFlipped.forEach(x=>x.flipped=false); mgFlipped=[]; mgRenderGrid(); }, 700);
    }
  }
}
/* ---- Simon Sequence Recall ---- */
const MG_COLORS=['#ff6161','#5fd07d','#45d6c4','#ffb877'];
let mgSeq=[], mgUserIdx=0, mgLevel=0, mgBusy=false;
function mgSimonInit(){
  const pane=document.getElementById('mgPane');
  pane.innerHTML=`<div class="panel" style="text-align:center;">
    <div class="result" id="mgLevelBox">Level: 0</div>
    <div class="grid g2" id="mgSimonGrid" style="max-width:280px;margin:14px auto;gap:8px;"></div>
    <button class="btn" onclick="mgSimonStart()">Start</button>
  </div>`;
  document.getElementById('mgSimonGrid').innerHTML=MG_COLORS.map((c,i)=>`<button id="mgc-${i}" onclick="mgSimonPress(${i})" style="height:80px;border-radius:10px;border:none;background:${c};opacity:.55;"></button>`).join('');
  mgSeq=[]; mgLevel=0; mgUserIdx=0;
}
function mgSimonStart(){ mgSeq=[]; mgLevel=0; mgSimonNextRound(); }
function mgSimonNextRound(){
  mgLevel++; mgUserIdx=0;
  document.getElementById('mgLevelBox').textContent='Level: '+mgLevel;
  mgSeq.push(Math.floor(Math.random()*4));
  mgBusy=true;
  mgSeq.forEach((c,i)=>setTimeout(()=>{
    const el=document.getElementById('mgc-'+c); el.style.opacity=1; setTimeout(()=>el.style.opacity=.55, 300);
    if(i===mgSeq.length-1) setTimeout(()=>mgBusy=false, 400);
  }, i*550));
}
function mgSimonPress(i){
  if(mgBusy) return;
  const el=document.getElementById('mgc-'+i); el.style.opacity=1; setTimeout(()=>el.style.opacity=.55,150);
  if(mgSeq[mgUserIdx]!==i){ toast('❌ Game over — reached level '+mgLevel); mgSeq=[]; mgLevel=0; return; }
  mgUserIdx++;
  if(mgUserIdx===mgSeq.length) setTimeout(mgSimonNextRound, 700);
}
</script>

<script>
const SURVIVAL_TIPS={

  'Shelter':['Prioritize shelter before food — hypothermia can set in far faster than starvation becomes dangerous.','Insulate yourself from the ground first; more body heat is usually lost downward than sideways.','A shelter just big enough to fit your body traps heat far more effectively than a large one.'],
  'Signaling for Help':['Three of anything — three fires, three whistle blasts, three flashes — is a recognized international distress signal.','Bright colors and movement attract attention; a signal mirror can be seen for miles on a clear day.','Stay near your vehicle or last known location if lost — it is larger and easier to spot than a person.'],
  'Wilderness Navigation':['If lost, stop, stay calm, and assess before moving — panicked travel often makes things worse.','A wristwatch can approximate south: point the hour hand at the sun; south is roughly halfway between it and 12 (Northern Hemisphere).','Moss growth varies by local conditions and isn\'t a reliable compass on its own — use multiple cues together.'],
  'Basic First Aid':['For serious bleeding, apply firm, direct pressure with the cleanest cloth available and keep the pressure steady.','For suspected fractures, avoid moving the limb unnecessarily; immobilize it in the position found if possible.','Treat for shock (lay the person down, keep them warm, elevate legs if no spinal or leg injury is suspected) while awaiting help.'],
  'Urban Emergencies':['Keep a basic kit at home: water, non-perishable food, flashlight, batteries, first aid supplies, and copies of key documents.','Know at least two exit routes from your home and workplace in case one is blocked.','During power outages, keep refrigerators/freezers closed as much as possible to preserve food safety.'],

RENDER.survivaltips = function(){

  body.innerHTML=`<div class="panel note">General preparedness information, not a substitute for professional wilderness or medical training. In a genuine emergency, contact local emergency services.</div>
  <div class="tab-strip" id="svTabs"></div><div id="svPane"></div>`;
  document.getElementById('svTabs').innerHTML=Object.keys(SURVIVAL_TIPS).map((k,i)=>`<button class="${i===0?'active':''}" onclick="svShow('${k}',this)">${k}</button>`).join('');

};
function svShow(key, btn){
  document.querySelectorAll('#svTabs button').forEach(b=>b.classList.remove('active'));
