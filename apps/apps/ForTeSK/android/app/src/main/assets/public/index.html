<script>
RENDER.metronome = function(){
  const body=document.getElementById('toolBody');
  body.innerHTML=`<div class="panel" style="text-align:center;">
    <div class="big-result" id="mtBpm">120 BPM</div>
    <input type="range" id="mtSlider" min="40" max="240" value="120" oninput="mtSetBpm(this.value)" style="width:100%;">
    <div class="row" style="justify-content:center;margin-top:10px;">
      <button class="btn" id="mtToggle" onclick="mtToggle()">▶ Start</button>
      <button class="btn ghost" onclick="mtTap()">Tap Tempo</button>
    </div>
    <div id="mtPulse" style="width:40px;height:40px;border-radius:50%;background:var(--panel2);margin:16px auto;"></div>
  </div>`;
};
let mtBpm=120, mtCtx=null, mtRunning=false, mtNextTime=0, mtTimer=null, mtTaps=[];
function mtSetBpm(v){ mtBpm=parseInt(v); document.getElementById('mtBpm').textContent=mtBpm+' BPM'; }
function mtTap(){
  const now=Date.now(); mtTaps.push(now); mtTaps=mtTaps.filter(t=>now-t<3000);
  if(mtTaps.length>1){
    const intervals=[]; for(let i=1;i<mtTaps.length;i++) intervals.push(mtTaps[i]-mtTaps[i-1]);
    const avg=intervals.reduce((a,b)=>a+b,0)/intervals.length;
    mtSetBpm(Math.round(60000/avg)); document.getElementById('mtSlider').value=mtBpm;
  }
}
function mtToggle(){
  const btn=document.getElementById('mtToggle');
  if(!mtRunning){
    mtCtx = mtCtx || new (window.AudioContext||window.webkitAudioContext)();
    mtRunning=true; btn.textContent='■ Stop'; mtNextTime=mtCtx.currentTime;
    mtScheduler();
  } else { mtRunning=false; btn.textContent='▶ Start'; clearTimeout(mtTimer); }
}
function mtScheduler(){
  if(!mtRunning) return;
  while(mtNextTime < mtCtx.currentTime+0.1){
    const osc=mtCtx.createOscillator(), gain=mtCtx.createGain();
    osc.frequency.value=1000; gain.gain.value=0.3;
    osc.connect(gain); gain.connect(mtCtx.destination);
    osc.start(mtNextTime); osc.stop(mtNextTime+0.05);
    const delay=(mtNextTime-mtCtx.currentTime)*1000;
    setTimeout(()=>{ const p=document.getElementById('mtPulse'); if(p){ p.style.background='var(--accent)'; setTimeout(()=>p.style.background='var(--panel2)',80); } }, Math.max(0,delay));
    mtNextTime += 60/mtBpm;
  }
  mtTimer=setTimeout(mtScheduler,25);
}
</script>

<!-- ===================== TOOL 48: SKY GUIDE ===================== -->
<script>
RENDER.skyguide = function(){
  const body=document.getElementById('toolBody');
  body.innerHTML=`<div class="panel">
    <button class="btn" onclick="skyCompute()">Get Sky Info for My Location</button>
    <div id="skyOut" style="margin-top:14px;"></div>
    <div class="note" style="margin-top:10px;">Approximate astronomical calculations — accurate to within a few minutes.</div>
  </div>`;
};
function skyCompute(){
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude:lat, longitude:lon}=pos.coords;
    const now=new Date();
    const sun=skySunPosition(now, lat, lon);
    const moon=skyMoonPhase(now);
    document.getElementById('skyOut').innerHTML=`
      <div class="grid g2">
        <div class="result">Sun Azimuth<br><span class="mono">${sun.azimuth.toFixed(1)}°</span></div>
        <div class="result">Sun Elevation<br><span class="mono">${sun.elevation.toFixed(1)}°</span></div>
        <div class="result">Moon Phase<br><span class="mono">${moon.name} (${moon.illum}%)</span></div>
        <div class="result">Golden Hour<br><span class="mono">${sun.elevation<10&&sun.elevation>-4?'Now!':(sun.elevation>10?'Later today':'Not now')}</span></div>
      </div>`;
  }, ()=>toast('Location permission needed'));
}
function skySunPosition(date, lat, lon){
  const rad=Math.PI/180;
  const dayMs=1000*60*60*24;
  const J1970=2440588, J2000=2451545;
  const toJulian=d=>d.valueOf()/dayMs - 0.5 + J1970;
  const d=toJulian(date)-J2000;
  const M=rad*(357.5291+0.98560028*d);
  const C=rad*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M));
  const P=rad*102.9372;
  const L=M+C+P+Math.PI;
  const e=rad*23.4397;
  const dec=Math.asin(Math.sin(e)*Math.sin(L));
  const ra=Math.atan2(Math.sin(L)*Math.cos(e), Math.cos(L));
  const lw=rad*-lon, phi=rad*lat;
  const gmst=rad*(280.16+360.9856235*d);
  const H=gmst-lw-ra;
  const az=Math.atan2(Math.sin(H), Math.cos(H)*Math.sin(phi)-Math.tan(dec)*Math.cos(phi));
  const el=Math.asin(Math.sin(phi)*Math.sin(dec)+Math.cos(phi)*Math.cos(dec)*Math.cos(H));
  return {azimuth:(az/rad+180)%360, elevation:el/rad};
}
function skyMoonPhase(date){
  const synodic=29.53058867;
  const known=new Date(Date.UTC(2000,0,6,18,14));
  const days=(date-known)/86400000;
  const phase=((days % synodic)+synodic)%synodic;
  const illum=Math.round((1-Math.cos(2*Math.PI*phase/synodic))/2*100);
  let name='New Moon';
  if(phase<1.8) name='New Moon'; else if(phase<7.4) name='Waxing Crescent'; else if(phase<9.2) name='First Quarter';
  else if(phase<14.8) name='Waxing Gibbous'; else if(phase<16.6) name='Full Moon'; else if(phase<22.1) name='Waning Gibbous';
  else if(phase<23.9) name='Last Quarter'; else if(phase<29.5) name='Waning Crescent'; else name='New Moon';
  return {name, illum};
}
</script>

<script>
RENDER.tuner = function(){
  const body=document.getElementById('toolBody');
  body.innerHTML=`<div class="panel">
    <button class="btn" id="tuBtn" onclick="tuToggle()">🎙 Start Listening</button>
    <div class="big-result" id="tuNote" style="margin-top:14px;">--</div>
    <div class="result" id="tuFreq" style="margin-top:8px;">-- Hz</div>
    <canvas id="tuMeter" width="400" height="60" style="margin-top:10px;width:100%;max-width:400px;"></canvas>
    <canvas id="tuSpectrum" width="700" height="120" style="margin-top:10px;width:100%;"></canvas>
  </div>`;
};
let tuCtx=null, tuAnalyser=null, tuRunning=false, tuStream=null;
const NOTE_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
async function tuToggle(){
  const btn=document.getElementById('tuBtn');
  if(tuRunning){ tuRunning=false; btn.textContent='🎙 Start Listening'; if(tuStream) tuStream.getTracks().forEach(t=>t.stop()); return; }
  tuStream=await navigator.mediaDevices.getUserMedia({audio:true});
  tuCtx = tuCtx || new (window.AudioContext||window.webkitAudioContext)();
  const src=tuCtx.createMediaStreamSource(tuStream);
  tuAnalyser=tuCtx.createAnalyser(); tuAnalyser.fftSize=2048;
  src.connect(tuAnalyser);
  tuRunning=true; btn.textContent='■ Stop';
  tuLoop();
}
function tuAutoCorrelate(buf, sampleRate){
  let SIZE=buf.length, rms=0;
  for(let i=0;i<SIZE;i++) rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/SIZE);
  if(rms<0.01) return -1;
  let r1=0,r2=SIZE-1, thresh=0.2;
  for(let i=0;i<SIZE/2;i++) if(Math.abs(buf[i])<thresh){ r1=i; break; }
  for(let i=1;i<SIZE/2;i++) if(Math.abs(buf[SIZE-i])<thresh){ r2=SIZE-i; break; }
  buf=buf.slice(r1,r2); SIZE=buf.length;
  const c=new Array(SIZE).fill(0);
  for(let i=0;i<SIZE;i++) for(let j=0;j<SIZE-i;j++) c[i]+=buf[j]*buf[j+i];
  let d=0; while(c[d]>c[d+1]) d++;
  let maxval=-1, maxpos=-1;
  for(let i=d;i<SIZE;i++){ if(c[i]>maxval){ maxval=c[i]; maxpos=i; } }
  let T0=maxpos;
  if(T0<=0) return -1;
  return sampleRate/T0;
}
function tuLoop(){
  if(!tuRunning) return;
  const buf=new Float32Array(tuAnalyser.fftSize);
  tuAnalyser.getFloatTimeDomainData(buf);
  const freq=tuAutoCorrelate(buf, tuCtx.sampleRate);
  if(freq>0){
    const noteNum=12*(Math.log2(freq/440))+69;
    const rounded=Math.round(noteNum);
    const name=NOTE_NAMES[(rounded+120)%12]+ (Math.floor(rounded/12)-1);
    const cents=Math.round((noteNum-rounded)*100);
    document.getElementById('tuNote').textContent=name;
    document.getElementById('tuFreq').textContent=freq.toFixed(1)+' Hz · '+(cents>0?'+':'')+cents+' cents';
    const cv=document.getElementById('tuMeter'), ctx=cv.getContext('2d');
    ctx.fillStyle='#0c0e11'; ctx.fillRect(0,0,400,60);
    ctx.strokeStyle='#2c343d'; ctx.beginPath(); ctx.moveTo(200,0); ctx.lineTo(200,60); ctx.stroke();
    const x=200+cents*3;
    ctx.fillStyle=Math.abs(cents)<5?'#5fd07d':'#ff9640'; ctx.fillRect(x-3,10,6,40);
  }
  const spec=new Uint8Array(tuAnalyser.frequencyBinCount);
  tuAnalyser.getByteFrequencyData(spec);
  const sc=document.getElementById('tuSpectrum'), sctx=sc.getContext('2d');
  sctx.fillStyle='#0c0e11'; sctx.fillRect(0,0,700,120);
  sctx.fillStyle='#45d6c4';
  for(let i=0;i<200;i++){ const v=spec[i]; sctx.fillRect(i*3.5,120-v/2,3,v/2); }
  requestAnimationFrame(tuLoop);
}
</script>
