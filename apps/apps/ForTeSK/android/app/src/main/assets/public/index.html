<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>ForTe WebSwissKnife</title>
<meta name="theme-color" content="#12151a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<!-- Libraries (loaded from CDN, require internet access) -->
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://unpkg.com/html-docx-js/dist/html-docx.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>

<style>
:root{
  --bg:#12151a; --panel:#1a1f26; --panel2:#222933; --line:#2c343d;
  --text:#e9edf1; --muted:#93a2ae; --accent:#ff9640; --accent-dim:#ffb877;
  --accent2:#45d6c4; --danger:#ff6161; --good:#5fd07d;
  --display:'Rajdhani',sans-serif; --body:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--body);height:100%;}
::selection{background:var(--accent);color:#12151a;}
a{color:var(--accent2);}
button{font-family:var(--body);cursor:pointer;}
input,select,textarea{font-family:var(--body);}
h1,h2,h3{font-family:var(--display);letter-spacing:.02em;margin:0 0 .4em;}
.mono{font-family:var(--mono);}

#app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}

/* HEADER */
header.top{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#171b21,#12151a);
  flex-shrink:0;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand .blade-mark{
  width:30px;height:30px;border-radius:6px;
  background:linear-gradient(135deg,var(--accent),#c9541c);
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;color:#161616;
  transform:rotate(-8deg);
}
.brand h1{font-size:20px;margin:0;}
.brand span.tag{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em;}
#homeBtn{background:none;border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:20px;font-size:13px;}
#homeBtn:hover{border-color:var(--accent);color:var(--accent);}

/* LAYOUT */
.body-wrap{flex:1;display:flex;min-height:0;}
nav.rail{
  width:230px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:10px 0;
}
nav.rail .cat-label{
  font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;
  padding:14px 16px 6px;
}
nav.rail button.tool-btn{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:var(--text);
  padding:8px 16px;font-size:13.5px;border-left:3px solid transparent;position:relative;
}
nav.rail button.tool-btn .num{font-family:var(--mono);color:var(--muted);font-size:11px;width:18px;flex-shrink:0;}
nav.rail button.tool-btn:hover{background:var(--panel2);}
nav.rail button.tool-btn.active{background:var(--panel2);border-left-color:var(--accent);color:var(--accent-dim);}

main.stage{flex:1;overflow-y:auto;padding:22px 26px 60px;min-width:0;}
.tool-head{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px;}
.tool-head .eyebrow{font-family:var(--mono);color:var(--accent);font-size:11px;letter-spacing:.1em;text-transform:uppercase;}
.tool-head h2{font-size:26px;margin:2px 0 4px;}
.tool-head p{color:var(--muted);margin:0;font-size:14px;max-width:640px;}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.col{display:flex;flex-direction:column;gap:6px;}
label{font-size:12px;color:var(--muted);}
input[type=text],input[type=number],input[type=search],select,textarea{
  background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:8px 10px;font-size:13.5px;
}
input[type=range]{accent-color:var(--accent);}
textarea{width:100%;resize:vertical;}
.btn{
  background:var(--accent);color:#1a1206;border:none;border-radius:6px;padding:9px 16px;font-weight:600;font-size:13.5px;
}
.btn:hover{background:var(--accent-dim);}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--text);}
.btn.ghost:hover{border-color:var(--accent2);color:var(--accent2);}
.btn.danger{background:var(--danger);color:#1a0606;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.grid{display:grid;gap:12px;}
.grid.g2{grid-template-columns:1fr 1fr;}
.grid.g3{grid-template-columns:repeat(3,1fr);}
@media(max-width:800px){.grid.g2,.grid.g3{grid-template-columns:1fr;}}
canvas{max-width:100%;background:#0c0e11;border-radius:6px;border:1px solid var(--line);}
video{max-width:100%;border-radius:6px;background:#000;}
.note{font-size:12.5px;color:var(--muted);background:var(--panel2);border-left:3px solid var(--accent2);padding:8px 10px;border-radius:4px;}
.warn{border-left-color:var(--danger);}
.result{font-family:var(--mono);font-size:14px;background:var(--panel2);padding:10px 12px;border-radius:6px;}
.big-result{font-family:var(--mono);font-size:34px;color:var(--accent);}
table{border-collapse:collapse;width:100%;font-size:13px;}
table td,table th{border:1px solid var(--line);padding:6px 8px;}
th{color:var(--muted);text-align:left;}

/* HOME GRID */
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;}
.home-card{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;transition:transform .12s,border-color .12s;
}
.home-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.home-card .num{font-family:var(--mono);color:var(--accent);font-size:11px;}
.home-card h3{font-size:15px;margin:4px 0 2px;}
.home-card p{font-size:12px;color:var(--muted);margin:0;}

.tab-strip{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.tab-strip button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:6px 12px;font-size:12.5px;}
.tab-strip button.active{border-color:var(--accent);color:var(--accent);}

.toast{position:fixed;bottom:20px;right:20px;background:var(--panel2);border:1px solid var(--accent);color:var(--text);
  padding:10px 16px;border-radius:8px;font-size:13px;z-index:999;opacity:0;transform:translateY(10px);transition:.25s;}
.toast.show{opacity:1;transform:translateY(0);}

.bible-verse{background:var(--panel2);border-left:3px solid var(--accent);padding:12px 14px;border-radius:6px;margin-bottom:10px;}
.bible-verse b{color:var(--accent-dim);}

::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <div class="blade-mark">FT</div>
      <div>
        <h1>ForTe WebSwissKnife</h1>
        <span class="tag">30 TOOLS · ONE BLADE AT A TIME</span>
      </div>
    </div>
    <button id="homeBtn" onclick="goHome()">⌂ Home</button>
  </header>

  <div class="body-wrap">
    <nav class="rail" id="rail"></nav>
    <main class="stage" id="stage"></main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================= TOOL REGISTRY ============================= */
const CATS = [
  {name:'Documents', tools:['pdf','fileread','docedit']},
  {name:'Camera & Sensors', tools:['flashlight','distance','heartrate','eyesight','compass','level','decibel']},
  {name:'Calculators & Convert', tools:['calc','unitconv','bmi']},
  {name:'Creative Studio', tools:['graphics','sound','video','image','colors','qr','portraitblur','lowlight','lightmeter','panorama','tuner']},
  {name:'Wellbeing', tools:['triage','anxiety','hearing','bible','thermo']},
  {name:'Productivity', tools:['phoneuse','todo','pomodoro','stopwatch','password','tts','deviceinfo','metronome','reaction','interval','faceidvault','translator']},
  {name:'Pro Hardware (iPhone Pro)', tools:['multicam','loupe','ocr','barcode','gpssurvey','altimeter','arview']},
  {name:'Environment & Sky', tools:['skyguide','airquality','radar']},
];
const TOOLS = {
  pdf:{n:1,title:'PDF Editor & Converter',desc:'Merge, split, rotate, watermark PDFs and convert text or images to PDF.'},
  fileread:{n:2,title:'Universal File Reader',desc:'Open PDF, Word, Excel, CSV, JSON, text and image files for quick viewing.'},
  flashlight:{n:3,title:'Flashlight',desc:'Toggle your rear camera torch as a flashlight (supported Android browsers).'},
  thermo:{n:4,title:'Ambient Thermometer',desc:'Local outdoor temperature via weather service, using your location.'},
  distance:{n:5,title:'Distance & Height Estimator',desc:'Estimate real-world size using a known reference object in a photo.'},
  phoneuse:{n:6,title:'App Screen-Time Tracker',desc:'Tracks time spent inside this web app, by tool, per day.'},
  calc:{n:7,title:'Scientific Calculator & Grapher',desc:'Full scientific calculator with a live function grapher.'},
  eyesight:{n:8,title:'Eyesight Screener',desc:'A distance-calibrated optotype chart to spot-check visual acuity.'},
  heartrate:{n:9,title:'Heart Rate (Camera PPG)',desc:'Estimate pulse by covering your rear camera lens with a fingertip.'},
  triage:{n:10,title:'Symptom Triage Guide',desc:'General guidance for common complaints — not a diagnosis.'},
  docedit:{n:11,title:'Word Doc Editor',desc:'Rich text editor — save to your device as .docx, .html or .txt.'},
  graphics:{n:12,title:'Graphics Editor',desc:'A simple canvas paint tool: shapes, text, freehand, export PNG.'},
  sound:{n:13,title:'Sound Editor',desc:'Record audio, trim, adjust gain, export as WAV.'},
  hearing:{n:14,title:'Hearing Screener',desc:'Play tones across frequencies and volumes to sketch a rough audiogram.'},
  video:{n:15,title:'Video Producer',desc:'Record from your camera with a live text overlay, export as WebM.'},
  bible:{n:16,title:'Bible Encouragement',desc:'Pick how you feel and receive verses, plus a nudge to call someone and pray.'},
  anxiety:{n:17,title:'Anxiety Self-Check',desc:'The standard GAD-7 screening questionnaire, for your own reflection.'},
  unitconv:{n:18,title:'Unit & Currency Converter',desc:'US ⇄ UK units plus live currency conversion.'},
  qr:{n:19,title:'QR Code Tool',desc:'Generate QR codes or scan one using your camera.'},
  password:{n:20,title:'Password Generator',desc:'Create strong passwords and check their strength.'},
  todo:{n:21,title:'Task Manager',desc:'A simple to-do list saved on this device.'},
  pomodoro:{n:22,title:'Focus Timer (Pomodoro)',desc:'Work/break cycles with sound alerts.'},
  compass:{n:23,title:'Compass',desc:'Digital compass using your device orientation sensor.'},
  level:{n:24,title:'Bubble Level',desc:'Turn your phone into a spirit level.'},
  decibel:{n:25,title:'Sound Level Meter',desc:'Relative ambient loudness reading from your microphone.'},
  tts:{n:26,title:'Text ⇄ Speech Studio',desc:'Text-to-speech and speech-to-text, in your browser.'},
  image:{n:27,title:'Image Compressor & Resizer',desc:'Shrink photos and resize dimensions before sharing.'},
  colors:{n:28,title:'Color Studio',desc:'Pick a color, generate shades, tints and a matching palette.'},
  stopwatch:{n:29,title:'Stopwatch & Countdown',desc:'Precision timers for workouts, cooking, or study.'},
  bmi:{n:30,title:'BMI & Body Metrics',desc:'Body mass index and basic body metric calculations.'},
  deviceinfo:{n:31,title:'Device Dashboard',desc:'Battery, connection, and screen information for this device.'},
  multicam:{n:32,title:'Pro Multi-Lens Camera',desc:'Switch between your ultra-wide, wide and telephoto lenses with continuous zoom.'},
  loupe:{n:33,title:'Digital Magnifier / Loupe',desc:'Turn your camera and torch into a zoomable magnifying glass with freeze-frame.'},
  ocr:{n:34,title:'Live Text Scanner (OCR)',desc:'Extract editable text from any photo, sign, or document, on-device.'},
  barcode:{n:35,title:'Barcode & Product Lookup',desc:'Scan a barcode and pull up product info.'},
  gpssurvey:{n:36,title:'Precision GPS Surveyor',desc:'Live latitude, longitude, altitude, heading, speed and accuracy from your GPS.'},
  altimeter:{n:37,title:'Altimeter',desc:'GPS-and-barometer fused altitude, with a relative height tracker.'},
  arview:{n:38,title:'AR Quick Look Viewer',desc:'Place real-scale 3D objects in your room using Safari\'s native AR viewer.'},
  portraitblur:{n:39,title:'Portrait Blur Studio',desc:'A simulated background-blur effect for portrait-style photos.'},
  lowlight:{n:40,title:'Low-Light Boost Viewer',desc:'Live brightness and contrast boost for seeing better in the dark.'},
  lightmeter:{n:41,title:'Photography Light Meter',desc:'Rough exposure-value estimate with suggested aperture/shutter combos.'},
  panorama:{n:42,title:'Panorama Stitch Assistant',desc:'Capture a few overlapping shots and stitch a wide panorama.'},
  metronome:{n:43,title:'Metronome & Tap Tempo',desc:'Precise, adjustable click track with tap-tempo detection.'},
  reaction:{n:44,title:'Reaction Time Tester',desc:'Measure your visual reaction speed over several trials.'},
  interval:{n:45,title:'Interval / HIIT Timer',desc:'Work/rest rounds with audio cues for workouts.'},
  faceidvault:{n:46,title:'Face ID Secure Vault',desc:'Gate a private notes vault behind your device\'s Face ID / Touch ID.'},
  translator:{n:47,title:'Live Translator',desc:'Speak in one language, hear it spoken back in another.'},
  skyguide:{n:48,title:'Sky Guide',desc:'Sun position, moon phase and golden hour for your exact location.'},
  airquality:{n:49,title:'Air Quality & UV Monitor',desc:'Current AQI, PM2.5/PM10 and UV index for where you are.'},
  radar:{n:50,title:'Weather Radar',desc:'Live radar and storm tracking map centered on your location.'},
  tuner:{n:51,title:'Instrument Tuner',desc:'Real-time pitch detection and frequency spectrum for tuning instruments.'},
};

let currentTool = null;
let usageLog = JSON.parse(localStorage.getItem('fw_usage')||'{}');
let usageStart = null, usageStartTool = null;

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove('show'),2200);
}
function download(filename, blob){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
}

/* ============================= NAV / SHELL ============================= */
function buildRail(){
  const rail=document.getElementById('rail'); rail.innerHTML='';
  CATS.forEach(cat=>{
    const lab=document.createElement('div'); lab.className='cat-label'; lab.textContent=cat.name; rail.appendChild(lab);
    cat.tools.forEach(id=>{
      const t=TOOLS[id];
      const b=document.createElement('button'); b.className='tool-btn'; b.id='nav-'+id;
      b.innerHTML=`<span class="num">${String(t.n).padStart(2,'0')}</span><span>${t.title}</span>`;
      b.onclick=()=>openTool(id);
      rail.appendChild(b);
    });
  });
}
function goHome(){
  logUsageStop();
  currentTool=null;
  document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));
  const stage=document.getElementById('stage');
  let cards='';
  Object.keys(TOOLS).forEach(id=>{
    const t=TOOLS[id];
    cards+=`<div class="home-card" onclick="openTool('${id}')"><div class="num">${String(t.n).padStart(2,'0')}</div><h3>${t.title}</h3><p>${t.desc}</p></div>`;
  });
  stage.innerHTML=`<div class="tool-head"><span class="eyebrow">Toolbox</span><h2>Welcome back, Inno</h2>
    <p>30 tools, one blade at a time. Pick a slot on the left, or tap a card below.</p></div>
    <div class="home-grid">${cards}</div>`;
}
function logUsageStop(){
  if(usageStartTool && usageStart){
    const secs=(Date.now()-usageStart)/1000;
    const day=new Date().toISOString().slice(0,10);
    usageLog[day]=usageLog[day]||{};
    usageLog[day][usageStartTool]=(usageLog[day][usageStartTool]||0)+secs;
    localStorage.setItem('fw_usage', JSON.stringify(usageLog));
  }
  usageStart=null; usageStartTool=null;
}
function openTool(id){
  logUsageStop();
  currentTool=id; usageStart=Date.now(); usageStartTool=id;
  document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));
  const nb=document.getElementById('nav-'+id); if(nb) nb.classList.add('active');
  const t=TOOLS[id];
  const stage=document.getElementById('stage');
  stage.innerHTML=`<div class="tool-head"><span class="eyebrow">Blade ${String(t.n).padStart(2,'0')}</span><h2>${t.title}</h2><p>${t.desc}</p></div><div id="toolBody"></div>`;
  RENDER[id]();
}
window.addEventListener('beforeunload', logUsageStop);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) logUsageStop(); else if(currentTool){usageStart=Date.now();usageStartTool=currentTool;} });

const RENDER = {};
buildRail(); goHome();
</script>

<!-- ===================== TOOL 1: PDF EDITOR ===================== -->
<script>
RENDER.pdf = function(){
  const body=document.getElementById('toolBody');
  body.innerHTML=`
  <div class="tab-strip" id="pdfTabs"></div>
  <div id="pdfPane"></div>`;
  const tabs=[['merge','Merge PDFs'],['split','Split / Extract'],['rotate','Rotate'],['watermark','Watermark / Text'],['topdf','Image / Text → PDF']];
  const strip=document.getElementById('pdfTabs');
  let active='merge';
  function renderTabs(){
    strip.innerHTML=tabs.map(([id,label])=>`<button class="${id===active?'active':''}" onclick="pdfTab('${id}')">${label}</button>`).join('');
  }
  window.pdfTab=(id)=>{active=id; renderTabs(); renderPane();};
  function renderPane(){
    const pane=document.getElementById('pdfPane');
    if(active==='merge'){
      pane.innerHTML=`<div class="panel"><label>Choose 2+ PDF files, in the order you want them merged</label><br>
      <input type="file" id="mergeFiles" accept="application/pdf" multiple><br><br>
      <button class="btn" onclick="pdfMerge()">Merge & Download</button></div>`;
    } else if(active==='split'){
      pane.innerHTML=`<div class="panel"><label>Choose one PDF</label><br>
      <input type="file" id="splitFile" accept="application/pdf"><br><br>
      <label>Page range to extract (e.g. 1-3,5)</label><br>
      <input type="text" id="splitRange" placeholder="1-3,5"><br><br>
      <button class="btn" onclick="pdfSplit()">Extract & Download</button></div>`;
    } else if(active==='rotate'){
      pane.innerHTML=`<div class="panel"><label>Choose one PDF</label><br>
      <input type="file" id="rotFile" accept="application/pdf"><br><br>
      <label>Rotate by</label>
      <select id="rotDeg"><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select><br><br>
      <button class="btn" onclick="pdfRotate()">Rotate & Download</button></div>`;
    } else if(active==='watermark'){
      pane.innerHTML=`<div class="panel"><label>Choose one PDF</label><br>
      <input type="file" id="wmFile" accept="application/pdf"><br><br>
      <label>Watermark text</label><br>
      <input type="text" id="wmText" value="ForTe / Team21 Academy"><br><br>
      <button class="btn" onclick="pdfWatermark()">Stamp & Download</button></div>`;
    } else if(active==='topdf'){
      pane.innerHTML=`<div class="panel">
      <label>Convert images to a PDF (one page each)</label><br>
      <input type="file" id="imgToPdf" accept="image/*" multiple><br>
      <button class="btn ghost" onclick="pdfFromImages()">Images → PDF</button>
      <hr style="border-color:var(--line);margin:16px 0;">
      <label>Convert plain text to a PDF</label><br>
      <textarea id="textToPdf" rows="6" placeholder="Type or paste text..."></textarea><br><br>
      <button class="btn" onclick="pdfFromText()">Text → PDF</button>
      </div>`;
    }
  }
  renderTabs(); renderPane();
};
async function pdfMerge(){
  const files=document.getElementById('mergeFiles').files;
  if(files.length<2) return toast('Choose at least 2 PDFs');
  const {PDFDocument}=PDFLib;
  const out=await PDFDocument.create();
  for(const f of files){
    const bytes=await f.arrayBuffer();
    const src=await PDFDocument.load(bytes);
    const pages=await out.copyPages(src, src.getPageIndices());
    pages.forEach(p=>out.addPage(p));
  }
  const bytes=await out.save();
  download('merged.pdf', new Blob([bytes],{type:'application/pdf'}));
  toast('Merged PDF downloaded');
}
function parseRanges(str,max){
  const set=new Set();
  str.split(',').forEach(part=>{
    part=part.trim(); if(!part) return;
    if(part.includes('-')){ const [a,b]=part.split('-').map(n=>parseInt(n));
      for(let i=a;i<=b;i++) if(i>=1&&i<=max) set.add(i-1);
    } else { const i=parseInt(part); if(i>=1&&i<=max) set.add(i-1); }
  });
  return [...set].sort((a,b)=>a-b);
}
async function pdfSplit(){
  const f=document.getElementById('splitFile').files[0]; if(!f) return toast('Choose a PDF');
  const range=document.getElementById('splitRange').value.trim();
  const {PDFDocument}=PDFLib;
  const src=await PDFDocument.load(await f.arrayBuffer());
  const idx = range? parseRanges(range, src.getPageCount()) : src.getPageIndices();
  if(!idx.length) return toast('No valid pages in that range');
  const out=await PDFDocument.create();
  const pages=await out.copyPages(src, idx);
  pages.forEach(p=>out.addPage(p));
  const bytes=await out.save();
  download('extracted.pdf', new Blob([bytes],{type:'application/pdf'}));
  toast('Extracted pages downloaded');
}
async function pdfRotate(){
  const f=document.getElementById('rotFile').files[0]; if(!f) return toast('Choose a PDF');
  const deg=parseInt(document.getElementById('rotDeg').value);
  const {PDFDocument, degrees}=PDFLib;
  const doc=await PDFDocument.load(await f.arrayBuffer());
  doc.getPages().forEach(p=>{ const cur=p.getRotation().angle; p.setRotation(degrees(cur+deg)); });
  const bytes=await doc.save();
  download('rotated.pdf', new Blob([bytes],{type:'application/pdf'}));
  toast('Rotated PDF downloaded');
}
async function pdfWatermark(){
  const f=document.getElementById('wmFile').files[0]; if(!f) return toast('Choose a PDF');
  const text=document.getElementById('wmText').value||'WATERMARK';
  const {PDFDocument, rgb, StandardFonts}=PDFLib;
  const doc=await PDFDocument.load(await f.arrayBuffer());
  const font=await doc.embedFont(StandardFonts.HelveticaBold);
  doc.getPages().forEach(p=>{
    const {width,height}=p.getSize();
    p.drawText(text,{x:width/2-Math.min(220,text.length*6), y:height/2, size:28, font, color:rgb(0.85,0.4,0.1), opacity:0.28, rotate:PDFLib.degrees(-30)});
  });
  const bytes=await doc.save();
  download('watermarked.pdf', new Blob([bytes],{type:'application/pdf'}));
  toast('Watermarked PDF downloaded');
}
async function pdfFromImages(){
  const files=document.getElementById('imgToPdf').files; if(!files.length) return toast('Choose images');
  const {PDFDocument}=PDFLib;
  const doc=await PDFDocument.create();
  for(const f of files){
    const bytes=await f.arrayBuffer();
    let img;
    if(f.type.includes('png')) img=await doc.embedPng(bytes); else img=await doc.embedJpg(bytes);
    const page=doc.addPage([img.width, img.height]);
    page.drawImage(img,{x:0,y:0,width:img.width,height:img.height});
  }
  const bytes=await doc.save();
  download('images.pdf', new Blob([bytes],{type:'application/pdf'}));
  toast('PDF from images downloaded');
}
async function pdfFromText(){
  const text=document.getElementById('textToPdf').value; if(!text.trim()) return toast('Type some text first');
  const {PDFDocument, StandardFonts, rgb}=PDFLib;
  const doc=await PDFDocument.create();
  const font=await doc.embedFont(StandardFonts.Helvetica);
  const size=11, margin=50, pageW=595, pageH=842, maxWidth=pageW-margin*2;
  const words=text.split(/\s+/); let lines=[]; let line='';
  words.forEach(w=>{
    const test=line?line+' '+w:w;
    if(font.widthOfTextAtSize(test,size)>maxWidth){ lines.push(line); line=w; } else line=test;
  });
  if(line) lines.push(line);
  let page=doc.addPage([pageW,pageH]); let y=pageH-margin;
  lines.forEach(l=>{
    if(y<margin){ page=doc.addPage([pageW,pageH]); y=pageH-margin; }
    page.drawText(l,{x:margin,y,size,font,color:rgb(0,0,0)}); y-=size*1.4;
  });
  const bytes=await doc.save();
  download('document.pdf', new Blob([bytes],{type:'application/pdf'}));
  toast('PDF downloaded');
}
</script>

<script>
RENDER.fileread = function(){
  const body=document.getElementById('toolBody');
  body.innerHTML=`<div class="panel">
    <input type="file" id="anyFile">
    <div class="note" style="margin-top:8px;">Supports PDF, Word (.docx), Excel/CSV (.xlsx/.csv), JSON, plain text, and images.</div>
  </div>
  <div id="readOut"></div>`;
  document.getElementById('anyFile').onchange = async (e)=>{
    const f=e.target.files[0]; if(!f) return;
    const out=document.getElementById('readOut'); out.innerHTML='<div class="panel">Reading…</div>';
    const ext=f.name.split('.').pop().toLowerCase();
    try{
      if(ext==='pdf'){
        pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const buf=await f.arrayBuffer();
        const pdf=await pdfjsLib.getDocument({data:buf}).promise;
        let text='';
        for(let i=1;i<=pdf.numPages;i++){
          const page=await pdf.getPage(i);
          const content=await page.getTextContent();
          text+= `\n--- Page ${i} ---\n` + content.items.map(it=>it.str).join(' ');
        }
        out.innerHTML=`<div class="panel"><b>${pdf.numPages} page(s)</b><textarea rows="18" readonly>${text.replace(/</g,'&lt;')}</textarea></div>`;
      } else if(ext==='docx'){
        const buf=await f.arrayBuffer();
        const res=await mammoth.convertToHtml({arrayBuffer:buf});
        out.innerHTML=`<div class="panel">${res.value}</div>`;
      } else if(ext==='xlsx'||ext==='xls'||ext==='csv'){
        const buf=await f.arrayBuffer();
        const wb=XLSX.read(buf,{type:'array'});
        let html='';
        wb.SheetNames.forEach(name=>{
          html+=`<h3>${name}</h3>`+XLSX.utils.sheet_to_html(wb.Sheets[name]);
        });
        out.innerHTML=`<div class="panel">${html}</div>`;
      } else if(ext==='json'){
        const txt=await f.text();
        let pretty; try{ pretty=JSON.stringify(JSON.parse(txt),null,2);}catch{ pretty=txt; }
        out.innerHTML=`<div class="panel"><textarea rows="18" readonly>${pretty.replace(/</g,'&lt;')}</textarea></div>`;
      } else if(['png','jpg','jpeg','gif','webp','bmp'].includes(ext)){
        const url=URL.createObjectURL(f);
        out.innerHTML=`<div class="panel"><img src="${url}" style="max-width:100%;border-radius:8px;"></div>`;
      } else if(['mp3','wav','ogg','m4a'].includes(ext)){
        const url=URL.createObjectURL(f);
        out.innerHTML=`<div class="panel"><audio controls src="${url}" style="width:100%;"></audio></div>`;
      } else if(['mp4','webm','mov'].includes(ext)){
        const url=URL.createObjectURL(f);
        out.innerHTML=`<div class="panel"><video controls src="${url}" style="width:100%;"></video></div>`;
      } else {
        const txt=await f.text();
        out.innerHTML=`<div class="panel"><textarea rows="18" readonly>${txt.replace(/</g,'&lt;')}</textarea></div>`;
      }
    }catch(err){ out.innerHTML=`<div class="panel note warn">Could not read this file: ${err.message}</div>`; }
  };
};
</script>

<!-- ===================== TOOL 5: DISTANCE/HEIGHT ===================== -->
<script>
RENDER.distance = function(){
  const body=document.getElementById('toolBody');
  body.innerHTML=`<div class="panel">
  <div class="note">Method: take a photo that includes something of known size (a door, an A4 sheet, a person of known height) standing at roughly the same distance as your target. Mark the known object's length, then mark the target — the tool scales one against the other.</div>
  <br><input type="file" id="distImg" accept="image/*" capture="environment">
  <div id="distWrap" style="margin-top:12px;"></div>
  </div>`;
  document.getElementById('distImg').onchange=(e)=>{
    const f=e.target.files[0]; if(!f) return;
    const url=URL.createObjectURL(f);
    const img=new Image();
    img.onload=()=>{
      const wrap=document.getElementById('distWrap');
      const scale=Math.min(1, 700/img.width);
      const cv=document.createElement('canvas'); cv.width=img.width*scale; cv.height=img.height*scale;
      const ctx=cv.getContext('2d'); ctx.drawImage(img,0,0,cv.width,cv.height);
      wrap.innerHTML=''; wrap.appendChild(cv);
      wrap.insertAdjacentHTML('beforeend', `
        <div class="row" style="margin-top:10px;">
          <div class="col"><label>Known object real length (cm)</label><input type="number" id="knownLen" value="210"></div>
          <button class="btn ghost" onclick="distMode('known')">1. Draw known object line</button>
          <button class="btn ghost" onclick="distMode('target')">2. Draw target line</button>
          <button class="btn" onclick="distCalc()">Calculate</button>
        </div>
        <div class="result" id="distResult" style="margin-top:10px;">Draw the known-length line first, then the target line.</div>`);
      let mode=null, pts={known:null,target:null}, drawing=false, start=null;
      window.distMode=(m)=>{ mode=m; toast('Click-drag across the '+m+' object on the photo'); };
      cv.onmousedown=cv.ontouchstart=(ev)=>{
        if(!mode) return; drawing=true;
        const r=cv.getBoundingClientRect();
        const p=ev.touches?ev.touches[0]:ev;
        start={x:p.clientX-r.left,y:p.clientY-r.top};
      };
      function moveEnd(ev){
        if(!drawing) return;
        const r=cv.getBoundingClientRect();
        const p=ev.changedTouches?ev.changedTouches[0]:ev;
        const end={x:p.clientX-r.left,y:p.clientY-r.top};
        pts[mode]={start,end};
        drawing=false;
        redraw();
      }
      cv.onmouseup=cv.ontouchend=moveEnd;
      function redraw(){
        ctx.drawImage(img,0,0,cv.width,cv.height);
        if(pts.known){ ctx.strokeStyle='#45d6c4'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(pts.known.start.x,pts.known.start.y); ctx.lineTo(pts.known.end.x,pts.known.end.y); ctx.stroke(); }
        if(pts.target){ ctx.strokeStyle='#ff9640'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(pts.target.start.x,pts.target.start.y); ctx.lineTo(pts.target.end.x,pts.target.end.y); ctx.stroke(); }
      }
      window.distCalc=()=>{
        if(!pts.known||!pts.target) return toast('Draw both lines first');
        const dist=(p)=>Math.hypot(p.end.x-p.start.x,p.end.y-p.start.y);
        const knownPx=dist(pts.known), targetPx=dist(pts.target);
        const knownReal=parseFloat(document.getElementById('knownLen').value)||1;
        const targetReal=(targetPx/knownPx)*knownReal;
        document.getElementById('distResult').innerHTML=`Estimated target length: <b>${targetReal.toFixed(1)} cm</b> (${(targetReal/100).toFixed(2)} m)`;
      };
    };
    img.src=url;
  };
};
</script>

<!-- ===================== TOOL 7: CALCULATOR / GRAPHER ===================== -->
<script>
let calcAngleMode='deg', calcMemory=0, calcHistory=JSON.parse(localStorage.getItem('fw_calc_hist')||'[]');
RENDER.calc = function(){
  const body=document.getElementById('toolBody');
  body.innerHTML=`
  <div class="tab-strip">
    <button class="active" id="calcTabBtn-basic" onclick="calcSwitch('basic')">Calculator</button>
    <button id="calcTabBtn-graph" onclick="calcSwitch('graph')">Grapher</button>
  </div>
  <div id="calcPane"></div>`;
  calcSwitch('basic');
  document.addEventListener('keydown', calcKeyHandler);
};
function calcKeyHandler(e){
  if(currentTool!=='calc') return;
  const pane=document.getElementById('calcPane');
  if(!pane || !pane.querySelector('#calcExpr')) return;
  const el=document.getElementById('calcExpr');
  if(document.activeElement===el && !['Enter','Escape'].includes(e.key)) return;
  const map={'*':'*','/':'/','+':'+','-':'-','.':'.','(':'(',')':')','^':'^'};
  if(/^[0-9]$/.test(e.key)){ el.value+=e.key; }
  else if(map[e.key]){ el.value+=map[e.key]; }
  else if(e.key==='Enter' || e.key==='='){ e.preventDefault(); calcEval(); }
  else if(e.key==='Backspace'){ el.value=el.value.slice(0,-1); }
  else if(e.key==='Escape'){ el.value=''; document.getElementById('calcResult').textContent='0'; }
  else return;
  el.focus();
}
function calcSwitch(mode){
  ['basic','graph'].forEach(m=>document.getElementById('calcTabBtn-'+m).classList.toggle('active', m===mode));
  const pane=document.getElementById('calcPane');
  if(mode==='basic'){
    pane.innerHTML=`<div class="panel">
      <div class="row" style="margin-bottom:8px;justify-content:space-between;">
        <div class="row">
          <button class="btn ghost" onclick="calcAngleMode=(calcAngleMode==='deg'?'rad':'deg'); document.getElementById('calcAngleLbl').textContent=calcAngleMode.toUpperCase();" id="calcAngleBtn">Mode: <span id="calcAngleLbl">DEG</span></button>
          <span class="mono" style="font-size:12px;color:var(--muted);">M = ${calcMemory}</span>
        </div>
        <div class="row">
          <button class="btn ghost" onclick="calcMemory=0;toast('Memory cleared')">MC</button>
          <button class="btn ghost" onclick="calcMemory=+(document.getElementById('calcResult').textContent)||0;toast('Stored to memory')">MS</button>
          <button class="btn ghost" onclick="calcInsert(String(calcMemory))">MR</button>
          <button class="btn ghost" onclick="calcMemory+=(+(document.getElementById('calcResult').textContent)||0);toast('M+ done')">M+</button>
        </div>
      </div>
      <input type="text" id="calcExpr" placeholder="e.g. sin(45) + sqrt(2)^3 - log(100,10)" style="width:100%;font-family:var(--mono);font-size:16px;" onkeydown="if(event.key==='Enter')calcEval()">
      <div class="row" style="margin-top:10px;">
        ${['sin(','cos(','tan(','asin(','acos(','atan(','sinh(','cosh(','tanh(','log(','ln(','sqrt(','cbrt(','^','!','pi','e','(',')','mod','abs(','nPr(','nCr(','%'].map(f=>`<button class="btn ghost" onclick="calcInsert('${f}')">${f}</button>`).join('')}
      </div>
      <div class="row" style="margin-top:8px;">
        <button class="btn" onclick="calcEval()">Evaluate (Enter)</button>
        <button class="btn ghost" onclick="document.getElementById('calcExpr').value='';document.getElementById('calcResult').textContent='0';">Clear (Esc)</button>
        <button class="btn ghost" onclick="const el=document.getElementById('calcExpr'); el.value=el.value.slice(0,-1);">⌫ Backspace</button>
      </div>
      <div class="big-result" id="calcResult" style="margin-top:12px;">0</div>
      <div class="note" style="margin-top:10px;">Full physical/Bluetooth keyboard support: type numbers and + - * / ^ ( ) directly, Enter to evaluate, Backspace to delete, Escape to clear.</div>
      <div id="calcHistBox" style="margin-top:12px;"></div>
    </div>`;
    calcRenderHistory();
  } else {
    pane.innerHTML=`<div class="panel">
      <label>f(x) =</label>
      <input type="text" id="graphExpr" value="sin(x)*x" style="width:100%;font-family:var(--mono);">
      <div class="row" style="margin-top:8px;">
        <div class="col"><label>x min</label><input type="number" id="gxmin" value="-10" style="width:90px;"></div>
        <div class="col"><label>x max</label><input type="number" id="gxmax" value="10" style="width:90px;"></div>
        <button class="btn" onclick="graphDraw()">Plot</button>
      </div>
      <canvas id="graphCanvas" width="700" height="380" style="margin-top:10px;width:100%;"></canvas>
    </div>`;
    graphDraw();
  }
}
function calcInsert(s){ const el=document.getElementById('calcExpr'); if(el){ el.value+=s; el.focus(); } }
function calcRenderHistory(){
  const box=document.getElementById('calcHistBox'); if(!box) return;
  box.innerHTML = calcHistory.length? `<div class="note"><b>History</b><br>${calcHistory.slice(-8).reverse().map(h=>`${h.expr} = <b>${h.result}</b>`).join('<br>')}</div>` : '';
}
function nPr(n,r){ let f=1; for(let i=0;i<r;i++) f*=(n-i); return f; }
function nCr(n,r){ return nPr(n,r)/factorial(r); }
function factorial(n){ let f=1; for(let i=2;i<=n;i++) f*=i; return f; }
function safeMathEval(expr, forGraph){
  expr = expr.replace(/\^/g,'**').replace(/(\d+)!/g, (m,n)=>factorial(parseInt(n)));
  const deg2rad = d=>d*Math.PI/180;
  const trig = forGraph || calcAngleMode==='rad' ? {
    sin:Math.sin, cos:Math.cos, tan:Math.tan, asin:Math.asin, acos:Math.acos, atan:Math.atan
  } : {
    sin:d=>Math.sin(deg2rad(d)), cos:d=>Math.cos(deg2rad(d)), tan:d=>Math.tan(deg2rad(d)),
    asin:d=>Math.asin(d)*180/Math.PI, acos:d=>Math.acos(d)*180/Math.PI, atan:d=>Math.atan(d)*180/Math.PI
  };
  const scope = {
    pi:Math.PI, e:Math.E, ...trig,
    sinh:Math.sinh, cosh:Math.cosh, tanh:Math.tanh,
    sqrt:Math.sqrt, cbrt:Math.cbrt, abs:Math.abs, log:(a,b)=>b?Math.log(a)/Math.log(b):Math.log10(a), ln:Math.log,
    mod:(a,b)=>a%b, exp:Math.exp, min:Math.min, max:Math.max, round:Math.round, floor:Math.floor, ceil:Math.ceil,
    nPr, nCr, x: window._graphX||0
  };
  const keys=Object.keys(scope), vals=Object.values(scope);
  // eslint-disable-next-line no-new-func
  const fn=new Function(...keys, `"use strict"; return (${expr});`);
  return fn(...vals);
}
function calcEval(){
  const expr=document.getElementById('calcExpr').value;
  try{
    const r=safeMathEval(expr);
    const result = Number.isFinite(r)? (+r.toFixed(10)) : 'Error';
    document.getElementById('calcResult').textContent = result;
    if(result!=='Error'){ calcHistory.push({expr,result}); if(calcHistory.length>50) calcHistory.shift(); localStorage.setItem('fw_calc_hist', JSON.stringify(calcHistory)); calcRenderHistory(); }
  }
  catch(e){ document.getElementById('calcResult').textContent='Error'; }
}
function graphDraw(){
  const cv=document.getElementById('graphCanvas'); const ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height;
  ctx.fillStyle='#0c0e11'; ctx.fillRect(0,0,W,H);
  const xmin=parseFloat(document.getElementById('gxmin').value), xmax=parseFloat(document.getElementById('gxmax').value);
  const expr=document.getElementById('graphExpr').value;
  // axes
  const yToPix=(y,ymin,ymax)=>H - ( (y-ymin)/(ymax-ymin) )*H;
  const xToPix=(x)=>((x-xmin)/(xmax-xmin))*W;
  let pts=[]; let ymin=Infinity, ymax=-Infinity;
  for(let i=0;i<=W;i++){
    const x=xmin+(xmax-xmin)*i/W;
    let y; try{ window._graphX=x; y=safeMathEval(expr.replace(/\bx\b/g,'('+x+')'), true); }catch{ y=NaN; }
    if(Number.isFinite(y)){ pts.push([x,y]); if(y<ymin)ymin=y; if(y>ymax)ymax=y; }
  }
  if(!Number.isFinite(ymin)){ ymin=-1; ymax=1; }
  if(ymin===ymax){ ymin-=1; ymax+=1; }
  const pad=(ymax-ymin)*0.1; ymin-=pad; ymax+=pad;
  // grid + axes
  ctx.strokeStyle='#2c343d'; ctx.lineWidth=1;
  if(xmin<0&&xmax>0){ ctx.beginPath(); ctx.moveTo(xToPix(0),0); ctx.lineTo(xToPix(0),H); ctx.stroke(); }
  if(ymin<0&&ymax>0){ ctx.beginPath(); ctx.moveTo(0,yToPix(0,ymin,ymax)); ctx.lineTo(W,yToPix(0,ymin,ymax)); ctx.stroke(); }
  ctx.strokeStyle='#ff9640'; ctx.lineWidth=2; ctx.beginPath();
  pts.forEach(([x,y],i)=>{ const px=xToPix(x), py=yToPix(y,ymin,ymax); if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py); });
  ctx.stroke();
}
</script>

<script>
RENDER.eyesight = function(){
  const body=document.getElementById('toolBody');
  body.innerHTML=`<div class="panel">
    <div class="note warn">Screening only — not a substitute for a real eye exam with an optometrist.</div>
    <div class="row" style="margin-top:10px;">
      <div class="col"><label>Distance from screen (cm)</label><input type="number" id="eyeDist" value="300"></div>
      <div class="col"><label>Screen width (cm, measure your device)</label><input type="number" id="eyeScreenCm" value="14.5"></div>
      <button class="btn" onclick="eyeShow()">Start</button>

    <div class="result" id="eyeResult" style="margin-top:12px;"></div>

};
const EYE_LINES = [ // approximate Snellen-equivalent letter height in arcminutes -> we compute px size
  {label:'20/200', size:5*8.7},{label:'20/100', size:5*4.35},{label:'20/70', size:5*3.05},
  {label:'20/50', size:5*2.18},{label:'20/40', size:5*1.74},{label:'20/30', size:5*1.31},
  {label:'20/25', size:5*1.09},{label:'20/20', size:5*0.87},{label:'20/15', size:5*0.65}
];
let eyeIdx=0;
function eyeShow(){
  eyeIdx=0; eyeRenderLine();
  document.getElementById('eyeControls').innerHTML=`
    <button class="btn ghost" onclick="eyeResult(true)">I can read it clearly</button>
    <button class="btn danger" onclick="eyeResult(false)">Too blurry</button>`;
  document.getElementById('eyeResult').textContent='';
}
function eyeRenderLine(){
  const distCm=parseFloat(document.getElementById('eyeDist').value)||300;
  const screenCm=parseFloat(document.getElementById('eyeScreenCm').value)||14.5;
  const pxPerCm = window.innerWidth<800 ? (window.innerWidth*0.7)/screenCm : 700/screenCm; // rough
  const line=EYE_LINES[eyeIdx];
  // physical letter height for the given acuity line at given distance, scaled from standard 20ft(609.6cm) chart
  const standardDist=609.6;
  const scaleFactor = distCm/standardDist;
  const heightCm = line.size * scaleFactor * 0.35; // 0.35 empirical scale to keep on-screen
  const heightPx = Math.max(14, heightCm*pxPerCm);
  const letters=['E','F','P','T','O','Z','L','D'];
  const letter=letters[Math.floor(Math.random()*letters.length)];
  document.getElementById('eyeChart').innerHTML=`<div style="font-family:Arial,sans-serif;font-weight:bold;font-size:${heightPx}px;line-height:1;">${letter}</div><div class="note" style="display:inline-block;margin-top:8px;">Line ${eyeIdx+1}/${EYE_LINES.length} · target ${line.label}</div>`;
}
function eyeResult(canRead){
  if(canRead && eyeIdx<EYE_LINES.length-1){ eyeIdx++; eyeRenderLine(); }
  else{
    const line=EYE_LINES[Math.max(0,canRead?eyeIdx:eyeIdx-1)];
    document.getElementById('eyeResult').innerHTML=`Smallest line read comfortably: <b>${line?line.label:'20/200 or worse'}</b>. If this is worse than 20/30, or has changed recently, it's worth booking an eye exam.`;
    document.getElementById('eyeControls').innerHTML='';
  }
}
</script>

<!-- ===================== TOOL 9: HEART RATE (PPG) ===================== -->
<script>
RENDER.heartrate = function(){
  const body=document.getElementById('toolBody');
  body.innerHTML=`<div class="panel">
    <div class="note warn">Not a medical device. Cover your rear camera lens (and flash if present) gently with a fingertip in normal light, keep still for 15 seconds.</div>
    <br><video id="hrVideo" autoplay playsinline muted style="width:1px;height:1px;position:absolute;opacity:0;"></video>
    <canvas id="hrCanvas" width="40" height="40" style="display:none;"></canvas>
    <button class="btn" id="hrBtn" onclick="hrStart()">Start 15s Reading</button>
    <div class="big-result" id="hrResult" style="margin-top:14px;">--</div>
    <canvas id="hrWave" width="700" height="140" style="margin-top:10px;width:100%;"></canvas>
  </div>`;
};
async function hrStart(){
  const btn=document.getElementById('hrBtn'); btn.disabled=true;
  const video=document.getElementById('hrVideo'); const canvas=document.getElementById('hrCanvas'); const ctx=canvas.getContext('2d');
  const wave=document.getElementById('hrWave'); const wctx=wave.getContext('2d');
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
    video.srcObject=stream;
    const track=stream.getVideoTracks()[0];
    try{ const caps=track.getCapabilities?track.getCapabilities():{}; if(caps.torch) await track.applyConstraints({advanced:[{torch:true}]}); }catch(e){}
    await new Promise(r=>video.onloadedmetadata=r);
    let samples=[]; const start=Date.now(); const duration=15000;
    function sample(){
      ctx.drawImage(video,0,0,40,40);
      const d=ctx.getImageData(0,0,40,40).data;
      let sum=0; for(let i=0;i<d.length;i+=4) sum+=d[i];
      samples.push(sum/(d.length/4));
      const t=Date.now()-start;
      if(t<duration){ requestAnimationFrame(sample); }
      else{ finish(); }
    }
    function finish(){
      stream.getTracks().forEach(t=>t.stop());
      // draw waveform
      wctx.fillStyle='#0c0e11'; wctx.fillRect(0,0,700,140);
      const min=Math.min(...samples), max=Math.max(...samples);
      wctx.strokeStyle='#ff9640'; wctx.lineWidth=2; wctx.beginPath();
      samples.forEach((s,i)=>{
        const x=i/(samples.length-1)*700; const y=140-((s-min)/(max-min||1))*130-5;
        i===0?wctx.moveTo(x,y):wctx.lineTo(x,y);
      });
      wctx.stroke();
      // simple peak detection
      const smoothed=samples.map((s,i,arr)=>{
        const lo=Math.max(0,i-2), hi=Math.min(arr.length-1,i+2);
        let sum=0,c=0; for(let j=lo;j<=hi;j++){sum+=arr[j];c++;} return sum/c;
      });
      let peaks=0; const thresh=(max-min)*0.15;
      for(let i=1;i<smoothed.length-1;i++){
        if(smoothed[i]>smoothed[i-1]&&smoothed[i]>=smoothed[i+1] && (max-smoothed[i])<(max-min-thresh)) peaks++;
      }
      const bpm=Math.round(peaks/(duration/1000)*60);
      document.getElementById('hrResult').textContent = bpm>30&&bpm<220 ? bpm+' BPM (approx.)' : 'Unclear — try again with steadier finger pressure';
      document.getElementById('hrBtn').disabled=false;
    }
    requestAnimationFrame(sample);
  }catch(err){ toast('Camera access denied: '+err.message); btn.disabled=false; }
}
</script>

<script>
RENDER.graphics = function(){
  const body=document.getElementById('toolBody');
  body.innerHTML=`<div class="panel">
    <div class="row">
      <select id="gTool"><option value="pen">Pen</option><option value="line">Line</option><option value="rect">Rectangle</option><option value="circle">Circle</option><option value="text">Text</option><option value="eraser">Eraser</option></select>
      <input type="color" id="gColor" value="#ff9640">
      <input type="range" id="gWidth" min="1" max="40" value="4">
      <input type="file" id="gImgUpload" accept="image/*">
      <button class="btn ghost" onclick="gUndo()">Undo</button>
      <button class="btn ghost" onclick="gClear()">Clear</button>
      <button class="btn" onclick="gExport()">Export PNG</button>
    </div>
    <canvas id="gCanvas" width="800" height="500" style="margin-top:10px;width:100%;touch-action:none;cursor:crosshair;"></canvas>
  </div>`;
  const cv=document.getElementById('gCanvas'), ctx=cv.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  let history=[ctx.getImageData(0,0,cv.width,cv.height)];
  function saveState(){ history.push(ctx.getImageData(0,0,cv.width,cv.height)); if(history.length>25) history.shift(); }
  window.gUndo=()=>{ if(history.length>1){ history.pop(); ctx.putImageData(history[history.length-1],0,0); } };
  window.gClear=()=>{ ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height); saveState(); };
  window.gExport=()=>{ cv.toBlob(b=>download('drawing.png',b)); };
  document.getElementById('gImgUpload').onchange=(e)=>{
    const f=e.target.files[0]; if(!f) return;
    const img=new Image(); img.onload=()=>{ ctx.drawImage(img,0,0,cv.width,cv.height); saveState(); };
    img.src=URL.createObjectURL(f);
  };
  let drawing=false, snapshot=null;
  function pos(ev){ const r=cv.getBoundingClientRect(); const p=ev.touches?ev.touches[0]:ev;
    return {x:(p.clientX-r.left)*(cv.width/r.width), y:(p.clientY-r.top)*(cv.height/r.height)}; }
  function start(ev){
    ev.preventDefault();
    const tool=document.getElementById('gTool').value;
    const p=pos(ev); drawing=true;
    if(tool==='text'){
      const txt=prompt('Text:'); if(txt){ ctx.fillStyle=document.getElementById('gColor').value; ctx.font=(document.getElementById('gWidth').value*4)+'px Inter'; ctx.fillText(txt,p.x,p.y); saveState(); }
      drawing=false; return;
    }
    snapshot=ctx.getImageData(0,0,cv.width,cv.height);
    cv._start=p;
    if(tool==='pen'||tool==='eraser'){ ctx.beginPath(); ctx.moveTo(p.x,p.y); }
  }
  function move(ev){
    if(!drawing) return; ev.preventDefault();
    const tool=document.getElementById('gTool').value; const p=pos(ev);
    const color=tool==='eraser'?'#ffffff':document.getElementById('gColor').value;
    const width=parseInt(document.getElementById('gWidth').value);
    if(tool==='pen'||tool==='eraser'){
      ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineCap='round'; ctx.lineTo(p.x,p.y); ctx.stroke();
    } else {
      ctx.putImageData(snapshot,0,0);
      ctx.strokeStyle=color; ctx.lineWidth=width;
      const s=cv._start;
      if(tool==='line'){ ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(p.x,p.y); ctx.stroke(); }
      else if(tool==='rect'){ ctx.strokeRect(s.x,s.y,p.x-s.x,p.y-s.y); }
      else if(tool==='circle'){ const r=Math.hypot(p.x-s.x,p.y-s.y); ctx.beginPath(); ctx.arc(s.x,s.y,r,0,Math.PI*2); ctx.stroke(); }
    }
  }
  function end(){ if(drawing){ drawing=false; saveState(); } }
  cv.onmousedown=start; cv.onmousemove=move; cv.onmouseup=end; cv.onmouseleave=end;
  cv.ontouchstart=start; cv.ontouchmove=move; cv.ontouchend=end;
};
</script>

<script>
RENDER.sound = function(){
  const body=document.getElementById('toolBody');
  body.innerHTML=`<div class="panel">
    <button class="btn" id="sRecBtn" onclick="sToggleRec()">● Record</button>
    <input type="file" id="sUpload" accept="audio/*" style="margin-left:10px;">
    <div id="sEditArea" style="margin-top:14px;"></div>
  </div>`;
  document.getElementById('sUpload').onchange=async(e)=>{ const f=e.target.files[0]; if(f) sLoadBlob(f); };
};
let sMediaRec=null, sChunks=[], sRecording=false, sAudioCtx=null, sBuffer=null;
async function sToggleRec(){
  const btn=document.getElementById('sRecBtn');
  if(!sRecording){
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    sMediaRec=new MediaRecorder(stream); sChunks=[];
    sMediaRec.ondataavailable=e=>sChunks.push(e.data);
    sMediaRec.onstop=()=>{ sLoadBlob(new Blob(sChunks,{type:'audio/webm'})); stream.getTracks().forEach(t=>t.stop()); };
    sMediaRec.start(); sRecording=true; btn.textContent='■ Stop';
  } else { sMediaRec.stop(); sRecording=false; btn.textContent='● Record'; }
}
async function sLoadBlob(blob){
  sAudioCtx = sAudioCtx || new (window.AudioContext||window.webkitAudioContext)();
  const arr=await blob.arrayBuffer();
  sBuffer=await sAudioCtx.decodeAudioData(arr);
  sRenderEditor();
}
function sRenderEditor(){
  const area=document.getElementById('sEditArea');
  area.innerHTML=`
   <canvas id="sWave" width="800" height="150" style="width:100%;"></canvas>
   <div class="row" style="margin-top:10px;">
     <div class="col"><label>Trim start (s)</label><input type="number" id="sStart" value="0" step="0.1" min="0" max="${sBuffer.duration.toFixed(2)}"></div>
     <div class="col"><label>Trim end (s)</label><input type="number" id="sEnd" value="${sBuffer.duration.toFixed(2)}" step="0.1" min="0" max="${sBuffer.duration.toFixed(2)}"></div>
     <div class="col"><label>Gain (x)</label><input type="number" id="sGain" value="1" step="0.1"></div>
     <button class="btn ghost" onclick="sPreview()">▶ Preview</button>
     <button class="btn" onclick="sExportWav()">Export WAV</button>
   </div>`;
  const cv=document.getElementById('sWave'), ctx=cv.getContext('2d');
  ctx.fillStyle='#0c0e11'; ctx.fillRect(0,0,cv.width,cv.height);
  const data=sBuffer.getChannelData(0); const step=Math.ceil(data.length/cv.width);
  ctx.strokeStyle='#45d6c4'; ctx.beginPath();
  for(let i=0;i<cv.width;i++){
    let min=1,max=-1;
    for(let j=0;j<step;j++){ const v=data[i*step+j]||0; if(v<min)min=v; if(v>max)max=v; }
    ctx.moveTo(i, (1+min)*75); ctx.lineTo(i,(1+max)*75);
  }
  ctx.stroke();
}
function sTrimGain(){
  const start=parseFloat(document.getElementById('sStart').value)||0;
  const end=parseFloat(document.getElementById('sEnd').value)||sBuffer.duration;
  const gain=parseFloat(document.getElementById('sGain').value)||1;
  const sr=sBuffer.sampleRate; const startS=Math.floor(start*sr), endS=Math.min(sBuffer.length,Math.floor(end*sr));
  const len=Math.max(1,endS-startS);
  const out=sAudioCtx.createBuffer(sBuffer.numberOfChannels, len, sr);
  for(let ch=0;ch<sBuffer.numberOfChannels;ch++){
    const src=sBuffer.getChannelData(ch), dst=out.getChannelData(ch);
    for(let i=0;i<len;i++) dst[i]=Math.max(-1,Math.min(1,src[startS+i]*gain));
  }
  return out;
}
function sPreview(){ const buf=sTrimGain(); const src=sAudioCtx.createBufferSource(); src.buffer=buf; src.connect(sAudioCtx.destination); src.start(); }
function sExportWav(){
  const buf=sTrimGain();
  const wav=audioBufferToWav(buf);
  download('edited-audio.wav', new Blob([wav],{type:'audio/wav'}));
}
function audioBufferToWav(buffer){
  const numCh=buffer.numberOfChannels, len=buffer.length*numCh*2+44, ab=new ArrayBuffer(len), view=new DataView(ab);
  const writeStr=(o,s)=>{for(let i=0;i<s.length;i++) view.setUint8(o+i,s.charCodeAt(i));};
  let pos=0;
  writeStr(0,'RIFF'); view.setUint32(4,len-8,true); writeStr(8,'WAVE');
  writeStr(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true);
  view.setUint16(22,numCh,true); view.setUint32(24,buffer.sampleRate,true);
  view.setUint32(28,buffer.sampleRate*numCh*2,true); view.setUint16(32,numCh*2,true); view.setUint16(34,16,true);
  writeStr(36,'data'); view.setUint32(40,len-44,true);
  let offset=44;
  const chans=[]; for(let i=0;i<numCh;i++) chans.push(buffer.getChannelData(i));
  for(let i=0;i<buffer.length;i++){
    for(let ch=0;ch<numCh;ch++){
      let s=Math.max(-1,Math.min(1,chans[ch][i]));
      view.setInt16(offset, s<0?s*0x8000:s*0x7FFF, true); offset+=2;
    }
  }
  return ab;
}
</script>

<script>
RENDER.hearing = function(){
  const body=document.getElementById('toolBody');
  const freqs=[250,500,1000,2000,4000,8000];
  body.innerHTML=`<div class="panel">

    <canvas id="hAudiogram" width="700" height="260" style="margin-top:14px;width:100%;"></canvas>
  </div>`;
  const results={};
  const list=document.getElementById('hFreqList');
  freqs.forEach(f=>{
    const row=document.createElement('div'); row.className='row'; row.style.marginBottom='8px';
    row.innerHTML=`<span class="mono" style="width:70px;">${f} Hz</span>
      <input type="range" min="0" max="100" value="50" id="hvol-${f}">
      <button class="btn ghost" onclick="hPlay(${f})">▶ Play</button>
      <button class="btn ghost" onclick="hMark(${f},true)">I hear it</button>
      <button class="btn danger" onclick="hMark(${f},false)">Nothing</button>
      <span id="hstatus-${f}" class="mono"></span>`;
    list.appendChild(row);
  });
  window._hResults=results;
  window.hDraw=()=>{
    const cv=document.getElementById('hAudiogram'), ctx=cv.getContext('2d');
    ctx.fillStyle='#0c0e11'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.strokeStyle='#2c343d'; ctx.strokeRect(40,10,620,220);
    ctx.fillStyle='#93a2ae'; ctx.font='11px monospace';
    freqs.forEach((f,i)=>{ ctx.fillText(f, 40+i*120, 245); });
    ctx.strokeStyle='#ff9640'; ctx.lineWidth=2; ctx.beginPath();
    freqs.forEach((f,i)=>{
      const v = results[f]!==undefined ? (results[f]?parseInt(document.getElementById('hvol-'+f).value):100) : null;
      if(v===null) return;
      const x=40+i*120, y=10+ (v/100)*220;
      ctx.fillStyle='#ff9640'; ctx.beginPath(); ctx.arc(x,y,4,0,7); ctx.fill();
    });
  };
  hDraw();
};
function hPlay(freq){
  const ctx = window._hAudioCtx = window._hAudioCtx || new (window.AudioContext||window.webkitAudioContext)();
  const vol=parseInt(document.getElementById('hvol-'+freq).value)/100;
  const osc=ctx.createOscillator(); const gain=ctx.createGain();
  osc.frequency.value=freq; gain.gain.value=vol*0.3;
  osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime+1.2);
}
function hMark(freq,heard){
  window._hResults[freq]=heard;
  document.getElementById('hstatus-'+freq).textContent = heard? '✓ heard at '+document.getElementById('hvol-'+freq).value+'%':'✗ not heard';
  hDraw();
}
</script>

<script>
RENDER.video = function(){

    <div class="row" style="margin-top:10px;">
      <input type="text" id="vOverlay" placeholder="Overlay text (optional)" style="flex:1;">
      <button class="btn ghost" id="vStartCam" onclick="vStartCam()">Start Camera</button>
      <button class="btn" id="vRecBtn" onclick="vToggleRec()" disabled>● Record</button>
    </div>
    <div id="vOut" style="margin-top:12px;"></div>
  </div>`;
};
let vStream=null, vRec=null, vChunks=[], vRecording=false, vAnimId=null;
async function vStartCam(){
  vStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
  document.getElementById('vLive').srcObject=vStream;
  document.getElementById('vRecBtn').disabled=false;
  toast('Camera ready');
}
function vDrawLoop(){
  const video=document.getElementById('vLive'), cv=document.getElementById('vCanvas'), ctx=cv.getContext('2d');
  ctx.drawImage(video,0,0,cv.width,cv.height);
  const text=document.getElementById('vOverlay').value;
  if(text){ ctx.font='bold 28px Arial'; ctx.fillStyle='rgba(255,150,64,0.95)'; ctx.fillText(text, 20, cv.height-30); }
  vAnimId=requestAnimationFrame(vDrawLoop);
}
function vToggleRec(){
  const btn=document.getElementById('vRecBtn');
  if(!vRecording){
    const cv=document.getElementById('vCanvas');
    vDrawLoop();
    const canvasStream=cv.captureStream(30);
    // add original audio track
    vStream.getAudioTracks().forEach(t=>canvasStream.addTrack(t));
    vRec=new MediaRecorder(canvasStream,{mimeType:'video/webm'});
    vChunks=[];
    vRec.ondataavailable=e=>vChunks.push(e.data);
    vRec.onstop=()=>{
      cancelAnimationFrame(vAnimId);
      const blob=new Blob(vChunks,{type:'video/webm'});
      const url=URL.createObjectURL(blob);
      document.getElementById('vOut').innerHTML=`<video controls src="${url}" style="width:100%;max-width:500px;"></video><br><button class="btn" onclick="download('forte-video.webm', (function(){return window._vBlob;})())">Download</button>`;
      window._vBlob=blob;
    };
    vRec.start(); vRecording=true; btn.textContent='■ Stop'; btn.classList.add('danger');
  } else { vRec.stop(); vRecording=false; btn.textContent='● Record'; btn.classList.remove('danger'); }
}
</script>

<script>
RENDER.unitconv = function(){
  const body=document.getElementById('toolBody');
  body.innerHTML=`

    <button class="active" id="ucTab-len" onclick="ucSwitch('len')">Length</button>
    <button id="ucTab-wt" onclick="ucSwitch('wt')">Weight</button>
    <button id="ucTab-vol" onclick="ucSwitch('vol')">Volume</button>
    <button id="ucTab-temp" onclick="ucSwitch('temp')">Temperature</button>
    <button id="ucTab-cur" onclick="ucSwitch('cur')">Currency</button>
  </div>
  <div id="ucPane"></div>`;
  ucSwitch('len');
};
const UC_UNITS = {
  len:{m:1, ft:0.3048, in:0.0254, cm:0.01, mile:1609.344, yard:0.9144, km:1000},
  wt:{kg:1, lb:0.453592, oz:0.0283495, g:0.001, stone:6.35029},
  vol:{l:1, 'us_gal':3.78541, 'uk_gal':4.54609, 'us_cup':0.24, ml:0.001, 'fl_oz_us':0.0295735, 'fl_oz_uk':0.0284131}
};
function ucSwitch(mode){
  ['len','wt','vol','temp','cur'].forEach(m=>document.getElementById('ucTab-'+m).classList.toggle('active',m===mode));
  const pane=document.getElementById('ucPane');
  if(mode==='temp'){
    pane.innerHTML=`<div class="panel"><div class="row">
      <div class="col"><label>Value</label><input type="number" id="tempVal" value="98.6"></div>
      <div class="col"><label>From</label><select id="tempFrom"><option value="F">Fahrenheit</option><option value="C">Celsius</option><option value="K">Kelvin</option></select></div>
      <button class="btn" onclick="ucTempCalc()">Convert</button>
    </div><div class="result" id="tempResult" style="margin-top:10px;"></div></div>`;
  } else if(mode==='cur'){
    pane.innerHTML=`<div class="panel"><div class="row">
      <div class="col"><label>Amount</label><input type="number" id="curAmt" value="100"></div>
      <div class="col"><label>From</label><input type="text" id="curFrom" value="USD" style="width:70px;text-transform:uppercase;"></div>
      <div class="col"><label>To</label><input type="text" id="curTo" value="XAF" style="width:70px;text-transform:uppercase;"></div>
      <button class="btn" onclick="ucCurCalc()">Convert</button>
    </div><div class="result" id="curResult" style="margin-top:10px;">Live rates via Frankfurter.dev</div></div>`;
  } else {
    const units=Object.keys(UC_UNITS[mode]);
    pane.innerHTML=`<div class="panel"><div class="row">
      <div class="col"><label>Amount</label><input type="number" id="ucAmt" value="1"></div>
      <div class="col"><label>From</label><select id="ucFrom">${units.map(u=>`<option>${u}</option>`).join('')}</select></div>
      <div class="col"><label>To</label><select id="ucTo">${units.map(u=>`<option>${u}</option>`).join('')}</select></div>
      <button class="btn" onclick="ucCalc('${mode}')">Convert</button>
    </div><div class="result" id="ucResult" style="margin-top:10px;"></div></div>`;
  }
}
function ucCalc(mode){
  const amt=parseFloat(document.getElementById('ucAmt').value)||0;
  const from=document.getElementById('ucFrom').value, to=document.getElementById('ucTo').value;
  const base=amt*UC_UNITS[mode][from]; const result=base/UC_UNITS[mode][to];
  document.getElementById('ucResult').innerHTML=`${amt} ${from} = <b>${result.toFixed(4)} ${to}</b>`;
}
function ucTempCalc(){
  const v=parseFloat(document.getElementById('tempVal').value); const from=document.getElementById('tempFrom').value;
  let c = from==='C'?v : from==='F'?(v-32)*5/9 : v-273.15;
  const f=c*9/5+32, k=c+273.15;
  document.getElementById('tempResult').innerHTML=`${c.toFixed(2)}°C = <b>${f.toFixed(2)}°F</b> = ${k.toFixed(2)}K`;
}
async function ucCurCalc(){
  const amt=parseFloat(document.getElementById('curAmt').value)||0;
  const from=document.getElementById('curFrom').value.toUpperCase(), to=document.getElementById('curTo').value.toUpperCase();
  const out=document.getElementById('curResult'); out.textContent='Fetching rate…';
  try{
    const r=await fetch(`https://api.frankfurter.dev/v1/latest?base=${from}&symbols=${to}`);
    const d=await r.json();
    const rate=d.rates[to];
    if(!rate){ out.textContent='Currency pair not supported by this service.'; return; }
    out.innerHTML=`${amt} ${from} = <b>${(amt*rate).toFixed(2)} ${to}</b> (rate ${rate})`;
  }catch(e){ out.textContent='Could not fetch live rate — check your connection.'; }
}
</script>

let qrScanning=false;
async function qrStartScan(){
  const video=document.getElementById('qrVideo'); const canvas=document.getElementById('qrScanCanvas');
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  video.srcObject=stream; await video.play();
  qrScanning=true;
  const ctx=canvas.getContext('2d');
  function tick(){
    if(!qrScanning) return;
    if(video.readyState===video.HAVE_ENOUGH_DATA){
      canvas.width=video.videoWidth; canvas.height=video.videoHeight;
      ctx.drawImage(video,0,0,canvas.width,canvas.height);
      const img=ctx.getImageData(0,0,canvas.width,canvas.height);
      const code=jsQR(img.data,img.width,img.height);
      if(code){ document.getElementById('qrScanResult').innerHTML=`Found: <b>${code.data}</b>`; qrScanning=false; stream.getTracks().forEach(t=>t.stop()); return; }
    }
    requestAnimationFrame(tick);
  }
  tick();
}
</script>

      <input type="text" id="pwCheck" placeholder="Type a password to test" oninput="pwCheckStrength()"></div>
  </div>`;
};
function pwGen(){
  const len=parseInt(document.getElementById('pwLen').value);
  let chars='';
  if(document.getElementById('pwUpper').checked) chars+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if(document.getElementById('pwLower').checked) chars+='abcdefghijklmnopqrstuvwxyz';
  if(document.getElementById('pwNum').checked) chars+='0123456789';
  if(document.getElementById('pwSym').checked) chars+='!@#$%^&*()_+-=[]{}|;:,.<>?';
  if(!chars) return toast('Pick at least one character set');
  let pw=''; const arr=new Uint32Array(len); crypto.getRandomValues(arr);
  for(let i=0;i<len;i++) pw+=chars[arr[i]%chars.length];
  document.getElementById('pwOut').textContent=pw;
  document.getElementById('pwStrength').textContent = pwEntropy(pw,chars.length);
}
function pwEntropy(pw,poolSize){
  const bits=Math.log2(Math.pow(poolSize||26, pw.length));
  const label = bits<28?'Weak':bits<50?'Fair':bits<70?'Strong':'Very strong';
  return `Entropy ≈ ${bits.toFixed(0)} bits — ${label}`;
}
function pwCheckStrength(){
  const pw=document.getElementById('pwCheck').value;
  let pool=0; if(/[a-z]/.test(pw)) pool+=26; if(/[A-Z]/.test(pw)) pool+=26; if(/[0-9]/.test(pw)) pool+=10; if(/[^a-zA-Z0-9]/.test(pw)) pool+=32;
  document.getElementById('pwStrength').textContent = pw? pwEntropy(pw,pool) : '';
}
</script>

<script>
RENDER.decibel = function(){
  const body=document.getElementById('toolBody');
  body.innerHTML=`<div class="panel" style="text-align:center;">
    <div class="note">Uncalibrated — gives a relative loudness reading from your microphone, not a true SPL measurement.</div>
    <button class="btn" style="margin-top:10px;" onclick="dbStart()">Start Listening</button>
    <div class="big-result" id="dbReading" style="margin-top:16px;">-- dB</div>
    <canvas id="dbCanvas" width="700" height="100" style="margin-top:10px;width:100%;"></canvas>
  </div>`;
};
async function dbStart(){
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const src=ctx.createMediaStreamSource(stream);
  const analyser=ctx.createAnalyser(); analyser.fftSize=2048;
  src.connect(analyser);
  const data=new Uint8Array(analyser.fftSize);
  const cv=document.getElementById('dbCanvas'), cctx=cv.getContext('2d');
  let history=[];
  function loop(){
    analyser.getByteTimeDomainData(data);
    let sum=0; for(let i=0;i<data.length;i++){ const v=(data[i]-128)/128; sum+=v*v; }
    const rms=Math.sqrt(sum/data.length);
    const db=Math.round(20*Math.log10(rms||0.0001)+90);
    document.getElementById('dbReading').textContent=Math.max(0,db)+' dB (relative)';
    history.push(Math.max(0,db)); if(history.length>140) history.shift();
    cctx.fillStyle='#0c0e11'; cctx.fillRect(0,0,700,100);
    cctx.strokeStyle='#45d6c4'; cctx.beginPath();
    history.forEach((v,i)=>{ const x=i/139*700, y=100-Math.min(100,v); i===0?cctx.moveTo(x,y):cctx.lineTo(x,y); });
    cctx.stroke();
    requestAnimationFrame(loop);
  }
  loop();
}
</script>

<script>
RENDER.colors = function(){
  const body=document.getElementById('toolBody');
  body.innerHTML=`<div class="panel">
    <div class="row">
      <input type="color" id="colBase" value="#ff9640" oninput="colRender()">
      <button class="btn ghost" id="colPickBtn" onclick="colEyedrop()">🎯 Pick from screen</button>
    </div>

  </div>`;
  colRender();
};
function hexToHsl(hex){
  let r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b); let h,s,l=(max+min)/2;
  if(max===min){h=s=0;} else{ const d=max-min; s=l>0.5?d/(2-max-min):d/(max+min);
    switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break;} h/=6; }
  return [h*360,s*100,l*100];
}
function hslToHex(h,s,l){
  s/=100; l/=100;
  const k=n=>(n+h/30)%12; const a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  const toHex=x=>Math.round(255*x).toString(16).padStart(2,'0');
  return '#'+toHex(f(0))+toHex(f(8))+toHex(f(4));
}
function colRender(){
  const hex=document.getElementById('colBase').value;
  const [h,s,l]=hexToHsl(hex);
  let shades='', tints='';
  for(let i=1;i<=5;i++) shades+=`<div style="flex:1;height:50px;background:${hslToHex(h,s,Math.max(0,l-i*12))};"></div>`;
  for(let i=1;i<=5;i++) tints+=`<div style="flex:1;height:50px;background:${hslToHex(h,s,Math.min(100,l+i*10))};"></div>`;
  const comp=hslToHex((h+180)%360,s,l);
  const triad1=hslToHex((h+120)%360,s,l), triad2=hslToHex((h+240)%360,s,l);
  document.getElementById('colOut').innerHTML=`
    <div style="height:80px;background:${hex};border-radius:8px;margin-bottom:10px;"></div>
    <div class="mono">${hex} · hsl(${h.toFixed(0)},${s.toFixed(0)}%,${l.toFixed(0)}%)</div>
    <h3 style="margin-top:16px;">Shades</h3><div style="display:flex;gap:4px;">${shades}</div>
    <h3 style="margin-top:16px;">Tints</h3><div style="display:flex;gap:4px;">${tints}</div>
    <h3 style="margin-top:16px;">Complementary / Triad</h3>
    <div style="display:flex;gap:4px;"><div style="flex:1;height:50px;background:${comp};"></div><div style="flex:1;height:50px;background:${triad1};"></div><div style="flex:1;height:50px;background:${triad2};"></div></div>`;
}
async function colEyedrop(){
  if(!window.EyeDropper) return toast('Eyedropper not supported in this browser');
  try{ const ed=new EyeDropper(); const res=await ed.open(); document.getElementById('colBase').value=res.sRGBHex; colRender(); }catch(e){}
}
</script>

function swToggle(){
  const btn=document.getElementById('swBtn');
  if(!swRunning){ swRunning=true; btn.textContent='Pause'; const t0=Date.now()-swMs;
    swInterval=setInterval(()=>{ swMs=Date.now()-t0; swRenderSw(); },30);
  } else { swRunning=false; btn.textContent='Resume'; clearInterval(swInterval); }
}
function swRenderSw(){
  const m=Math.floor(swMs/60000), s=Math.floor((swMs%60000)/1000), cs=Math.floor((swMs%1000)/10);
  document.getElementById('swDisplay').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
}
function swLap(){ swLaps.push(swMs); document.getElementById('swLaps').innerHTML=swLaps.map((l,i)=>`Lap ${i+1}: ${(l/1000).toFixed(2)}s`).join('<br>'); }
function swReset(){ clearInterval(swInterval); swMs=0; swRunning=false; swLaps=[]; document.getElementById('swBtn').textContent='Start'; swRenderSw(); document.getElementById('swLaps').innerHTML=''; }
let cdInterval=null, cdSecs=300, cdRunning=false;
function cdReset(){ clearInterval(cdInterval); cdRunning=false; cdSecs=(parseInt(document.getElementById('cdMin').value)||5)*60; cdRender(); document.getElementById('cdBtn').textContent='Start'; }
function cdRender(){ const m=Math.floor(cdSecs/60), s=cdSecs%60; document.getElementById('cdDisplay').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }
function cdToggle(){
  const btn=document.getElementById('cdBtn');
  if(!cdRunning){ cdRunning=true; btn.textContent='Pause';
    cdInterval=setInterval(()=>{ cdSecs--; if(cdSecs<=0){ clearInterval(cdInterval); toast('Time!'); cdRunning=false; btn.textContent='Start'; } cdRender(); },1000);
  } else { cdRunning=false; btn.textContent='Resume'; clearInterval(cdInterval); }
}
</script>

<script>

  const body=document.getElementById('toolBody');

      <button class="btn ghost" onclick="mcRefresh()">Refresh Lens List</button>

let mcStream=null, mcTrack=null;
async function mcRefresh(){
  try{
    const tmp=await navigator.mediaDevices.getUserMedia({video:true});
    tmp.getTracks().forEach(t=>t.stop());
    const devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
    const sel=document.getElementById('mcDevice');
    sel.innerHTML=devices.map(d=>`<option value="${d.deviceId}">${d.label||'Camera'}</option>`).join('');
    sel.onchange=mcStart; mcStart();
  }catch(err){ toast('Camera permission needed: '+err.message); }
}
async function mcStart(){
  if(mcStream) mcStream.getTracks().forEach(t=>t.stop());
  const deviceId=document.getElementById('mcDevice').value;
  mcStream=await navigator.mediaDevices.getUserMedia({video:{deviceId:deviceId?{exact:deviceId}:undefined}});
  document.getElementById('mcVideo').srcObject=mcStream;
  mcTrack=mcStream.getVideoTracks()[0];
  const caps=mcTrack.getCapabilities?mcTrack.getCapabilities():{};
  const zoomEl=document.getElementById('mcZoom');
  if(caps.zoom){ zoomEl.min=caps.zoom.min; zoomEl.max=caps.zoom.max; zoomEl.step=caps.zoom.step||0.1; zoomEl.value=caps.zoom.min; }
}
async function mcApplyZoom(){
  const v=parseFloat(document.getElementById('mcZoom').value);
  if(mcTrack && mcTrack.getCapabilities && mcTrack.getCapabilities().zoom){
    try{ await mcTrack.applyConstraints({advanced:[{zoom:v}]}); return; }catch(e){}
  }
  document.getElementById('mcVideo').style.transform=`scale(${v})`;
}
function mcCapture(){
  const video=document.getElementById('mcVideo'), cv=document.getElementById('mcCanvas');
  cv.width=video.videoWidth; cv.height=video.videoHeight;
  cv.getContext('2d').drawImage(video,0,0);
  cv.toBlob(blob=>{
    const url=URL.createObjectURL(blob);
    document.getElementById('mcOut').innerHTML=`<img src="${url}" style="max-width:100%;border-radius:8px;"><br><button class="btn ghost" style="margin-top:6px;" onclick="download('photo.jpg', window._mcBlob)">Download</button>`;

async function lpStart(){
  try{
    lpStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});

    lpTrack=lpStream.getVideoTracks()[0];

function lpApplyZoom(){
  const v=document.getElementById('lpZoom').value;
  if(lpTrack && lpTrack.getCapabilities && lpTrack.getCapabilities().zoom){
    lpTrack.applyConstraints({advanced:[{zoom:parseFloat(v)}]}).catch(()=>{});

async function lpToggleTorch(){

function lpToggleFreeze(){

<!-- ===================== TOOL 37: ALTIMETER ===================== -->
<script>
RENDER.altimeter = function(){
  const body=document.getElementById('toolBody');
  body.innerHTML=`<div class="panel">
    <div class="note">Uses your phone's GPS-and-barometer-fused altitude via the standard location service (Safari doesn't expose the barometer directly).</div>
    <button class="btn" style="margin-top:10px;" id="altBtn" onclick="altToggle()">Start</button>
    <button class="btn ghost" onclick="altSetBase()">Set current as baseline (0 m)</button>
    <div class="big-result" id="altReading" style="margin-top:14px;">-- m</div>
    <div class="result" id="altRelative" style="margin-top:8px;">Relative: -- m</div>
    <canvas id="altChart" width="700" height="150" style="margin-top:10px;width:100%;"></canvas>
  </div>`;
  window._altHistory=[]; window._altBase=null;
};
let altWatchId=null;
function altToggle(){
  const btn=document.getElementById('altBtn');
  if(altWatchId===null){
    altWatchId=navigator.geolocation.watchPosition(altUpdate, err=>toast(err.message), {enableHighAccuracy:true});
    btn.textContent='Stop';
  } else { navigator.geolocation.clearWatch(altWatchId); altWatchId=null; btn.textContent='Start'; }
}
function altSetBase(){ window._altBase = window._altLast; toast('Baseline set'); }
function altUpdate(pos){
  const alt=pos.coords.altitude;
  if(alt===null){ document.getElementById('altReading').textContent='Not available on this device'; return; }
  window._altLast=alt;
  document.getElementById('altReading').textContent=alt.toFixed(1)+' m';
  if(window._altBase!==null) document.getElementById('altRelative').textContent=`Relative: ${(alt-window._altBase).toFixed(1)} m`;
  window._altHistory.push(alt); if(window._altHistory.length>200) window._altHistory.shift();
  const cv=document.getElementById('altChart'), ctx=cv.getContext('2d');
  ctx.fillStyle='#0c0e11'; ctx.fillRect(0,0,700,150);
  const h=window._altHistory, min=Math.min(...h), max=Math.max(...h)||1;
  ctx.strokeStyle='#ff9640'; ctx.beginPath();
  h.forEach((v,i)=>{ const x=i/(h.length-1||1)*700, y=150-((v-min)/(max-min||1))*140-5; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.stroke();
}
</script>

<script>

  const body=document.getElementById('toolBody');

    <div class="note">A simulated background-blur effect using a soft-edged spotlight mask — not true LiDAR depth data, but a quick creative look.</div>
    <video id="pbVideo" autoplay playsinline muted style="display:none;"></video>
    <canvas id="pbCanvas" width="640" height="480" style="width:100%;max-width:500px;margin-top:10px;"></canvas>

      <div class="col"><label>Blur strength</label><input type="range" id="pbBlur" min="0" max="20" value="10"></div>

      <button class="btn" onclick="pbCapture()">📸 Capture</button>
    </div>
    <div id="pbOut" style="margin-top:10px;"></div>
  </div>`;
  pbStart();
};
let pbStream=null, pbLoopId=null;
async function pbStart(){
  pbStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
  const video=document.getElementById('pbVideo'); video.srcObject=pbStream;
  const cv=document.getElementById('pbCanvas'), ctx=cv.getContext('2d');

    const blur=document.getElementById('pbBlur').value, radius=document.getElementById('pbRadius').value;

    ctx.filter='none';

    ctx.beginPath(); ctx.arc(cv.width/2,cv.height/2,radius,0,Math.PI*2); ctx.clip();
    ctx.drawImage(video,0,0,cv.width,cv.height);
    ctx.restore();
    pbLoopId=requestAnimationFrame(loop);
  }
  loop();
}

    <div class="note">Estimates exposure from the live camera image — a creative reference, not a calibrated incident light meter.</div>
    <video id="lmVideo" autoplay playsinline muted style="display:none;"></video>
    <canvas id="lmCanvas" width="200" height="150" style="display:none;"></canvas>
    <div class="big-result" id="lmEv" style="margin-top:10px;">EV --</div>
    <table style="margin-top:10px;" id="lmTable"></table>
  </div>`;
  lmStart();
};
async function lmStart(){
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  const video=document.getElementById('lmVideo'); video.srcObject=stream;
  const cv=document.getElementById('lmCanvas'), ctx=cv.getContext('2d');
  function loop(){
    ctx.drawImage(video,0,0,200,150);
    const d=ctx.getImageData(0,0,200,150).data;
    let sum=0; for(let i=0;i<d.length;i+=4) sum += 0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
    const avg=sum/(d.length/4); // 0-255
    const lux = Math.pow(avg/255, 2)*10000+1; // rough mapping
    const ev = Math.log2(lux/2.5);
    document.getElementById('lmEv').textContent=`EV ${ev.toFixed(1)} (approx.)`;
    const combos=[[ '1/1000','f/2.8'],['1/500','f/4'],['1/250','f/5.6'],['1/125','f/8'],['1/60','f/11']];
    document.getElementById('lmTable').innerHTML='<tr><th>Shutter</th><th>Aperture</th></tr>'+combos.map(([s,a])=>`<tr><td>${s}</td><td>${a}</td></tr>`).join('');
    requestAnimationFrame(loop);
  }
  loop();
}
</script>
