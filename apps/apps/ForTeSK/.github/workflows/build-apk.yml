name: Build ForTe WebSwissKnife APK

# Runs automatically on every push to main, and can also be triggered manually
# from the Actions tab in GitHub ("Run workflow").
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node dependencies
        run: npm install

      - name: Sync Capacitor (copies www/ into the Android project)
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      # ---------- DEBUG BUILD (always runs, installable without signing) ----------
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ForTe-WebSwissKnife-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ---------- RELEASE BUILD (signed) ----------
      # Only runs when you push a tag like "v1.0" AND you've added the four
      # signing secrets below in GitHub → Settings → Secrets and variables → Actions.
      # See README.md → "Signing a release build" for how to create the keystore.
      - name: Decode signing keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "KEYSTORE_PRESENT=true" >> $GITHUB_ENV
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret set — skipping signed release build."
            echo "KEYSTORE_PRESENT=false" >> $GITHUB_ENV
          fi

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_PRESENT == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Upload release APK
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_PRESENT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ForTe-WebSwissKnife-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_PRESENT == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
