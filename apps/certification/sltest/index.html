<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Barlow', sans-serif;
    background: var(--navy);
    color: var(--white);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 79px, rgba(255,255,255,0.012) 80px),
      repeating-linear-gradient(90deg, transparent, transparent 79px, rgba(255,255,255,0.012) 80px);
  }

  #app-root { position: relative; z-index: 1; }

  /* ---- FONTS ---- */
  .font-display { font-family: 'Playfair Display', serif; }
  .font-cond { font-family: 'Barlow Condensed', sans-serif; }

  /* ---- SCROLLBAR ---- */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--navy); }
  ::-webkit-scrollbar-thumb { background: var(--blue); border-radius: 3px; }

  /* ---- CERTIFICATE SPECIFIC ---- */
  .cert-border-outer {
    border: 12px double #1a3a6e;
  }
  .cert-border-inner {
    border: 3px solid rgba(200,169,58,0.4);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .animate-fadeup { animation: fadeUp 0.5s ease both; }
  .animate-spin   { animation: spin 1s linear infinite; }

  .clip-arrow {
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  }

  /* Progress bar */
  .progress-track { background: rgba(255,255,255,0.1); border-radius: 2px; height: 4px; }
  .progress-fill  { background: linear-gradient(90deg, var(--blue-mid), var(--gold)); height: 4px; border-radius: 2px; transition: width 0.5s ease; }

  /* Week card hover */
  .week-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.07);
    transition: all 0.3s ease;
    cursor: pointer;
  }
  .week-card:hover {
    background: rgba(26,75,140,0.25);
    border-color: rgba(37,99,184,0.5);
    transform: translateY(-4px);
    box-shadow: 0 16px 40px rgba(0,0,0,0.4);
  }

  .answer-opt {
    background: rgba(255,255,255,0.04);
    border: 1.5px solid rgba(255,255,255,0.1);
    transition: all 0.2s ease;
    cursor: pointer;
  }
  .answer-opt:hover  { border-color: rgba(37,99,184,0.6); background: rgba(26,75,140,0.2); }
  .answer-opt.sel    { border-color: var(--gold); background: rgba(200,169,58,0.12); }

  /* @print */
  @media print {
    .no-print { display: none !important; }
    body { background: white !important; }
    body::before { display: none; }
    #certificate-content { box-shadow: none !important; }
  }

const S = {
  view: 'LOGIN',
  user: null,
  currentWeek: null,
  questions: [],
  qIndex: 0,
  answers: [],
  result: null,
  pdfLoading: false,
  tempLang: 'ENGLISH'
};

// ============================================================
// HELPERS
// ============================================================
function isEn(){ return S.user ? S.user.language === 'ENGLISH' : S.tempLang === 'ENGLISH'; }
function t(en, fr){ return isEn() ? en : fr; }
function pad(n){ return n.toString().padStart(2,'0'); }
function letterOf(i){ return ['A','B','C','D'][i] || String.fromCharCode(65+i); }

function getQuestions(weekId){
  const bank = isEn() ? QUESTION_BANK : (QUESTION_BANK_FR[weekId] ? QUESTION_BANK_FR : QUESTION_BANK);
  return (bank[weekId] || QUESTION_BANK[weekId] || []);
}

// ============================================================
// ACTIONS
// ============================================================
function handleLogin(e){
  e.preventDefault();
  const name = document.getElementById('input-name')?.value.trim();
  if(!name) return;
  S.user = { fullName: name, language: S.tempLang };
  S.view = 'DASHBOARD';
  render();
}

function setLang(lang){
  S.tempLang = lang;
  render();
}

async function startQuiz(weekId){
  S.currentWeek = COURSE_WEEKS.find(w => w.id === weekId);
  S.view = 'LOADING';
  render();
  await new Promise(r => setTimeout(r, 500));
  S.questions = getQuestions(weekId);
  if(!S.questions.length){
    alert(t('Questions coming soon!','Questions bientôt disponibles!'));
    S.view = 'DASHBOARD'; render(); return;
  }
  S.qIndex = 0;
  S.answers = [];
  S.result = null;
  S.view = 'QUIZ';
  render();
}

function answer(idx){
  S.answers[S.qIndex] = idx;
  render();
}

function next(){
  if(S.qIndex < S.questions.length - 1){ S.qIndex++; render(); }
  else finish();
}

function prev(){
  if(S.qIndex > 0){ S.qIndex--; render(); }
}

function finish(){
  let score = 0;
  S.questions.forEach((q,i) => { if(S.answers[i] === q.correctAnswer) score++; });
  S.result = {
    score, total: S.questions.length,
    passed: (score / S.questions.length) >= 0.8,
    date: new Date().toLocaleDateString('en-GB', {day:'2-digit',month:'long',year:'numeric'})
  };
  S.view = 'RESULT'; render();
}

async function downloadPDF(){
  const el = document.getElementById('cert-content');
  if(!el) return;
  S.pdfLoading = true; render();
  try {
    const canvas = await html2canvas(el, { scale: 2.5, useCORS: true, backgroundColor:'#ffffff', logging: false });
    const imgData = canvas.toDataURL('image/png');
    const {jsPDF} = window.jspdf;
    const pdf = new jsPDF({orientation:'landscape', unit:'mm', format:'a4'});
    const pw = pdf.internal.pageSize.getWidth();
    const ph = pdf.internal.pageSize.getHeight();
    pdf.addImage(imgData,'PNG',0,0,pw,ph);
    const safeName = (S.user?.fullName||'Student').replace(/\s+/g,'-');
    pdf.save(`Team21-SL-Certificate-${safeName}-Week${S.currentWeek.id}.pdf`);
  } catch(err){
    alert(t('PDF generation failed. Try printing instead.','Échec de génération du PDF. Essayez d\'imprimer.'));
  } finally {
    S.pdfLoading = false; render();
  }
}

function toDashboard(){
  S.view = 'DASHBOARD'; S.currentWeek = null; S.result = null; render();
}

function logout(){
  S.user = null; S.view = 'LOGIN'; render();
}

          ${passed ? `<button onclick="S.view='CERTIFICATE';render()" class="clip-arrow" style="width:100%;background:linear-gradient(135deg,#0d5c2e,#157a3e);color:#f0c94a;padding:1rem;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1rem;letter-spacing:2px;text-transform:uppercase;border:none;cursor:pointer;">🎓 ${t('View & Download Certificate','Voir & Télécharger le Certificat')}</button>` : ''}
          <button onclick="startQuiz(${week.id})" style="width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.7);padding:1rem;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.9rem;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;">${t('Retake Exam','Reprendre l\'Examen')}</button>
          <button onclick="toDashboard()" style="width:100%;background:transparent;border:none;color:rgba(255,255,255,0.35);padding:0.8rem;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:0.85rem;letter-spacing:1px;text-transform:uppercase;cursor:pointer;">${t('← Back to Dashboard','← Retour au Tableau de Bord')}</button>
        </div>
      </div>`;
    return;
  }

  // ===== CERTIFICATE =====
  if(S.view === 'CERTIFICATE'){
    const week = S.currentWeek;
    const lang = S.user.language;
    const title = lang === 'ENGLISH' ? week.titleEn : week.titleFr;
    const desc  = lang === 'ENGLISH' ? week.descEn : week.descFr;
    const {score, total, date} = S.result;
    const pct = Math.round((score/total)*100);

    const certLabel = lang === 'ENGLISH' ? 'Certificate of Achievement' : 'Certificat de Réussite';
    const certSub   = lang === 'ENGLISH' ? 'This is to certify that' : 'Ceci certifie que';
    const certMid   = lang === 'ENGLISH' ? 'has successfully completed the examination for' : 'a réussi avec succès l\'examen pour';
    const certChap  = lang === 'ENGLISH' ? `Chapter ${week.id}` : `Chapitre ${week.id}`;
    const certConc  = lang === 'ENGLISH' ? 'Concepts Mastered' : 'Concepts Maîtrisés';
    const certScore = lang === 'ENGLISH' ? `Examination Score: ${pct}% (${score}/${total})` : `Score d'examen: ${pct}% (${score}/${total})`;
    const certDate  = lang === 'ENGLISH' ? 'Date of Completion' : 'Date d\'Achèvement';
    const certSign  = lang === 'ENGLISH' ? 'Program Manager, Team21 Academy' : 'Directeur de Programme, Team21 Academy';

    root.innerHTML = `
      <div style="min-height:100vh;background:#e8ecf0;padding:2rem;display:flex;flex-direction:column;align-items:center;">

        <!-- Controls -->
        <div class="no-print" style="margin-bottom:1.5rem;display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;">
          <button onclick="downloadPDF()" ${S.pdfLoading?'disabled':''} style="display:flex;align-items:center;gap:0.6rem;background:linear-gradient(135deg,#1a4b8c,#2563b8);color:#f0c94a;padding:0.8rem 2rem;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:0.9rem;letter-spacing:1.5px;text-transform:uppercase;border:none;cursor:${S.pdfLoading?'wait':'pointer'};transition:all 0.3s;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));">
            ${S.pdfLoading ? '<span style="display:inline-block;width:16px;height:16px;border:2px solid rgba(240,201,74,0.3);border-top-color:#f0c94a;border-radius:50%;animation:spin 1s linear infinite;"></span>' : '⬇'} ${t('Download PDF Certificate','Télécharger le Certificat PDF')}
          </button>
          <button onclick="window.print()" style="display:flex;align-items:center;gap:0.6rem;background:#1e3d3d;color:white;padding:0.8rem 2rem;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.9rem;letter-spacing:1.5px;text-transform:uppercase;border:none;cursor:pointer;">
            🖨 ${t('Print','Imprimer')}
          </button>
          <button onclick="S.view='RESULT';render()" style="background:transparent;border:1px solid rgba(0,0,0,0.15);color:#555;padding:0.8rem 2rem;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:0.85rem;letter-spacing:1px;text-transform:uppercase;cursor:pointer;">
            ← ${t('Back','Retour')}
          </button>
        </div>

        <!-- CERTIFICATE -->
        <div id="cert-content" style="width:297mm;max-width:100%;background:white;padding:14mm;position:relative;overflow:hidden;box-shadow:0 20px 80px rgba(0,0,0,0.2);">

          <!-- Outer decorative border -->
          <div style="position:absolute;inset:6mm;border:2px solid #1a3a6e;pointer-events:none;"></div>
          <div style="position:absolute;inset:9mm;border:1px solid rgba(200,169,58,0.5);pointer-events:none;"></div>

          <!-- Corner ornaments -->
          <div style="position:absolute;top:4mm;left:4mm;width:16mm;height:16mm;border-top:3px solid #c8a93a;border-left:3px solid #c8a93a;"></div>
          <div style="position:absolute;top:4mm;right:4mm;width:16mm;height:16mm;border-top:3px solid #c8a93a;border-right:3px solid #c8a93a;"></div>
          <div style="position:absolute;bottom:4mm;left:4mm;width:16mm;height:16mm;border-bottom:3px solid #c8a93a;border-left:3px solid #c8a93a;"></div>
          <div style="position:absolute;bottom:4mm;right:4mm;width:16mm;height:16mm;border-bottom:3px solid #c8a93a;border-right:3px solid #c8a93a;"></div>

          <!-- Background watermark -->
          <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0.025;">
            <div style="font-family:'Playfair Display',serif;font-size:140px;font-weight:700;color:#1a3a6e;transform:rotate(-30deg);white-space:nowrap;">TEAM21</div>
          </div>

          <!-- CONTENT -->
          <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;min-height:180mm;padding:4mm 8mm;">

            <!-- Logo row -->
            <div style="display:flex;align-items:center;gap:1.5rem;margin-bottom:6mm;">
              <div style="width:18mm;height:18mm;background:linear-gradient(135deg,#1a4b8c,#0d5c2e);display:flex;align-items:center;justify-content:center;clip-path:polygon(0 0,calc(100% - 4mm) 0,100% 4mm,100% 100%,4mm 100%,0 calc(100% - 4mm));">
                <span style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.4rem;color:#c8a93a;letter-spacing:-1px;">T21</span>
              </div>
              <div>
                <div style="font-family:'Playfair Display',serif;font-weight:700;font-size:1.1rem;color:#0a1628;line-height:1;">Team21 Academy</div>
                <div style="font-family:'Barlow Condensed',sans-serif;font-size:0.55rem;letter-spacing:2.5px;text-transform:uppercase;color:#5a7a7a;margin-top:2px;">Servant Leadership Programme</div>
              </div>
            </div>

            <!-- Title -->
            <div style="text-align:center;margin-bottom:4mm;">
              <div style="display:inline-flex;align-items:center;gap:1rem;margin-bottom:3mm;">
                <div style="height:1px;width:40px;background:linear-gradient(90deg,transparent,#c8a93a);"></div>
                <span style="font-family:'Barlow Condensed',sans-serif;font-size:0.6rem;letter-spacing:3px;text-transform:uppercase;color:#c8a93a;">Official Recognition</span>
                <div style="height:1px;width:40px;background:linear-gradient(90deg,#c8a93a,transparent);"></div>
              </div>
              <h1 style="font-family:'Playfair Display',serif;font-weight:700;font-size:2.6rem;color:#0a1628;letter-spacing:2px;text-transform:uppercase;line-height:1;">${certLabel}</h1>
            </div>

            <!-- Divider -->
            <div style="width:80%;height:2px;background:linear-gradient(90deg,transparent,#c8a93a 20%,#c8a93a 80%,transparent);margin-bottom:4mm;"></div>

            <!-- Presenter -->
            <p style="font-family:'Playfair Display',serif;font-style:italic;font-size:1rem;color:#5a7a7a;margin-bottom:3mm;">${certSub}</p>

            <!-- Name -->
            <div style="text-align:center;margin-bottom:3mm;padding:2mm 16mm;">
              <h2 style="font-family:'Playfair Display',serif;font-weight:700;font-size:2.4rem;color:#0a1628;border-bottom:2px solid #c8a93a;padding-bottom:2mm;letter-spacing:1px;">${S.user?.fullName || ''}</h2>
            </div>

            <!-- Achievement text -->
            <p style="font-family:'Barlow',sans-serif;font-size:0.9rem;color:#3a5a5a;text-align:center;margin-bottom:2mm;line-height:1.6;">
              ${certMid}
            </p>
            <div style="text-align:center;margin-bottom:4mm;">
              <span style="font-family:'Barlow Condensed',sans-serif;font-size:0.65rem;letter-spacing:2px;text-transform:uppercase;color:#1a4b8c;">${certChap} —</span>
              <span style="font-family:'Playfair Display',serif;font-weight:700;font-size:1.3rem;color:#1a4b8c;margin-left:0.5rem;">${title}</span>
            </div>

            <!-- Concepts & Score box -->
            <div style="background:#f5f8fa;border:1px solid #d0dce0;padding:3mm 6mm;margin-bottom:5mm;max-width:80%;width:100%;text-align:center;">
              <div style="font-family:'Barlow Condensed',sans-serif;font-size:0.55rem;letter-spacing:2.5px;text-transform:uppercase;color:#5a7a7a;margin-bottom:1.5mm;">${certConc}</div>
              <p style="font-family:'Barlow',sans-serif;font-size:0.82rem;color:#2a4a4a;font-style:italic;margin-bottom:1.5mm;">${desc}</p>
              <div style="font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;font-weight:700;letter-spacing:1.5px;color:#c8a93a;">${certScore}</div>
            </div>

            <!-- Signatures row -->
            <div style="width:100%;display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;padding:0 6mm;">
              <div style="text-align:center;min-width:90px;">
                <div style="border-bottom:1.5px solid #c0c0c0;width:120px;margin:0 auto 2mm;"></div>
                <div style="font-family:'Barlow Condensed',sans-serif;font-size:0.65rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#0a1628;">${date}</div>
                <div style="font-family:'Barlow Condensed',sans-serif;font-size:0.5rem;letter-spacing:1.5px;text-transform:uppercase;color:#8a9a9a;margin-top:1px;">${certDate}</div>
              </div>

              <div style="text-align:center;">
                <div style="font-family:'Playfair Display',serif;font-style:italic;font-size:1.6rem;color:#1a4b8c;line-height:1;margin-bottom:1mm;">Innocent Forteh</div>
                <div style="border-bottom:1.5px solid #c0c0c0;width:200px;margin:0 auto 2mm;"></div>
                <div style="font-family:'Barlow Condensed',sans-serif;font-size:0.65rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#0a1628;">Innocent Forteh, PMP®</div>
                <div style="font-family:'Barlow Condensed',sans-serif;font-size:0.5rem;letter-spacing:1.5px;text-transform:uppercase;color:#8a9a9a;margin-top:1px;">${certSign}</div>
              </div>

              <div style="text-align:center;min-width:90px;">
                <div style="width:60px;height:60px;border:2px solid #1a3a6e;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 2mm;background:linear-gradient(135deg,rgba(26,75,140,0.06),rgba(13,92,46,0.04));">
                  <div style="text-align:center;">
                    <div style="font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;font-weight:900;color:#1a4b8c;line-height:1;">T21</div>
                    <div style="font-family:'Barlow Condensed',sans-serif;font-size:0.35rem;letter-spacing:1px;color:#5a7a7a;text-transform:uppercase;">Academy</div>
                  </div>
                </div>
                <div style="font-family:'Barlow Condensed',sans-serif;font-size:0.5rem;letter-spacing:1px;text-transform:uppercase;color:#8a9a9a;">Official Seal</div>
              </div>
            </div>

            <!-- Footer strip -->
            <div style="margin-top:4mm;width:100%;border-top:1px solid #e0e0e0;padding-top:2mm;display:flex;justify-content:center;">
              <span style="font-family:'Barlow Condensed',sans-serif;font-size:0.5rem;letter-spacing:2px;text-transform:uppercase;color:#b0b8b8;">Team21 Academy · Servant Leadership Programme · https://team21on.blogspot.com · Cameroon & Global</span>
            </div>

          </div>
        </div>

        <div class="no-print" style="margin-top:1.5rem;font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;letter-spacing:1.5px;text-transform:uppercase;color:#888;text-align:center;">${t('Your certificate is ready to download or print','Votre certificat est prêt à être téléchargé ou imprimé')}</div>
      </div>`;
    return;
  }
}

// Boot
render();
</script>
</body>
</html>
