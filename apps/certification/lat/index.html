<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T21 LAT — Team21 Leadership Assessment Tool</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --g50:#EAF3DE;--g100:#C8E09B;--g200:#97C459;--g400:#5A8F1E;--g600:#3B6D11;--g800:#27500A;--g900:#173404;
  --gold50:#FFFBF0;--gold100:#FCDFA0;--gold200:#EF9F27;--gold400:#BA7517;--gold600:#7A4D0A;
  --bg:#F5F9F0;--surface:#FFFFFF;--text:#1C1C18;--muted:#5A604A;--border:#C5DFA0;
  --shadow:0 2px 16px rgba(39,80,10,.10);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* ── HEADER ── */
.hdr{background:linear-gradient(120deg,var(--g900) 0%,var(--g800) 40%,var(--g600) 75%,var(--g400) 100%);
  padding:16px 32px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:300;box-shadow:0 3px 24px rgba(23,52,4,.30);}
.hdr-logo{display:flex;align-items:center;gap:14px;}
.hdr-badge{width:48px;height:48px;border-radius:50%;background:var(--gold200);
  display:flex;align-items:center;justify-content:center;
  font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:var(--g900);flex-shrink:0;}
.hdr-text h1{font-family:'Playfair Display',serif;font-size:17px;color:#fff;font-weight:700;line-height:1.2;}
.hdr-text p{font-size:10.5px;color:rgba(255,255,255,.65);letter-spacing:.4px;margin-top:1px;}
.hdr-right{display:flex;align-items:center;gap:10px;}
.lang-btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;
  padding:7px 16px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:600;transition:.2s;font-family:'DM Sans',sans-serif;}
.lang-btn:hover{background:rgba(255,255,255,.26);}

/* ── NAV ── */
.nav{background:var(--surface);border-bottom:2px solid var(--border);
  display:flex;overflow-x:auto;padding:0 20px;gap:0;scrollbar-width:none;}
.nav::-webkit-scrollbar{display:none;}
.ntab{padding:13px 15px;font-size:12px;font-weight:600;color:var(--muted);
  border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;
  background:none;border-top:none;border-left:none;border-right:none;
  transition:.2s;display:flex;align-items:center;gap:6px;font-family:'DM Sans',sans-serif;}
.ntab.active{color:var(--g600);border-bottom-color:var(--g400);}
.ntab:hover:not(.active){color:var(--g800);}
.ntab .pip{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0;transition:.3s;}
.ntab.done .pip{background:var(--g400);}

/* ── MAIN ── */
.main{max-width:880px;margin:0 auto;padding:30px 20px 90px;}

/* ── HOME ── */
.hero{text-align:center;padding:48px 16px 36px;}
.hero-chip{display:inline-flex;align-items:center;gap:6px;background:var(--g50);
  color:var(--g600);border:1px solid var(--border);border-radius:20px;
  padding:5px 16px;font-size:11px;font-weight:700;letter-spacing:.8px;
  margin-bottom:20px;text-transform:uppercase;}
.hero h2{font-family:'Playfair Display',serif;font-size:40px;color:var(--g900);
  line-height:1.16;margin-bottom:14px;}
.hero-sub{font-size:15px;color:var(--muted);max-width:520px;margin:0 auto 32px;line-height:1.8;}
/* name input */
.name-box{display:flex;gap:10px;max-width:420px;margin:0 auto 32px;flex-wrap:wrap;justify-content:center;}
.name-input{flex:1;min-width:200px;padding:12px 16px;border:1.5px solid var(--border);
  border-radius:10px;font-size:14px;font-family:'DM Sans',sans-serif;color:var(--text);
  background:var(--surface);outline:none;transition:.2s;}
.name-input:focus{border-color:var(--g400);box-shadow:0 0 0 3px rgba(90,143,30,.12);}
.name-save-btn{padding:12px 20px;background:var(--g600);color:#fff;border:none;
  border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:.2s;}
.name-save-btn:hover{background:var(--g800);}
/* test grid */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:14px;}
.tc{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;
  padding:20px 16px;cursor:pointer;transition:.22s;text-align:left;position:relative;overflow:hidden;}
.tc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--g100);}
.tc:hover{border-color:var(--g400);transform:translateY(-4px);box-shadow:0 10px 28px rgba(90,143,30,.14);}
.tc.primary{background:linear-gradient(145deg,var(--g800),var(--g600));border-color:transparent;}
.tc.primary::before{background:var(--gold200);}
.tc.primary h3,.tc.primary .tc-desc,.tc.primary .tc-time{color:#fff;}
.tc.primary .tc-desc{opacity:.82;}.tc.primary .tc-time{opacity:.65;}
.tc.done-card{border-color:var(--g200);}
.tc.done-card::before{background:var(--g400);}
.tc-done-stamp{position:absolute;top:12px;right:12px;background:var(--g400);color:#fff;
  font-size:10px;font-weight:700;padding:3px 9px;border-radius:10px;letter-spacing:.3px;}
.tc-ico{font-size:28px;margin-bottom:12px;}
.tc h3{font-size:13px;font-weight:700;color:var(--g900);margin-bottom:5px;line-height:1.3;}
.tc-desc{font-size:12px;color:var(--muted);line-height:1.55;}
.tc-time{margin-top:12px;font-size:11px;color:var(--g400);font-weight:700;}

/* ── PROGRESS ── */
.prog-wrap{margin-bottom:22px;}
.prog-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:500;}
.prog-track{height:6px;background:var(--g50);border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--g800),var(--g400),var(--g200));border-radius:3px;transition:width .45s ease;}
.step-dots{display:flex;gap:5px;margin-bottom:20px;flex-wrap:wrap;}
.sdot{width:26px;height:5px;border-radius:3px;background:var(--border);transition:.3s;}
.sdot.done{background:var(--g400);}
.sdot.cur{background:var(--g200);}

/* ── QUESTION CARD ── */
.qcard{background:var(--surface);border:1px solid var(--border);border-radius:18px;
  padding:30px;margin-bottom:20px;box-shadow:var(--shadow);}
.qcat{font-size:10px;font-weight:700;color:var(--g400);letter-spacing:1.4px;
  text-transform:uppercase;margin-bottom:9px;}
.qtext{font-size:19px;font-weight:600;color:var(--g900);margin-bottom:8px;line-height:1.38;}
.qex{font-size:13px;color:var(--muted);font-style:italic;line-height:1.6;
  background:var(--g50);padding:10px 14px;border-radius:9px;border-left:3px solid var(--g200);
  margin-bottom:24px;}
.opts{display:grid;gap:10px;}
.opt{background:var(--bg);border:1.5px solid var(--border);border-radius:12px;
  padding:14px 18px;text-align:left;cursor:pointer;font-size:14px;color:var(--text);
  transition:.16s;display:flex;align-items:flex-start;gap:13px;
  font-family:'DM Sans',sans-serif;line-height:1.55;}
.opt:hover{border-color:var(--g200);background:var(--g50);}
.opt.sel{border-color:var(--g400);background:var(--g50);color:var(--g800);font-weight:500;}
.opt .od{width:19px;height:19px;border-radius:50%;border:2px solid var(--border);
  flex-shrink:0;margin-top:1px;transition:.16s;}
.opt.sel .od{background:var(--g400);border-color:var(--g400);}
/* NAV BTNS */
.nav-btns{display:flex;gap:10px;margin-top:22px;}
.btn{padding:12px 28px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;
  border:none;transition:.2s;font-family:'DM Sans',sans-serif;}
.btn-p{background:var(--g600);color:#fff;}.btn-p:hover{background:var(--g900);}
.btn-s{background:var(--surface);color:var(--muted);border:1.5px solid var(--border);}
.btn-s:hover{background:var(--g50);}
.btn:disabled{opacity:.35;cursor:not-allowed;}

/* ── RESULTS ── */
.r-header{background:linear-gradient(130deg,var(--g900) 0%,var(--g800) 45%,var(--g600) 80%,var(--g400) 100%);
  border-radius:18px;padding:32px 28px 26px;margin-bottom:22px;color:#fff;text-align:center;
  position:relative;overflow:hidden;}
.r-header::after{content:'';position:absolute;inset:0;
  background:url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='30' cy='30' r='28' fill='none' stroke='rgba(255,255,255,.04)' stroke-width='2'/%3E%3C/svg%3E") center/60px;
  pointer-events:none;}
.r-header .rh-date{font-size:11px;opacity:.5;margin-bottom:8px;letter-spacing:.6px;text-transform:uppercase;}
.r-header .rh-name{font-family:'Playfair Display',serif;font-size:14px;font-weight:400;
  font-style:italic;opacity:.7;margin-bottom:6px;}
.r-header h2{font-family:'Playfair Display',serif;font-size:28px;margin-bottom:6px;line-height:1.2;}
.r-header .rh-sub{font-size:13px;opacity:.72;margin-bottom:18px;}
.r-badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.r-badge{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);
  border-radius:20px;padding:5px 14px;font-size:12px;font-weight:600;}
.r-badge.gold{background:var(--gold200);border-color:var(--gold200);color:var(--g900);}

/* ── SCORE GRID ── */
.sc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px;margin-bottom:20px;}
.scard{background:var(--surface);border:1px solid var(--border);border-radius:13px;
  padding:16px;text-align:center;box-shadow:var(--shadow);}
.scard .sl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:7px;}
.scard .sv{font-size:22px;font-weight:700;color:var(--g600);}
.scard .sbar{height:4px;background:var(--g50);border-radius:2px;margin-top:8px;overflow:hidden;}
.scard .sfill{height:100%;background:var(--g400);border-radius:2px;}
.scard .sm{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.3;}

/* ── SECTIONS ── */
.sec{background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}
.sec h3{font-size:15px;font-weight:700;color:var(--g800);margin-bottom:16px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.sec-desc{font-size:14px;color:var(--g800);line-height:1.75;background:var(--g50);
  border-radius:10px;padding:14px 16px;margin-bottom:16px;}
/* TRAIT BARS */
.trow{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.tlbl{width:145px;font-size:12px;color:var(--muted);flex-shrink:0;font-weight:500;}
.tbw{flex:1;height:8px;background:var(--g50);border-radius:4px;overflow:hidden;}
.tb{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--g600),var(--g200));}
.tb.gold{background:linear-gradient(90deg,var(--gold400),var(--gold100));}
.tpct{width:36px;font-size:11px;font-weight:700;color:var(--g600);text-align:right;}
/* TAGS */
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;}
.tag{background:var(--g50);border:1px solid var(--border);border-radius:20px;
  padding:4px 13px;font-size:12px;color:var(--g600);font-weight:600;}
.tag.gold-tag{background:var(--gold50);border-color:var(--gold100);color:var(--gold600);}
/* INFO BOXES */
.infobox{background:var(--g50);border:1px solid var(--border);border-radius:10px;
  padding:12px 16px;margin-bottom:16px;font-size:13px;color:var(--g800);line-height:1.65;}
.warnbox{background:#FFF8EC;border:1px solid var(--gold100);border-radius:10px;
  padding:12px 16px;font-size:13px;color:var(--gold600);line-height:1.65;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
@media(max-width:500px){.two-col{grid-template-columns:1fr;}}

/* ── RADAR CHART ── */
.radar-wrap{display:flex;justify-content:center;margin:10px 0 20px;}
.radar-wrap svg{max-width:100%;}

/* ── SPIRITUAL ── */
.spirit{background:linear-gradient(145deg,#FFFEF8,var(--gold50));
  border:1.5px solid var(--gold100);border-radius:16px;padding:26px;margin-bottom:20px;}
.spirit h3{font-family:'Playfair Display',serif;font-size:19px;color:var(--gold600);margin-bottom:14px;}
.spirit blockquote{font-style:italic;color:var(--gold400);font-size:14px;line-height:1.8;
  margin-bottom:14px;border-left:3px solid var(--gold200);padding-left:15px;}
.spirit p{font-size:13.5px;color:var(--muted);line-height:1.78;}
.spirit .italicline{margin-top:16px;font-style:italic;font-weight:700;color:var(--gold400);font-size:14px;}
.sig{margin-top:20px;padding-top:18px;border-top:1px solid var(--gold100);}
.sig p{font-size:13px;color:var(--gold600);margin-bottom:4px;}
.sig strong{font-family:'Playfair Display',serif;font-size:17px;color:var(--gold400);display:block;}
.sig small{font-size:11.5px;color:var(--muted);}

/* ── PRINT BUTTON ── */
.action-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;}
.pbtn{display:inline-flex;align-items:center;gap:8px;background:var(--g600);color:#fff;
  padding:14px 28px;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;
  border:none;font-family:'DM Sans',sans-serif;transition:.2s;box-shadow:0 4px 14px rgba(59,109,17,.25);}
.pbtn:hover{background:var(--g900);transform:translateY(-1px);}
.rbtn{display:inline-flex;align-items:center;gap:8px;background:var(--surface);
  color:var(--g600);padding:14px 24px;border-radius:11px;font-size:14px;font-weight:700;
  cursor:pointer;border:1.5px solid var(--border);font-family:'DM Sans',sans-serif;transition:.2s;}
.rbtn:hover{background:var(--g50);}
.empty{text-align:center;padding:56px 24px;}
.empty .eico{font-size:52px;margin-bottom:18px;}
.empty h3{font-size:19px;color:var(--g800);margin-bottom:8px;}
.empty p{font-size:13px;color:var(--muted);line-height:1.7;}

/* ── PRINT STYLES ── */
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
  .hdr,.nav,.nav-btns,.pbtn,.rbtn,#section-home,#section-personality,
  #section-leadership,#section-emotional,#section-values,
  #section-communication,#section-stress{display:none!important;}
  #section-results{display:block!important;}
  body{background:#fff;font-size:13px;}
  .main{padding:0;max-width:100%;}
  .r-header{page-break-after:avoid;}
  .sec,.spirit,.scard{page-break-inside:avoid;}
  .r-header{background:linear-gradient(130deg,#27500A,#3B6D11,#5A8F1E)!important;}
  .spirit{background:#FFFEF8!important;}
}
</style>
</head>

{cat:'Tension Éthique',q:'Un raccourci économiserait 3 semaines mais nécessite de plier légèrement les règles. Vous...',ex:'💡 Personne ne le saurait — et le délai est genuinement critique.',
opts:[{t:'Refusez — nous faisons les choses correctement, même si ça coûte.',d:{INT:3}},{t:'Pesez soigneusement l\'impact et choisissez le chemin le plus bénéfique.',d:{IMP:3}},{t:'Demandez à l\'équipe — la confiance de la communauté compte plus que la vitesse.',d:{COM:2,INT:1}},{t:'Cherchez une alternative créative qui soit à la fois rapide ET juste.',d:{INN:3}}]},
{cat:'Héritage de Leadership',q:'Si votre équipe écrivait votre hommage de leadership dans 10 ans, vous voulez surtout qu\'il dise...',ex:'💡 Que voulez-vous que les gens retiennent de votre façon de diriger ?',

{cat:'Carburant de Leadership',q:'Qu\'est-ce qui vous enthousiasme vraiment le plus dans le leadership ?',ex:'💡 Qu\'est-ce qui vous fait dire "oui — C\'EST pour ça que je choisis de diriger" ?',

{cat:'Compromis Difficiles',q:'Des coupes budgétaires vous forcent à protéger l\'un des éléments suivants. Vous choisissez...',ex:'💡 Les ressources sont limitées. Quelque chose doit céder. Qu\'est-ce qui est non négociable pour vous ?',

]}
},

communication:{
en:{title:'Communication Style',sub:'How you communicate IS how you lead. Let\'s discover your natural style!',
qs:[
{cat:'Giving Direction',q:'When briefing your team on a new, complex task, you naturally...',ex:'💡 Monday morning — new project brief to your team of 8.',
opts:[{t:'Get to the point fast: here\'s what, who, when — let\'s go.',d:{DIR:3}},{t:'Tell the story first — the "why" and the vision — then the plan.',d:{INS:3}},{t:'Cover every detail: objectives, timelines, risks, success metrics.',d:{ANA:3}},{t:'Open it up — ask the team what they think before sharing your plan.',d:{CON:3}}]},
{cat:'Active Listening',q:'In a team brainstorm, while others share ideas, you...',ex:'💡 The team is generating solutions to a major challenge.',
opts:[{t:'Listen for the bottom line — what\'s the actual recommendation here?',d:{DIR:3}},{t:'Get excited by ideas that open up new possibilities and horizons.',d:{INS:3}},{t:'Take detailed notes, ask probing questions, evaluate evidence.',d:{ANA:3}},{t:'Actively ensure quieter voices get space to contribute.',d:{CON:3}}]},
{cat:'Conflict',q:'When two strong personalities in the team clash, you handle it by...',ex:'💡 Two key team members deeply disagree on the best approach.',
opts:[{t:'Cutting to the core issue fast: here are the facts, let\'s decide.',d:{DIR:3}},{t:'Reframing it as creative tension — it\'s a sign of a passionate team!',d:{INS:3}},{t:'Laying out all the evidence on both sides and finding the logical answer.',d:{ANA:3}},{t:'Slowing down to make sure both people feel fully heard and respected.',d:{CON:3}}]},
{cat:'Written Communication',q:'Your key team messages and updates tend to be...',ex:'💡 Think about your typical emails and team reports.',
opts:[{t:'Short, sharp, and action-focused — just the critical information.',d:{DIR:3}},{t:'Engaging and narrative — I want people to feel something when they read it.',d:{INS:3}},{t:'Comprehensive and structured — I include everything relevant.',d:{ANA:3}},{t:'Warm and inclusive — I acknowledge people and make everyone feel included.',d:{CON:3}}]},
{cat:'Giving Feedback',q:'When giving a team member honest, difficult feedback, you...',ex:'💡 Their performance has been below standard for 3 weeks.',
opts:[{t:'Am direct and clear: here\'s the issue, here\'s what needs to change.',d:{DIR:3}},{t:'Frame it as a growth story: "You\'re capable of so much more."',d:{INS:3}},{t:'Present specific evidence and data: "Here\'s exactly what I observed."',d:{ANA:3}},{t:'Start with genuine appreciation, then gently address the issue.',d:{CON:3}}]}
]},
fr:{title:'Style de Communication',sub:'La façon dont vous communiquez EST la façon dont vous dirigez. Découvrons votre style naturel !',
qs:[
{cat:'Donner des Instructions',q:'Quand vous briefez votre équipe sur une nouvelle tâche complexe, vous...',ex:'💡 Lundi matin — nouveau brief de projet pour votre équipe de 8 personnes.',
opts:[{t:'Allez droit au but : voici quoi, qui, quand — allons-y.',d:{DIR:3}},{t:'Racontez d\'abord l\'histoire — le "pourquoi" et la vision — puis le plan.',d:{INS:3}},{t:'Couvrez chaque détail : objectifs, délais, risques, métriques de succès.',d:{ANA:3}},{t:'L\'ouvrez — demandez ce que l\'équipe pense avant de partager votre plan.',d:{CON:3}}]},
{cat:'Écoute Active',q:'Lors d\'un brainstorming d\'équipe, pendant que les autres partagent des idées, vous...',ex:'💡 L\'équipe génère des solutions à un grand défi.',
opts:[{t:'Écoutez pour l\'essentiel — quelle est la recommandation réelle ici ?',d:{DIR:3}},{t:'Vous enthousiasmez par des idées qui ouvrent de nouvelles possibilités.',d:{INS:3}},{t:'Prenez des notes détaillées, posez des questions pointues, évaluez les preuves.',d:{ANA:3}},{t:'Assurez activement que les voix plus discrètes aient de l\'espace.',d:{CON:3}}]},
{cat:'Conflit',q:'Quand deux personnalités fortes dans l\'équipe s\'affrontent, vous gérez en...',ex:'💡 Deux membres clés sont profondément en désaccord sur la meilleure approche.',
opts:[{t:'Allant rapidement au cœur du problème : voici les faits, décidons.',d:{DIR:3}},{t:'Le recadrant comme une tension créative — c\'est un signe d\'une équipe passionnée !',d:{INS:3}},{t:'Exposant toutes les preuves des deux côtés et trouvant la réponse logique.',d:{ANA:3}},{t:'Ralentissant pour s\'assurer que les deux personnes se sentent pleinement entendues.',d:{CON:3}}]},
{cat:'Communication Écrite',q:'Vos messages et mises à jour clés d\'équipe tendent à être...',ex:'💡 Pensez à vos emails et rapports d\'équipe typiques.',
opts:[{t:'Courts, percutants et axés sur l\'action — juste l\'information critique.',d:{DIR:3}},{t:'Engageants et narratifs — je veux que les gens ressentent quelque chose.',d:{INS:3}},{t:'Complets et structurés — j\'inclus tout ce qui est pertinent.',d:{ANA:3}},{t:'Chaleureux et inclusifs — j\'reconnais les gens et fais sentir chacun inclus.',d:{CON:3}}]},
{cat:'Feedback',q:'Pour donner à un membre un feedback honnête et difficile, vous...',ex:'💡 Leur performance est en dessous des standards depuis 3 semaines.',
opts:[{t:'Êtes direct(e) et clair(e) : voici le problème, voici ce qui doit changer.',d:{DIR:3}},{t:'Cadrez comme une histoire de croissance : "Tu es capable de tellement plus."',d:{INS:3}},{t:'Présentez des preuves et données spécifiques : "Voici exactement ce que j\'ai observé."',d:{ANA:3}},{t:'Commencez par une appréciation sincère, puis abordez doucement le problème.',d:{CON:3}}]}
]}
},

stress:{
en:{title:'Stress Response Profile',sub:'Knowing how you behave under pressure is a leadership superpower. Answer honestly!',
qs:[
{cat:'First Response',q:'When extreme, sustained pressure hits — multiple crises, tight deadlines, team tension — your immediate instinct is to...',ex:'💡 Three urgent fires, a team conflict, and an unexpected board request all land on the same day.',
opts:[{t:'Push harder — intensify my focus and drive forward.',d:{PUSH:3}},{t:'Pump up the team — rally energy and keep spirits high.',d:{RALLY:3}},{t:'Step back, assess, and build a structured response plan.',d:{PLAN:3}},{t:'Check in with the team first and make sure everyone is okay.',d:{CARE:3}}]},
{cat:'Warning Signs',q:'When you\'re approaching your stress limit, others tend to notice...',ex:'💡 What do people around you observe when you\'re nearing your edge?',
opts:[{t:'I become more blunt, impatient, and controlling than usual.',d:{PUSH:3}},{t:'I project excessive optimism that doesn\'t match the reality.',d:{RALLY:3}},{t:'I withdraw into deep analysis and slow down on decisions.',d:{PLAN:3}},{t:'I absorb everyone else\'s stress and forget to manage my own.',d:{CARE:3}}]},
{cat:'Recovery',q:'After an intensely stressful period, you restore yourself best through...',ex:'💡 You\'ve just completed an exhausting 3-week sprint. What restores you?',
opts:[{t:'Completing a meaningful task — crossing things off restores me.',d:{PUSH:3}},{t:'Being around positive, energetic people I enjoy.',d:{RALLY:3}},{t:'Quiet time alone to think, plan, and reset.',d:{PLAN:3}},{t:'Deep, meaningful conversation with someone I trust.',d:{CARE:3}}]},
{cat:'Stress Impact',q:'Under sustained high stress, what suffers most in your leadership?',ex:'💡 Think about your last really difficult professional season.',
opts:[{t:'My relationships — I become distant, cold, or impatient with people.',d:{PUSH:3}},{t:'My realism — I over-promise and underestimate the difficulty.',d:{RALLY:3}},{t:'My decisiveness — I get stuck in analysis and slow everything down.',d:{PLAN:3}},{t:'My own wellbeing — I put everyone else first and neglect myself.',d:{CARE:3}}]},
{cat:'What Helps Most',q:'When you\'re genuinely struggling, what kind of support helps you most?',ex:'💡 You\'re going through a difficult professional season. What do you need?',
opts:[{t:'Clear goals, a sense of momentum, and visible wins.',d:{PUSH:3}},{t:'Encouragement and genuine belief from people I respect.',d:{RALLY:3}},{t:'Space and time to think, plan, and process quietly.',d:{PLAN:3}},{t:'Someone to truly listen — just to be present with me.',d:{CARE:3}}]}
]},
fr:{title:'Profil de Réponse au Stress',sub:'Savoir comment vous vous comportez sous pression est un superpouvoir de leadership. Répondez honnêtement !',
qs:[
{cat:'Première Réponse',q:'Quand une pression extrême et soutenue frappe — crises multiples, délais serrés, tensions d\'équipe — votre instinct immédiat est de...',ex:'💡 Trois urgences, un conflit d\'équipe et une demande inattendue du conseil arrivent le même jour.',
opts:[{t:'Pousser plus fort — intensifier mon focus et avancer.',d:{PUSH:3}},{t:'Galvaniser l\'équipe — rallier l\'énergie et maintenir le moral.',d:{RALLY:3}},{t:'Prendre du recul, évaluer et construire un plan de réponse structuré.',d:{PLAN:3}},{t:'Vérifier d\'abord avec l\'équipe et m\'assurer que tout le monde va bien.',d:{CARE:3}}]},
{cat:'Signes Avant-Coureurs',q:'Quand vous approchez de votre limite de stress, les autres tendent à remarquer...',ex:'💡 Qu\'observent les personnes autour de vous quand vous êtes près de votre limite ?',
opts:[{t:'Je deviens plus brusque, impatient(e) et contrôlant(e) que d\'habitude.',d:{PUSH:3}},{t:'Je projette un optimisme excessif qui ne correspond pas à la réalité.',d:{RALLY:3}},{t:'Je me retire dans une analyse profonde et ralentis sur les décisions.',d:{PLAN:3}},{t:'J\'absorbe le stress de tout le monde et oublie de gérer le mien.',d:{CARE:3}}]},
{cat:'Récupération',q:'Après une période intensément stressante, vous vous restaurez le mieux en...',ex:'💡 Vous venez de terminer un sprint épuisant de 3 semaines. Qu\'est-ce qui vous restaure ?',
opts:[{t:'Accomplir une tâche significative — cocher des choses me restaure.',d:{PUSH:3}},{t:'Être avec des personnes positives et énergiques que j\'apprécie.',d:{RALLY:3}},{t:'Du temps calme seul(e) pour penser, planifier et me réinitialiser.',d:{PLAN:3}},{t:'Une conversation profonde et significative avec quelqu\'un en qui j\'ai confiance.',d:{CARE:3}}]},
{cat:'Impact du Stress',q:'Sous un stress soutenu élevé, qu\'est-ce qui souffre le plus dans votre leadership ?',ex:'💡 Pensez à votre dernière saison professionnelle vraiment difficile.',
opts:[{t:'Mes relations — je deviens distant(e), froid(e) ou impatient(e) avec les gens.',d:{PUSH:3}},{t:'Mon réalisme — je sur-promets et sous-estime la difficulté.',d:{RALLY:3}},{t:'Ma décisivité — je me bloque dans l\'analyse et ralentis tout.',d:{PLAN:3}},{t:'Mon propre bien-être — je mets tout le monde en premier et me néglige.',d:{CARE:3}}]},
{cat:'Ce Qui Aide le Plus',q:'Quand vous luttez vraiment, quel type de soutien vous aide le plus ?',ex:'💡 Vous traversez une saison professionnelle difficile. De quoi avez-vous besoin ?',
opts:[{t:'Des objectifs clairs, un sentiment d\'élan et des victoires visibles.',d:{PUSH:3}},{t:'Encouragement et foi sincère de personnes que je respecte.',d:{RALLY:3}},{t:'De l\'espace et du temps pour penser, planifier et traiter tranquillement.',d:{PLAN:3}},{t:'Quelqu\'un pour vraiment écouter — juste être présent(e) avec moi.',d:{CARE:3}}]}
]}
}
};

function $(id){return document.getElementById(id);}
function p(v,max){return Math.min(100,Math.max(0,Math.round((v/max)*100)));}
function topKey(obj){return Object.entries(obj).sort((a,b)=>b[1]-a[1])[0]?.[0]||'?';}
function getPCode(){const s=scores.personality||{};return [(s.E||0)>=(s.I||0)?'E':'I',(s.S||0)>=(s.N||0)?'S':'N',(s.T||0)>=(s.F||0)?'T':'F',(s.J||0)>=(s.P||0)?'J':'P'].join('');}
function getLS(){const s=scores.leadership||{};return topKey({DE:s.DE||0,MO:s.MO||0,TP:s.TP||0,EX:s.EX||0});}
function getEQ(){const s=scores.emotional||{};return Math.round(((s.SA||0)+(s.EM||0)+(s.ER||0)+(s.SS||0)+(s.MT||0))/15*100);}
function getTV(){const s=scores.values||{};return topKey({INT:s.INT||0,IMP:s.IMP||0,COM:s.COM||0,INN:s.INN||0});}
function getCS(){const s=scores.communication||{};return topKey({DIR:s.DIR||0,INS:s.INS||0,ANA:s.ANA||0,CON:s.CON||0});}
function getSS(){const s=scores.stress||{};return topKey({PUSH:s.PUSH||0,RALLY:s.RALLY||0,PLAN:s.PLAN||0,CARE:s.CARE||0});}

const SECS=['home','personality','leadership','emotional','values','communication','stress','results'];
function showSec(name){
  SECS.forEach(s=>{
    $('section-'+s).style.display=s===name?'block':'none';
    const t=$('tab-'+s);if(t)t.classList.toggle('active',s===name);
  });
  if(name==='home')renderHome();
  if(name==='results')renderResults();
  window.scrollTo({top:0,behavior:'smooth'});
}
function updatePips(){
  Object.keys(completed).forEach(k=>{
    const pip=$('pip-'+k);if(pip)pip.style.background=completed[k]?'var(--g400)':'var(--border)';
    const tab=$('tab-'+k);if(tab)tab.classList.toggle('done',completed[k]);
  });
}
function toggleLang(){
  lang=lang==='en'?'fr':'en';
  $('lang-btn').textContent=lang==='en'?'🇫🇷 Français':'🇬🇧 English';
  $('hdr-tag').textContent=UI[lang].tag;

  if(currentTest)renderTest(currentTest);else{const a=document.querySelector('.ntab.active');showSec(a?a.id.replace('tab-',''):'home');}
}

function startTest(key){
  currentTest=key;currentQ=0;
  currentAnswers=new Array(TESTS[key][lang].qs.length).fill(null);
  scores[key]={};
  showSec(key);renderTest(key);
}
function renderTest(key){
  const data=TESTS[key][lang];
  const q=data.qs[currentQ];
  const total=data.qs.length;
  const pct=Math.round((currentQ/total)*100);
  const isLast=currentQ===total-1;
  const ui=UI[lang];
  const cont=$('section-'+key);
  cont.innerHTML=`
  <div style="margin-bottom:20px;">
    <h2 style="font-family:'Playfair Display',serif;font-size:22px;color:var(--g900);margin-bottom:5px;">${data.title}</h2>
    <p style="font-size:13px;color:var(--muted);">${data.sub}</p>
  </div>
  <div class="prog-wrap">
    <div class="prog-meta"><span style="font-weight:600;">${ui.q} ${currentQ+1} ${ui.of} ${total}</span><span>${pct}% ${lang==='en'?'complete':'complété'}</span></div>
    <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
  </div>
  <div class="step-dots">${data.qs.map((_,i)=>`<div class="sdot${i<currentQ?' done':i===currentQ?' cur':''}"></div>`).join('')}</div>
  <div class="qcard">
    <div class="qcat">${q.cat}</div>
    <div class="qtext">${q.q}</div>
    <div class="qex">${q.ex}</div>
    <div class="opts">
      ${q.opts.map((o,i)=>`<button class="opt${currentAnswers[currentQ]===i?' sel':''}" onclick="selA(${i})">
        <div class="od"></div><span>${o.t}</span>
      </button>`).join('')}
    </div>
  </div>
  <div class="nav-btns">
    <button class="btn btn-s" onclick="prevQ()" ${currentQ===0?'disabled':''}>${ui.prev}</button>
    <button class="btn btn-p" onclick="nextQ()" ${currentAnswers[currentQ]===null?'disabled':''}>${isLast?ui.finish:ui.next}</button>
  </div>`;
}
function selA(i){currentAnswers[currentQ]=i;renderTest(currentTest);}
function prevQ(){if(currentQ>0){currentQ--;renderTest(currentTest);}}
function nextQ(){
  if(currentAnswers[currentQ]===null)return;
  const q=TESTS[currentTest][lang].qs[currentQ];
  const d=q.opts[currentAnswers[currentQ]].d;
  Object.entries(d).forEach(([k,v])=>{scores[currentTest][k]=(scores[currentTest][k]||0)+v;});
  if(currentQ<TESTS[currentTest][lang].qs.length-1){currentQ++;renderTest(currentTest);}
  else{completed[currentTest]=true;updatePips();currentTest=null;showSec('results');}
}

// RADAR CHART
// ═══════════════════════════════════════════════════════════════════
function buildRadar(data,size=280){
  const N=data.length;const cx=size/2,cy=size/2,r=size*0.38,labelR=r+28;
  const angles=data.map((_,i)=>(-Math.PI/2)+(2*Math.PI*i/N));
  function pt(a,val){return[cx+val*r*Math.cos(a),cy+val*r*Math.sin(a)];}
  const rings=[0.25,0.5,0.75,1];
  const ringPaths=rings.map(ring=>{
    const pts=angles.map(a=>pt(a,ring));
    return`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--border)" stroke-width="${ring===1?1.5:1}" opacity="0.6"/>`;
  }).join('');
  const spokes=angles.map(a=>`<line x1="${cx}" y1="${cy}" x2="${pt(a,1)[0]}" y2="${pt(a,1)[1]}" stroke="var(--border)" stroke-width="1" opacity="0.6"/>`).join('');
  const dataPath=data.map((d,i)=>pt(angles[i],d.val)).map((p,i)=>(i?'L':'M')+p[0]+','+p[1]).join(' ')+'Z';
  const dots=data.map((d,i)=>{const[x,y]=pt(angles[i],d.val);return`<circle cx="${x}" cy="${y}" r="4" fill="var(--g600)" stroke="#fff" stroke-width="1.5"/>`;}).join('');
  const labels=data.map((d,i)=>{
    const[x,y]=pt(angles[i],labelR/r);
    const anchor=x<cx-5?'end':x>cx+5?'start':'middle';
    const lines=d.label.split('\n');
    return`<text x="${x}" y="${y-(lines.length-1)*7}" text-anchor="${anchor}" font-size="10" fill="var(--muted)" font-weight="600" font-family="DM Sans,sans-serif">${lines.map((l,j)=>`<tspan x="${x}" dy="${j===0?0:14}">${l}</tspan>`).join('')}</text>`;
  }).join('');
  return`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
  ${ringPaths}${spokes}
  <polygon points="${data.map((_,i)=>pt(angles[i],data[i].val).join(',')).join(' ')}" fill="rgba(59,109,17,0.15)" stroke="var(--g600)" stroke-width="2.5"/>
  ${dots}${labels}
  </svg>`;
}

    <h3>🧠 ${lang==='en'?'Personality Assessment':'Évaluation de la Personnalité'}: <span style="color:var(--g600);font-size:17px;">${ptC}</span> — ${ptI.n}</h3>
    <div class="sec-desc">${ptI.d}</div>
    ${dims[lang].map(pair=>pair.map(d=>`<div class="trow"><div class="tlbl">${d.lbl}</div><div class="tbw"><div class="tb" style="width:${p(sp2[d.k]||0,d.max)}%"></div></div><div class="tpct">${p(sp2[d.k]||0,d.max)}%</div></div>`).join('')).join('')}
    <p style="font-size:13px;font-weight:700;color:var(--g800);margin:14px 0 8px;">${lang==='en'?'Key Strengths':'Forces Clés'}</p>
    <div class="tags">${ptI.s.map(s=>`<span class="tag">${s}</span>`).join('')}</div>
    </div>`;
  }

  // LEADERSHIP
  if(completed.leadership){
    html+=`<div class="sec">
    <h3>🌿 ${lang==='en'?'Leadership Style':'Style de Leadership'}: <span style="color:${lI.col};">${lI.label}</span></h3>
    <div class="sec-desc">${lI.desc}</div>
    ${Object.entries({DE:leds.DE||0,MO:leds.MO||0,TP:leds.TP||0,EX:leds.EX||0}).map(([k,v])=>{
      const lb=LSTYLE[lang][k]||LSTYLE.en[k];
      return`<div class="trow"><div class="tlbl" style="font-size:11px;">${lb.label}</div><div class="tbw"><div class="tb${k===ls?' gold':''}" style="width:${p(v,18)}%"></div></div><div class="tpct">${p(v,18)}%</div></div>`;
    }).join('')}
    <p style="font-size:13px;font-weight:700;color:var(--g800);margin:16px 0 8px;">🎯 ${lang==='en'?'Growth Suggestions':'Suggestions de Croissance'}</p>
    <ul style="padding-left:18px;">${lI.growth.map(g=>`<li style="font-size:13px;color:var(--muted);line-height:1.75;margin-bottom:6px;">${g}</li>`).join('')}</ul>
    </div>`;
  }

  // EQ
  if(completed.emotional){
    const eqLabs=lang==='en'?{SA:'Self-Awareness',EM:'Empathy',ER:'Emotional Regulation',SS:'Social Skills',MT:'Inner Drive & Motivation'}:{SA:'Conscience de Soi',EM:'Empathie',ER:'Régulation Émotionnelle',SS:'Compétences Sociales',MT:'Motivation Intérieure'};
    const eqNote=eq>=85?lang==='en'?'Exceptional emotional leadership intelligence — a rare and powerful gift.':'Intelligence émotionnelle de leadership exceptionnelle — un don rare et puissant.':eq>=70?lang==='en'?'Strong EQ — you are a highly emotionally aware leader.':'QE fort — vous êtes un leader hautement conscient émotionnellement.':eq>=50?lang==='en'?'Solid foundation — consistent EQ practice will compound your effectiveness.':'Base solide — une pratique constante du QE renforcera votre efficacité.':lang==='en'?'Significant growth opportunity — emotional skills are learnable and the returns are extraordinary.':'Opportunité de croissance significative — les compétences émotionnelles s\'apprennent.';
    html+=`<div class="sec">
    <h3>💚 ${lang==='en'?'Emotional Intelligence':'Intelligence Émotionnelle'} — <span style="color:var(--g600);">EQ ${eq}%</span></h3>
    <div class="infobox">${eqNote}</div>
    <div class="sc-grid" style="margin-bottom:0;">
      ${Object.entries({SA:emos.SA||0,EM:emos.EM||0,ER:emos.ER||0,SS:emos.SS||0,MT:emos.MT||0}).map(([k,v])=>`
      <div class="scard"><div class="sl">${eqLabs[k]}</div><div class="sv">${p(v,3)}%</div><div class="sbar"><div class="sfill" style="width:${p(v,3)}%"></div></div></div>`).join('')}
    </div>
    </div>`;
  }

  // VALUES
  if(completed.values){
    const vLab=lang==='en'?{INT:'Integrity',IMP:'Impact',COM:'Community',INN:'Innovation'}:{INT:'Intégrité',IMP:'Impact',COM:'Communauté',INN:'Innovation'};
    const vDesc=lang==='en'?{INT:'You lead with uncompromising ethics — your word is your bond.',IMP:'You lead for results that make a lasting, tangible difference.',COM:'You lead by building deep belonging and united communities.',INN:'You lead by pioneering bold new ideas and approaches.'}:{INT:'Vous dirigez avec une éthique sans compromis.',IMP:'Vous dirigez pour des résultats qui font une différence durable.',COM:'Vous dirigez en construisant une appartenance profonde.',INN:'Vous dirigez en pionnier de nouvelles idées audacieuses.'};
    html+=`<div class="sec">
    <h3>⭐ ${lang==='en'?'Core Values Compass':'Boussole des Valeurs Fondamentales'}</h3>
    ${Object.entries({INT:vals.INT||0,IMP:vals.IMP||0,COM:vals.COM||0,INN:vals.INN||0}).map(([k,v])=>`
    <div class="trow"><div class="tlbl">${vLab[k]}</div><div class="tbw"><div class="tb${k===tv?' gold':''}" style="width:${p(v,9)}%"></div></div><div class="tpct">${p(v,9)}%</div></div>`).join('')}
    <div class="infobox" style="margin-top:14px;">🌟 ${lang==='en'?`Your primary value is <strong>${vLab[tv]}</strong>. ${vDesc[tv]}`:`Votre valeur principale est <strong>${vLab[tv]}</strong>. ${vDesc[tv]}`}</div>
    </div>`;
  }

  // COMMUNICATION
  if(completed.communication){
    const cLab=lang==='en'?{DIR:'Director',INS:'Inspirer',ANA:'Analyst',CON:'Connector'}:{DIR:'Directeur',INS:'Inspirateur',ANA:'Analyste',CON:'Connecteur'};
    html+=`<div class="sec">
    <h3>🗣️ ${lang==='en'?'Communication Style':'Style de Communication'}: <span style="color:var(--g600);">${csI.label}</span></h3>
    <div class="sec-desc">${csI.desc}</div>
    ${Object.entries({DIR:coms.DIR||0,INS:coms.INS||0,ANA:coms.ANA||0,CON:coms.CON||0}).map(([k,v])=>`
    <div class="trow"><div class="tlbl" style="font-size:11px;">${cLab[k]}</div><div class="tbw"><div class="tb${k===cs?' gold':''}" style="width:${p(v,15)}%"></div></div><div class="tpct">${p(v,15)}%</div></div>`).join('')}
    <p style="font-size:13px;font-weight:700;color:var(--g800);margin:14px 0 8px;">💡 ${lang==='en'?'Communication Growth Tips':'Conseils de Croissance en Communication'}</p>
    <ul style="padding-left:18px;">${csI.tips.map(t=>`<li style="font-size:13px;color:var(--muted);line-height:1.75;margin-bottom:5px;">${t}</li>`).join('')}</ul>
    </div>`;
  }

  // STRESS
  if(completed.stress){
    const sLab=lang==='en'?{PUSH:'Driver',RALLY:'Energiser',PLAN:'Strategist',CARE:'Nurturer'}:{PUSH:'Moteur',RALLY:'Énergiseur',PLAN:'Stratège',CARE:'Soignant'};
    html+=`<div class="sec">
    <h3>🌊 ${lang==='en'?'Stress Response Profile':'Profil de Réponse au Stress'}: <span style="color:var(--g600);">${ssI.label}</span></h3>
    <div class="sec-desc">${ssI.desc}</div>
    ${Object.entries({PUSH:strs.PUSH||0,RALLY:strs.RALLY||0,PLAN:strs.PLAN||0,CARE:strs.CARE||0}).map(([k,v])=>`
    <div class="trow"><div class="tlbl" style="font-size:11px;">${sLab[k]}</div><div class="tbw"><div class="tb${k===ss?' gold':''}" style="width:${p(v,15)}%"></div></div><div class="tpct">${p(v,15)}%</div></div>`).join('')}
    <div class="two-col">
      <div class="infobox">✅ <strong>${lang==='en'?'Best Recovery:':'Meilleure Récupération:'}</strong><br>${ssI.recovery}</div>
      <div class="warnbox">⚠️ <strong>${lang==='en'?'Watch For:':'Attention à:'}</strong><br>${ssI.watch}</div>
    </div>
    </div>`;
  }

  // SPIRITUAL
  html+=`<div class="spirit">
  <h3>${sp.title}</h3>
  <blockquote>${sp.verse}</blockquote>
  <p>${sp.p1}</p><p style="margin-top:12px;">${sp.p2}</p>
  <p style="margin-top:12px;">${sp.p3}</p>
  <p style="margin-top:12px;">${sp.p4}</p>
  <p class="italicline">${sp.italic}</p>
  <div class="sig">
    <p>${sp.sign}</p>
    <strong>${sp.name}</strong>
    <small>${sp.role}</small><br>
    <small style="display:block;margin-top:6px;opacity:.7;">${sp.copy}</small>
  </div>
  </div>`;

  html+=`<div class="action-row">
  <button class="pbtn" onclick="window.print()">${ui.print}</button>
  <button class="rbtn" onclick="if(confirm('${lang==='en'?'This will reset all your scores. Are you sure?':'Cela réinitialisera tous vos scores. Êtes-vous sûr(e) ?'}'))resetAll()">${ui.retake}</button>
  </div>`;

  cont.innerHTML=html;
}

function getTopValue(){return getTV();}

function resetAll(){
  scores={personality:{},leadership:{},emotional:{},values:{},communication:{},stress:{}};
  completed={personality:false,leadership:false,emotional:false,values:false,communication:false,stress:false};
  currentTest=null;currentQ=0;currentAnswers=[];
  updatePips();showSec('home');
}

// INIT
updatePips();renderHome();
</script>
</body>
</html>
