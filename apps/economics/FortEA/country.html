<style>

  --serif:'Fraunces', Georgia, serif; --sans:'Inter', -apple-system, sans-serif; --mono:'IBM Plex Mono', monospace;

}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.65; -webkit-font-smoothing:antialiased; overflow-x:hidden;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }
a{color:inherit;}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 24px;}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; letter-spacing:-0.01em; color:var(--ink);}
::selection{background:var(--cobalt); color:#fff;}

/* ---- top bar ---- */
.topbar{position:sticky; top:0; z-index:50; background:rgba(20,22,26,0.9); backdrop-filter:blur(10px); border-bottom:1px solid var(--line);}
.topbar-inner{max-width:var(--maxw); margin:0 auto; padding:12px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
.tb-back{font-family:var(--mono); font-size:12px; color:var(--ink-dim); text-decoration:none; display:flex; align-items:center; gap:6px; white-space:nowrap;}
.tb-back:hover{color:var(--ink);}
.tb-brand{font-family:var(--serif); font-weight:700; font-size:15px; white-space:nowrap;}
.tb-brand .mark{color:var(--copper); font-style:italic;}
.tb-switch{position:relative; margin-left:auto;}
.tb-switch select{
  max-width:min(220px, 44vw);
  background:var(--bg-card); border:1px solid var(--line); color:var(--ink); padding:8px 14px; border-radius:100px;
  font-family:var(--mono); font-size:12.5px; cursor:pointer;
}
@media (max-width:640px){
  .topbar-inner{padding:10px 16px;}
  .tb-brand{display:none;}
  .tb-back{font-size:11.5px;}
  .tb-switch{margin-left:0;}
  .tb-switch select{max-width:none; font-size:12px; padding:8px 12px;}
}

/* ---- header / hero ---- */
.c-hero{padding:56px 0 0; border-bottom:1px solid var(--line);}
.c-hero-top{display:flex; align-items:center; gap:16px; margin-bottom:18px; flex-wrap:wrap;}
.c-flag-big{font-size:52px; line-height:1;}
.c-hero h1{font-size:clamp(30px,4.5vw,46px); line-height:1.05;}
.c-hero .c-tagline{font-family:var(--mono); font-size:12.5px; color:var(--copper); text-transform:uppercase; letter-spacing:.08em; margin-top:6px;}
.c-quicklede{color:var(--ink-dim); font-size:16px; max-width:70ch; margin:20px 0 28px;}

/* live counter strip, specific to this country */
.live-strip{
  display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:16px;
  overflow:hidden; margin-bottom:0;
}
.live-cell{background:var(--bg-raised); padding:22px 20px;}
.live-cell .lc-label{font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint); margin-bottom:8px; display:flex; align-items:center; gap:6px;}
.live-cell .lc-label .pulse{width:6px; height:6px; border-radius:50%; background:var(--alert); animation:pulse 1.6s ease-in-out infinite; flex-shrink:0;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(1.3);}}
.live-cell .lc-value{font-family:var(--mono); font-size:clamp(20px,2.6vw,28px); font-weight:600; font-variant-numeric:tabular-nums;}
.live-cell.pop .lc-value{color:var(--verdigris);}
.live-cell.loss .lc-value{color:var(--copper);}
.live-cell.death .lc-value{color:var(--alert);}
@media (max-width:700px){ .live-strip{grid-template-columns:1fr;} }

.stat-rail .sr-item{flex:1; min-width:130px; padding-right:20px;}
.stat-rail .sr-item .v{font-family:var(--mono); font-size:19px; color:var(--gold); font-weight:600;}
.stat-rail .sr-item .l{font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; margin-top:4px;}

/* ---- tab nav ---- */

.tabnav::-webkit-scrollbar{display:none;}
.tabnav-inner{max-width:var(--maxw); margin:0 auto; padding:0 24px; display:flex; gap:4px; white-space:nowrap;}
.tab-btn{

.tab-btn:hover{color:var(--ink-dim);}
.tab-btn.active{color:var(--ink); border-bottom-color:var(--cobalt);}

.tab-panel{display:none;}
.tab-panel.active{display:block; animation:fadein .3s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);}to{opacity:1; transform:translateY(0);}}

.page-marker{

  sections:{
    overview:`
      <div class="page-marker">Page 1 of 5</div>
      <h2>A country stitched from two colonial empires, still negotiating the seam</h2>
      <p>Cameroon's modern shape is a product of a rare double colonial inheritance. German Kamerun was carved up after World War I between France and Britain as League of Nations mandates; French Cameroun became independent on 1 January 1960 under Ahmadou Ahidjo, and a year later the southern part of British Cameroons voted in a UN-supervised plebiscite to join it, forming the bilingual federation that still defines the country's English/French fault line today. The northern part of British Cameroons voted instead to join Nigeria — a decision whose long shadow includes present-day border and identity tensions.</p>
      <p>Ahidjo ruled as a one-party strongman until 1982, when he unexpectedly resigned and handed power to his prime minister, <strong>Paul Biya</strong> — who has now governed continuously for 43 years, making him one of the longest-serving heads of state in the world. Biya abolished the federal system in 1972 in favor of a unitary state, a move many Anglophone Cameroonians trace as the origin of today's marginalization grievances. Multiparty elections were nominally restored in 1992, but Biya's Cameroon People's Democratic Movement has never lost a presidential election since.</p>
      <div class="pullquote">"We are not fighting against the French language or against the French-speaking Cameroonians. We are fighting against a system, a system of marginalization." — a recurring refrain from Anglophone civil society since 2016</div>
      <p>The <strong>Anglophone Crisis</strong> ignited in late 2016 when lawyers and teachers in the Northwest and Southwest regions protested the imposition of French-trained judges and francophone teachers in English-speaking courts and classrooms. Government response escalated the protests into an armed separatist insurgency by 2017, seeking an independent state of "Ambazonia." The conflict has since displaced over a million people internally and driven tens of thousands into exile in Nigeria, while consuming a security budget that competes directly with development spending.</p>
      <p>The <strong>October 2025 presidential election</strong> — Biya's eighth term bid at age 92 — was followed by opposition claims of victory, contested results, and unrest that further destabilized the country's political and fiscal footing, compounding the succession uncertainty that has hung over Cameroon for over a decade.</p>
      <h3>Geography &amp; people</h3>
      <div class="two-col">
        <div class="mini-card"><h5>Physical geography</h5><p>Spans from Sahelian savanna in the Far North to dense equatorial rainforest in the South and East — the second-largest rainforest reserve in Africa after the DRC's — plus a volcanic coastal strip anchored by Mount Cameroon, the region's highest peak.</p></div>
        <div class="mini-card"><h5>Demography</h5><p>Over 250 ethnic groups and languages; roughly 40% of the population is under 15. Yaoundé (political capital) and Douala (economic capital and main port) anchor a rapidly urbanizing population still majority-rural in the north.</p></div>
      </div>
    `,
    economy:`
      <div class="page-marker">Page 2 of 5</div>
      <h2>A government perpetually one liquidity gap away from expensive borrowing</h2>
      <p>Cameroon has been under continuous IMF-supported adjustment since 2021, cycling through an Extended Credit Facility, Extended Fund Facility, and a Resilience and Sustainability Facility layered on top — three concurrent programs, each with its own conditionality and review schedule. The stated logic is to smooth fiscal consolidation while building climate resilience; in practice, oil royalties routed through the state hydrocarbons company <strong>SNH</strong> have repeatedly landed below the revenue projections each program was built around, and non-oil tax collection has similarly missed its own targets year after year.</p>
      <p>When the resulting fiscal gap needs covering, the state has increasingly turned to commercial, non-concessional borrowing rather than deeper structural reform. A December 2025 external loan carried a <strong>10.58% effective interest rate</strong> — extraordinarily expensive by sovereign-debt standards, and a rate that mathematically guarantees the next year's budget starts from a worse position than this one's.</p>
      <table class="info-table">
        <thead><tr><th>Fiscal indicator</th><th>Status</th><th>Why it matters</th></tr></thead>
        <tbody>
          <tr><td>Public debt-to-GDP</td><td class="num">~40%</td><td>Manageable on paper; the problem is the rising cost of servicing it</td></tr>
          <tr><td>IMF programs running concurrently</td><td class="num">3</td><td>Signals persistent, not cyclical, fiscal strain</td></tr>
          <tr><td>Dec 2025 commercial loan rate</td><td class="num">10.58%</td><td>Far above concessional multilateral rates (~1-2%)</td></tr>
          <tr><td>Anglophone crisis fiscal cost</td><td class="num">Ongoing</td><td>Security spending crowds out productive investment</td></tr>
        </tbody>
      </table>
      <div class="callout"><span class="co-label">The mechanism, plainly</span><p>Oil revenue underperforms → the budget gap must be filled → commercial lenders charge a premium for a government whose own revenue projections keep missing → next year's debt service is higher → less is left for the health, education and infrastructure spending that would actually grow the tax base. Every part of that chain is documented in Cameroon's own IMF Article IV consultations.</p></div>
      <h3>Where the state's money actually goes</h3>
      <p>Debt service, security spending tied to both the Anglophone conflict and Boko Haram-linked instability in the Far North, and a large public-sector wage bill dominate recurrent expenditure, leaving a comparatively thin envelope for the capital investment — roads, power, irrigation, processing infrastructure — that would let Cameroon's raw exports actually become the value-added economy the roadmap in Page 5 describes.</p>
    `,

      <p>The top five items alone generated about <strong>77.5%</strong> of Cameroon's $7.3B in total 2024 export earnings — and across all 20 goods listed here, all but the aluminium ingots and wood veneer leave the country in essentially raw or barely-transformed form. That concentration is the single biggest structural vulnerability in the entire economy: a bad cocoa harvest, an oil-price dip, or a timber-export policy change in a buyer country can each independently swing the national trade balance.</p>
      <h3>What Cameroon is actually losing</h3>
      <p><strong>Cocoa:</strong> the world's 4th-largest producer ships 180,000–250,000 tonnes of beans a year, almost entirely at the raw farm-gate export price. Global cocoa value-chain research consistently finds producing countries capture roughly 6-7% of a chocolate bar's final retail value — the beans themselves are typically worth less than a tenth of what the finished confectionery sells for once roasted, conched, tempered and branded, almost entirely outside Africa.</p>
      <div class="callout"><span class="co-label">The arithmetic</span><p>Raw beans: ~$4,400/tonne at export. The same tonne, once processed into finished chocolate: $25,000–35,000+. That is a <strong style="color:var(--copper)">6-8×</strong> value multiple created entirely after the bean leaves Cameroonian soil.</p></div>
      <p><strong>Timber:</strong> Cameroon holds 22.5 million hectares of rainforest, 17.5 million commercially exploitable — yet trade data shows roughly 82% of what leaves does so as sawn wood and 18% as raw logs, rather than furniture, flooring, veneer or engineered panel products, whose finished value runs several multiples higher per cubic metre.</p>
      <p><strong>Oil and gas:</strong> crude and LNG were roughly half of 2024 export earnings, yet Cameroon still imports refined fuel it could in principle produce domestically — and SNH's declining production combined with revenue transfers that have repeatedly undershot budget projections means the state doesn't even fully capture the value of the barrel it does export before it leaves the ground.</p>

      <div class="two-col">
        <div class="mini-card"><h5>01 · Infrastructure</h5><p>Grinding and conching facilities near Douala/Yaoundé for cocoa; sawmill-to-furniture and veneer plants in the East and South; reliable power and rail/road links from forest and farm belts to port.</p></div>
        <div class="mini-card"><h5>02 · Financing</h5><p>Processing plants need 7-10 year patient capital, not the short-tenor 10.6% commercial loans the state currently relies on — blended concessional and private-equity lines are the realistic route.</p></div>
        <div class="mini-card"><h5>03 · Skills</h5><p>Chocolate conching, furniture-grade wood finishing and refinery operation all require technical/vocational pipelines Cameroon does not yet run at national scale.</p></div>
        <div class="mini-card"><h5>04 · Policy</h5><p>A published, fixed-timetable rule requiring a rising minimum share of cocoa and timber processed domestically before export licensing — predictable enough for investors to plan around.</p></div>
      </div>
      <p style="margin-top:20px;"><strong>The narrative shift:</strong> a country that sells $1B of raw cocoa beans is a commodity exporter subject to whatever price futures markets in London and Abidjan set that week. A country that processes even 30-40% of that crop into butter, paste and finished chocolate is a manufacturing economy with pricing power, a broader tax base, and skilled jobs that don't disappear when the harvest is poor.</p>

    overview:`
      <div class="page-marker">Page 1 of 5</div>
      <h2>Africa's giant: 230 million people, a federation built to hold them together</h2>
      <p>Nigeria's roughly 230 million people make it Africa's most populous nation by a wide margin and one of the most populous countries on earth — with a median age under 18, its youth population alone will shape global demographics for decades. British colonial rule amalgamated a vast, ethnically and religiously diverse territory — over 250 ethnic groups, split roughly between a Muslim-majority north and Christian-majority south — into a single administrative unit in 1914, a fusion of convenience whose fault lines have run through Nigerian politics ever since.</p>
      <p>Independence arrived in 1960. Within seven years, ethnic and regional tensions — compounded by the discovery of oil in the Niger Delta and disputes over its revenue — erupted into the <strong>Nigerian Civil War (1967-1970)</strong>, when the southeastern region attempted to secede as the Republic of Biafra. The war killed an estimated one to three million people, most from famine caused by a federal blockade, and remains one of the most searing episodes in modern African history, still shaping regional political grievances today.</p>
      <div class="pullquote">A series of military coups and juntas governed Nigeria for most of the period between 1966 and 1999, interrupted only briefly by civilian rule — oil-revenue capture was, throughout, a central prize and driver of military factionalism.</div>
      <p>Democracy returned in 1999 with the election of Olusegun Obasanjo, beginning what is now Nigeria's longest continuous period of civilian, multiparty government. The capital moved from Lagos to the purpose-built city of <strong>Abuja</strong> in 1991, partly to sit at a more neutral, central point between the country's regional and religious blocs. <strong>Bola Tinubu</strong> has been president since 2023, presiding over the most consequential economic reforms — subsidy removal and currency float — in a generation.</p>
      <p>In the northeast, the <strong>Boko Haram</strong> insurgency, active since 2009, has killed tens of thousands and displaced millions, adding a persistent security and humanitarian burden layered on top of the country's economic challenges.</p>

      <h2>The 2023 reforms: necessary, brutal, and unfinished</h2>
      <p>For decades, Nigeria's federal government spent enormous and rising sums subsidizing domestic fuel prices — by 2023, subsidy spending was consuming a share of the federal budget larger than health and education combined, while an artificially fixed exchange rate created a lucrative arbitrage for those with access to official-rate dollars, starving the country of the foreign-currency liquidity a market-clearing rate would have provided.</p>
      <p>President Tinubu removed the fuel subsidy and floated the naira almost immediately upon taking office in 2023 — corrections that most economists agreed were structurally necessary, but which landed as a severe inflation shock on a population with almost no cushion against sudden price increases in fuel, transport and food.</p>

      <h3>What Nigeria is actually losing</h3>

      <h2>The independence pioneer, still writing the next chapter of that promise</h2>
      <p>Ghana — the former Gold Coast — became the first Sub-Saharan African country to gain independence from colonial rule, on 6 March 1957, under the charismatic pan-Africanist leader <strong>Kwame Nkrumah</strong>. Nkrumah's vision extended well beyond Ghana's own borders: he was a founding architect of the Organisation of African Unity and a leading voice for continental political and economic union, believing individual African states would remain vulnerable to exactly the extraction dynamics this report documents unless they coordinated as a bloc.</p>
      <p>Nkrumah was overthrown in a 1966 military coup, beginning a turbulent quarter-century of alternating civilian and military rule, including two periods under <strong>Jerry Rawlings</strong> — first as a coup leader in 1979 and 1981, later as an elected civilian president after Ghana's return to multiparty democracy in 1992. That 1992 transition proved durable: Ghana has now held multiple peaceful, competitive elections and power transfers between its two main parties, earning a reputation as one of the more stable democracies in the region.</p>
      <div class="pullquote">John Mahama returned to the presidency in January 2025 after winning the December 2024 election — his second, non-consecutive term, itself a marker of Ghana's now-routine practice of alternating governing parties through the ballot box rather than the barracks.</div>

        <div class="mini-card"><h5>Physical geography</h5><p>Coastal savanna and forest belt hosting the historic Gold Coast trading forts, transitioning to Sahelian conditions in the north; Accra anchors a rapidly growing coastal urban corridor.</p></div>
        <div class="mini-card"><h5>Economic base</h5><p>Gold, cocoa and, more recently, offshore oil (Jubilee and TEN fields) form the traditional export core, alongside a growing services and digital economy in Accra.</p></div>

      <h3>What Ghana is actually losing</h3>
      <p>Ghana grows roughly a fifth of the world's cocoa, yet processes under 30% of it domestically into butter, liquor or finished chocolate. COCOBOD, the state cocoa marketing board, sets a guaranteed farm-gate price for growers — a genuine social protection that has kept Ghanaian cocoa farming more stable than in some neighboring countries — but that guaranteed price is still set against a raw-bean benchmark, not the confectionery-shelf price the beans eventually generate once roasted and branded, overwhelmingly in Europe.</p>

      <h2>A genuine democratic strength, alongside an unresolved commodity-concentration risk</h2>
      <p>Ghana consistently outperforms most regional peers on governance indices and has never experienced the kind of prolonged authoritarian entrenchment seen in several other case studies in this report. Its 2025 corruption ranking sits notably ahead of Nigeria and several other African economies — a genuine institutional strength worth naming clearly, even within a report focused on structural economic vulnerability.</p>

      <p>Egypt's modern political history is dominated by the legacy of the <strong>1952 Free Officers coup</strong>, which ended the British-aligned monarchy and installed a republic under Gamal Abdel Nasser — a pan-Arabist leader whose nationalization of the Suez Canal in 1956 triggered a brief war with Britain, France and Israel, and whose broader vision of state-led industrialization and Arab unity shaped Egyptian politics for a generation.</p>

      <h2>The exception to Africa's colonial story — and a modern history of its own upheavals</h2>
      <p>Ethiopia holds a singular place in African history as the continent's only nation never subjected to sustained European colonial rule, successfully repelling an Italian invasion at the Battle of Adwa in 1896 — a victory that made Ethiopia a symbol of African sovereignty and resistance decades before most of the continent gained independence. A brief Italian occupation from 1936-1941 during the fascist era was the exception, ended by British-assisted liberation during World War II.</p>

      <p>The <strong>Tigray War (2020-2022)</strong>, fought between federal forces (allied with Eritrea) and the Tigray People's Liberation Front, killed an estimated several hundred thousand people through combat, famine and disease, and directly compounded Ethiopia's existing fiscal strain into full debt distress. A November 2022 peace agreement ended the active conflict, though reconstruction and reconciliation remain incomplete.</p>

      <h3>What Ethiopia is actually losing</h3>
      <p>Ethiopia is the birthplace of Arabica coffee and Africa's largest producer, yet the overwhelming majority of its crop is exported as unroasted green beans through the Ethiopian Commodity Exchange. The roasting stage — where a coffee's flavour, brand identity and the largest share of retail price are actually created — happens almost entirely in importing countries. A bag of specialty Ethiopian-origin beans can retail for many multiples of the green-bean export price once roasted and branded by a foreign roastery.</p>

        <div class="mini-card"><h5>03 · Q-grading &amp; roastery training</h5><p>Specialty-coffee grading certification and roastery operation training, so quality control and flavour-profile branding happen domestically.</p></div>
        <div class="mini-card"><h5>04 · Direct specialty-roaster partnerships</h5><p>Long-term contracts with specialty coffee brands for origin-roasted Ethiopian coffee, capturing the "single-origin" premium at home.</p></div>
      </div>
      <p style="margin-top:20px;"><strong>The narrative shift:</strong> Ethiopia is often described through its debt crisis and conflict. But the GERD proves something specific: when Ethiopians choose to finance something themselves, they can. A national roasting and branding push for coffee — using the same self-financing muscle the dam already proved exists — would apply that lesson to the export the whole world already associates with Ethiopia by name.</p>

      <h2>From Nobel Peace Prize to civil war within two years</h2>
      <p>Few recent African leadership trajectories illustrate the gap between international reception and domestic reality as starkly as Abiy Ahmed's. His 2019 Nobel Peace Prize, awarded for the Eritrea peace deal, arrived amid genuine hope for Ethiopia's political liberalization after decades of EPRDF authoritarian rule. Within roughly eighteen months, the federal government's conflict with the Tigray region — rooted in longstanding tensions over ethnic federalism and TPLF's marginalization after Abiy's rise — escalated into full civil war.</p>
      <div class="pullquote">The Tigray War killed an estimated several hundred thousand people through combat, famine and disease before a November 2022 peace agreement — a reminder that political liberalization and ethnic-federal stability are not automatically the same project, even under a genuinely reform-minded leader.</div>

        <div class="timeline-item"><div class="t-year">2021</div><h5>First Common Framework case</h5><p>Ethiopia becomes the first African country to seek debt treatment under the new G20 mechanism.</p></div>

    roadmap:`

      <h2>The roadmap beyond the trap</h2>
      <ol class="roadmap-list">
        <li><div><h5>Complete the remaining debt restructuring transparently, on a fixed timeline</h5><p>Avoiding the multi-year drift seen in comparable cases elsewhere on the continent.</p></div></li>
        <li><div><h5>Extend the GERD self-financing model to other strategic infrastructure</h5><p>Diaspora bonds and domestic capital mobilization, instead of defaulting to external borrowing by habit.</p></div></li>

<script id="render-script">
(function(){
  // ---------- Resolve which country to show ----------
  const params = new URLSearchParams(window.location.search);
  const validKeys = Object.keys(COUNTRIES);
  let key = params.get('c');
  if(!validKeys.includes(key)) key = 'cameroon';
  const data = COUNTRIES[key];

  // ---------- Populate header ----------
  document.title = data.name + ' — Full Report | ForTe Economics';
  document.getElementById('c-flag').textContent = data.flag;
  document.getElementById('c-name').textContent = data.name;
  document.getElementById('c-tagline').textContent = data.tagline;
  document.getElementById('c-lede').textContent = data.lede;

  const statRail = document.getElementById('stat-rail');
  statRail.innerHTML = data.stats.map(function(s){
    return '<div class="sr-item"><div class="v">'+s[0]+'</div><div class="l">'+s[1]+'</div></div>';
  }).join('');

  // ---------- Populate tab panels ----------
  document.getElementById('panel-overview').innerHTML = data.sections.overview;
  document.getElementById('panel-economy').innerHTML = data.sections.economy;
  document.getElementById('panel-resources').innerHTML = data.sections.resources;
  document.getElementById('panel-governance').innerHTML = data.sections.governance;
  document.getElementById('panel-roadmap').innerHTML = data.sections.roadmap;

  // Cross-links specific to certain countries
  if(key === 'cameroon'){
    document.getElementById('panel-roadmap').innerHTML += '<div class="callout" style="border-left-color:var(--verdigris); margin-top:8px;"><span class="co-label" style="color:var(--verdigris);">Worked policy example</span><p>Cameroon\'s mining sector is the fully worked example in ForTe Economics\' <a href="policy-paper.html" target="_blank" rel="noopener" style="color:var(--verdigris); text-decoration:underline;">full Policy Paper for governments</a> — including a documented ~700× gap between reported and recorded gold exports, and a step-by-step reform roadmap.</p></div>';
  }
  if(key === 'nigeria'){
    document.getElementById('panel-roadmap').innerHTML += '<div class="callout" style="border-left-color:var(--copper); margin-top:8px;"><span class="co-label" style="color:var(--copper);">Success study</span><p>Nigeria\'s refining turnaround is the central case in ForTe Economics\' <a href="dangote.html" target="_blank" rel="noopener" style="color:var(--copper); text-decoration:underline;">deep study of the Dangote method</a> — backward integration, in the words of the person who has spent the most capital proving it works.</p></div>';
  }

  // ---------- Country switcher dropdown ----------
  const switchEl = document.getElementById('country-switch');
  const labels = {
    cameroon:"🇨🇲 Cameroon", drc:"🇨🇩 DR Congo", nigeria:"🇳🇬 Nigeria", ghana:"🇬🇭 Ghana",
    egypt:"🇪🇬 Egypt", tunisia:"🇹🇳 Tunisia", kenya:"🇰🇪 Kenya", ethiopia:"🇪🇹 Ethiopia",
    zambia:"🇿🇲 Zambia", southafrica:"🇿🇦 South Africa"
  };
  switchEl.innerHTML = validKeys.map(function(k){
    return '<option value="'+k+'"'+(k===key?' selected':'')+'>'+ (labels[k] || COUNTRIES[k].name) +'</option>';
  }).join('');
  switchEl.addEventListener('change', function(){
    window.location.href = 'country.html?c=' + switchEl.value;
  });

  // ---------- Tab switching ----------
  const tabBtns = document.querySelectorAll('.tab-btn');
  const panels = {
    overview: document.getElementById('panel-overview'),
    economy: document.getElementById('panel-economy'),
    resources: document.getElementById('panel-resources'),
    governance: document.getElementById('panel-governance'),
    roadmap: document.getElementById('panel-roadmap')
  };
  tabBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      tabBtns.forEach(function(b){ b.classList.remove('active'); });
      Object.values(panels).forEach(function(p){ p.classList.remove('active'); });
      btn.classList.add('active');
      panels[btn.dataset.tab].classList.add('active');
      window.scrollTo({top: document.querySelector('.c-hero').offsetHeight - 40, behavior:'smooth'});
    });
  });

  // ---------- Live counters, specific to this country ----------
  const BASELINE = new Date('2026-01-01T00:00:00Z').getTime();
  const c = data.clock;

  function fmtInt(n){ return Math.round(n).toLocaleString('en-US'); }
  function fmtUSDShort(n){
    if(n >= 1e9) return '$' + (n/1e9).toFixed(2) + 'B';
    if(n >= 1e6) return '$' + (n/1e6).toFixed(2) + 'M';
    if(n >= 1e3) return '$' + (n/1e3).toFixed(0) + 'K';
    return '$' + Math.round(n);
  }

  const popEl = document.getElementById('live-pop');
  const lossEl = document.getElementById('live-loss');
  const deathEl = document.getElementById('live-death');

  function tick(){
    const now = Date.now();
    const yearsElapsed = (now - BASELINE) / (365.25 * 24 * 3600 * 1000);
    const livePop = c.pop * Math.pow(1 + c.rate, yearsElapsed);

    const d = new Date(now);
    const secondsSinceMidnightUTC = d.getUTCHours()*3600 + d.getUTCMinutes()*60 + d.getUTCSeconds() + d.getUTCMilliseconds()/1000;
    const dayFraction = secondsSinceMidnightUTC / 86400;

    const lossToday = c.dailyLossUSD * dayFraction;
    const deathsToday = c.dailyDeaths * dayFraction;

    popEl.textContent = fmtInt(livePop);
    lossEl.textContent = fmtUSDShort(lossToday);
    deathEl.textContent = fmtInt(deathsToday);
  }

  tick();
  setInterval(tick, 1000);
})();

</script>
