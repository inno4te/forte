<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forte — Team21 Academy &amp; inno4te Platform</title>
<meta name="description" content="Forte unifies every Team21 Academy, Forte and inno4te project in one searchable portal.">
<link rel="icon" href="data:,"><link rel="stylesheet" href="assets/forte.css">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="./">FOR<b>TE</b></a><span class="spacer"></span>
  <nav><a class="hide-sm" href="#catalog">Catalog</a><a class="hide-sm" href="docs/ARCHITECTURE.md">Docs</a><a href="admin/" class="btn ghost">Admin</a></nav>
</div></header>
<main class="wrap">
  <section class="hero">
    <h1>One platform.<br><span>Every Forte project.</span></h1>
    <p id="tag">Learning, AI programs, certification, consulting, Africa economics, health and everyday apps — unified.</p>
    <div class="stats" id="stats"></div>
  </section>
  <section id="catalog">
    <div class="tools"><input type="search" id="q" placeholder="Search projects…" aria-label="Search projects"></div>
    <div class="chips" id="chips" role="group" aria-label="Filter by area"></div>
    <div id="out"></div>
  </section>
  <footer>© Innocent Forteh · Team21 Academy · inno4te. Forte consolidates 72 formerly separate repositories.</footer>
</main>
<script src="data/registry.public.js"></script>
<script src="assets/common.js"></script>
<script>
(()=>{
const R=window.FORTE_REGISTRY, F=Forte, $=s=>document.querySelector(s);
let dom="all";
$("#tag").textContent=R.tagline;
const bytes=R.projects.reduce((a,p)=>a+p.bytes,0);
$("#stats").innerHTML=[[R.projects.length,"projects"],[Object.keys(R.domains).length,"areas"],[R.projects.filter(p=>p.tech.includes("Android")||p.tech.includes("Capacitor")).length,"mobile builds"],[F.fmtBytes(bytes),"total content"]]
 .map(([b,l])=>`<div class="stat"><b>${b}</b><span>${l}</span></div>`).join("");
const doms=Object.entries(R.domains).filter(([k])=>R.projects.some(p=>p.domain===k));
$("#chips").innerHTML=[["all",{title:"All"}],...doms].map(([k,d])=>`<button class="chip" data-d="${k}" aria-pressed="${k===dom}">${F.esc(d.title)}</button>`).join("");
$("#chips").onclick=e=>{const b=e.target.closest("[data-d]");if(!b)return;dom=b.dataset.d;document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b));render();};
$("#q").oninput=render;
function render(){
  const q=$("#q").value.trim().toLowerCase();
  const list=R.projects.filter(p=>(dom==="all"||p.domain===dom)&&(!q||(p.title+" "+p.name+" "+p.description).toLowerCase().includes(q)));
  if(!list.length){$("#out").innerHTML='<p class="empty">No projects match.</p>';return;}
  $("#out").innerHTML=doms.map(([k,d])=>{const ps=list.filter(p=>p.domain===k);
    return ps.length?`<h2 class="dom">${F.esc(d.title)}</h2><p class="blurb">${F.esc(d.blurb)}</p><div class="grid">${ps.map(p=>F.card(p,"",false)).join("")}</div>`:"";}).join("");
}
render();
})();
</script>
</body>
</html>
